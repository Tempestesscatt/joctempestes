<style>
/* ═══════════════════════════════════════════════════════════════════
   VARIABLES GLOBALS
   ═══════════════════════════════════════════════════════════════════ */
:root {
    --bg: #0d1117;
    --panel: #0d1117;
    --panel-2: #161b22;
    --panel-hover: #1c2128;
    --line: rgba(240, 246, 252, 0.07);
    --line-strong: rgba(240, 246, 252, 0.15);
    --accent: #58a6ff;
    --accent-soft: rgba(88, 166, 255, 0.12);
    --gold: #ffd700;
    --gold-soft: rgba(255, 215, 0, 0.12);
    --gold-line: rgba(255, 215, 0, 0.28);
    --ok: #3fb950;
    --warn: #d29922;
    --danger: #f85149;
    --text: #f0f6fc;
    --text-2: #c9d1d9;
    --muted: #8b949e;
    --muted-2: #6e7681;
    --panel-width: 280px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
    width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none; font-size: 13px;
    touch-action: manipulation;
}

#map {
    position: absolute; inset: 0; width: 100%; height: 100%;
    background: #0e1620;
    touch-action: none;
}

body::before {
    content: ""; position: fixed; inset: 0; z-index: 400; pointer-events: none;
    background:
        linear-gradient(180deg, rgba(13, 17, 23, 0.35), transparent 10%),
        linear-gradient(0deg, rgba(13, 17, 23, 0.35), transparent 12%);
}

/* ═══════════════════════════════════════════════════════════════════
   SKEW-T FLOTANT
   ═══════════════════════════════════════════════════════════════════ */
.skewt-flotant {
    position: fixed; z-index: 8800;
    background: var(--panel-2); border: 1px solid var(--line-strong);
    border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    font-family: 'Inter', system-ui, sans-serif; color: var(--text-2);
    display: flex; flex-direction: column; overflow: hidden;
    max-height: calc(100vh - 24px);
}
.skewt-flotant-cap {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    background: rgba(0,0,0,0.15); flex-shrink: 0; cursor: move; user-select: none;
}
.skewt-flotant-titol {
    font-size: 12.5px; font-weight: 700; color: var(--text);
    display: flex; align-items: center; gap: 8px;
}
.skewt-flotant-coord {
    font-size: 10px; color: var(--muted);
    font-family: monospace; font-weight: 500;
}
.skewt-flotant-botons { display: flex; gap: 4px; }
.skewt-flotant-boto-ico {
    background: none; border: none; color: var(--muted); cursor: pointer;
    width: 26px; height: 26px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; font-size: 14px; padding: 0;
}
.skewt-flotant-boto-ico:hover { background: var(--panel-hover); color: var(--text); }
.skewt-flotant-cos {
    padding: 0; overflow: hidden; flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: column;
}
.skewt-flotant-carregant {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 30px 20px;
    color: var(--muted); font-size: 12px; flex: 1;
}
.skewt-flotant-spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--line-strong);
    border-top-color: var(--accent); border-radius: 50%;
    animation: gira 0.9s linear infinite;
}
.skewt-flotant-error {
    padding: 18px 20px; text-align: center; color: var(--danger);
    font-size: 12.5px; line-height: 1.5;
}
@media (max-width: 860px) {
    .skewt-flotant {
        left: calc(8px + var(--safe-left)) !important;
        right: calc(8px + var(--safe-right)) !important;
        top: calc(8px + var(--safe-top)) !important;
        bottom: calc(8px + var(--safe-bottom)) !important;
        width: auto !important; max-width: none !important; max-height: none !important;
    }
}

/* ═══════════════════════════════════════════════════════════════════
   ETIQUETA D'HORA
   ═══════════════════════════════════════════════════════════════════ */
#current_time_label {
    position: fixed;
    top: calc(14px + var(--safe-top));
    left: calc(var(--panel-width) + ((100vw - var(--panel-width)) / 2) + var(--safe-left));
    transform: translateX(-50%);
    z-index: 950;
    min-height: 34px;
    display: flex; align-items: center;
    padding: 7px 16px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: rgba(13, 17, 23, 0.88);
    color: var(--text);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    font-size: 12.5px; font-weight: 600; letter-spacing: 0.2px;
    pointer-events: none; white-space: nowrap;
    transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
body.panell-plegat #current_time_label { left: calc(50vw + var(--safe-left)); }
#current_time_label:empty { display: none; }

/* ═══════════════════════════════════════════════════════════════════
   INFO RUN
   ═══════════════════════════════════════════════════════════════════ */
#info_run {
    position: fixed;
    top: calc(14px + var(--safe-top));
    right: calc(16px + var(--safe-right));
    z-index: 950;
    min-height: 34px;
    display: none; align-items: center; gap: 8px;
    padding: 7px 14px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: rgba(13, 17, 23, 0.88);
    color: var(--text-2);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(20px) saturate(150%);
    font-size: 11.5px; font-weight: 500;
    pointer-events: none; white-space: nowrap;
}
#info_run.visible { display: inline-flex; }
#info_run .punt {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok); box-shadow: 0 0 8px var(--ok);
    flex: 0 0 auto; animation: pols 2s ease-in-out infinite;
}
@keyframes pols { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
#info_run .run { color: var(--text); font-weight: 700; font-family: 'SF Mono', monospace; }
#info_run .sep { color: var(--muted-2); }
#info_run .fa { color: var(--muted); font-size: 11px; }

/* ═══════════════════════════════════════════════════════════════════
   PANELL LATERAL
   ═══════════════════════════════════════════════════════════════════ */
#panell-pro {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: var(--panel-width); z-index: 700;
    display: flex; flex-direction: column;
    background: var(--panel);
    border-right: 1px solid var(--line);
    color: var(--text-2); overflow: hidden;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    font-family: 'Inter', system-ui, sans-serif;
}
#panell-pro.plegat { transform: translateX(-100%); }

#btn-obrir-panell {
    position: fixed;
    top: calc(14px + var(--safe-top));
    left: calc(14px + var(--safe-left));
    z-index: 800;
    background: rgba(13, 17, 23, 0.9);
    color: var(--text);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(12px);
    display: none; align-items: center; gap: 8px;
    font-family: inherit;
    transition: all 0.15s ease;
}
#btn-obrir-panell.visible { display: inline-flex; }
#btn-obrir-panell:hover { background: var(--panel-hover); border-color: var(--accent); }

.pp-cap {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 10px;
    flex-shrink: 0;
}
.pp-titol {
    font-size: 11.5px; font-weight: 700; color: var(--text);
    letter-spacing: 0.6px; text-transform: uppercase;
}
.pp-sub { font-size: 10px; color: var(--muted); margin-top: 2px; }
.pp-plega {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
    transition: all 0.15s ease;
    flex-shrink: 0;
}
.pp-plega:hover { color: var(--text); background: var(--panel-hover); border-color: var(--line-strong); }
.pp-plega svg { display: block; }

.pp-user-bar {
    margin: 0 14px 10px;
    display: flex; align-items: center; gap: 6px;
    flex-shrink: 0;
}
.pp-user-bar button {
    flex: 1;
    padding: 8px 10px;
    font-size: 11px; font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-2);
    font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: all 0.15s ease;
}
.pp-user-bar button:hover { background: var(--panel-hover); color: var(--text); }
.pp-user-bar button.primary {
    background: var(--accent-soft);
    border-color: rgba(88, 166, 255, 0.35);
    color: var(--accent);
}
.pp-user-bar button.primary:hover { background: rgba(88, 166, 255, 0.2); }
.pp-user-bar button .avatar {
    width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700;
    color: #0d1117;
    background: linear-gradient(135deg, var(--gold), #ffb300);
    overflow: hidden;
}
.pp-user-bar button .avatar img { width: 100%; height: 100%; object-fit: cover; }

.pp-actual {
    margin: 0 14px 12px;
    padding: 9px 12px;
    border-radius: 6px;
    background: var(--accent-soft);
    border: 1px solid rgba(88, 166, 255, 0.25);
    font-size: 12.5px;
    color: var(--accent);
    font-weight: 600;
    display: flex; justify-content: space-between; gap: 8px;
    align-items: center;
    flex-shrink: 0;
}
.pp-actual span:last-child {
    color: var(--muted); font-weight: 500;
    white-space: nowrap; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.5px;
}

.pp-tabs {
    display: flex; gap: 0; padding: 0 16px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
}
.pp-tab {
    flex: 1; padding: 9px 4px;
    font-size: 10.5px; font-weight: 600;
    cursor: pointer; background: transparent; color: var(--muted);
    font-family: inherit; border: none;
    border-bottom: 2px solid transparent;
    transition: all 0.15s ease; letter-spacing: 0.5px; text-transform: uppercase;
}
.pp-tab:hover { color: var(--text-2); }
.pp-tab.actiu { color: var(--accent); border-bottom-color: var(--accent); }

.pp-cos {
    display: none; flex-direction: column;
    min-height: 0; flex: 1 1 0; overflow: hidden;
}
.pp-cos.actiu { display: flex; }

.pp-cerca { position: relative; margin: 12px 14px 8px; flex-shrink: 0; }
.pp-cerca input {
    width: 100%; box-sizing: border-box;
    padding: 8px 30px 8px 32px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text); font-size: 12px;
    outline: none; font-family: inherit;
}
.pp-cerca input:focus { border-color: var(--accent); }
.pp-cerca input::placeholder { color: var(--muted-2); }
.pp-cerca .ico {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none; display: flex;
}
.pp-cerca .ico svg { display: block; }
.pp-cerca .esb {
    position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--muted); cursor: pointer;
    width: 24px; height: 24px; display: none;
    align-items: center; justify-content: center; padding: 0;
}
.pp-cerca .esb:hover { color: var(--text); }
.pp-cerca .esb svg { display: block; }

.pp-llista {
    overflow-y: auto; padding: 0 8px 14px;
    min-height: 0; flex: 1 1 0;
    -webkit-overflow-scrolling: touch;
}
.pp-llista::-webkit-scrollbar { width: 5px; }
.pp-llista::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }

.sec { margin-bottom: 1px; }
.sec-cap {
    display: flex; align-items: center; gap: 9px;
    width: 100%; padding: 9px 10px;
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.6px;
    text-align: left; font-family: inherit;
    border-radius: 5px; transition: background 0.12s ease;
}
.sec-cap:hover { background: var(--panel-hover); color: var(--text-2); }
.sec-punt { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }
.sec-nom { flex: 1; }
.sec-n {
    font-size: 9.5px; font-weight: 600; color: var(--muted-2);
    background: var(--panel-2); padding: 1px 6px; border-radius: 8px;
}
.sec-fletxa { color: var(--muted-2); transition: transform 0.15s ease; display: flex; }
.sec-fletxa svg { display: block; }
.sec.oberta .sec-fletxa { transform: rotate(90deg); }
.sec-cos {
    display: none; padding: 0 0 4px 8px;
    margin-left: 12px; border-left: 1px solid var(--line);
}
.sec.oberta .sec-cos { display: block; }

.param-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; padding: 7px 10px; margin: 0;
    border-radius: 5px; cursor: pointer;
    font-size: 12.5px; color: var(--text-2);
    font-weight: 400; transition: background 0.12s ease;
    line-height: 1.3;
}
.param-row:hover { background: var(--panel-hover); color: var(--text); }
.param-row.param-selected {
    background: var(--accent-soft);
    color: var(--accent); font-weight: 600;
    box-shadow: inset 2px 0 0 var(--accent);
}
.param-row.premium-bloquejat {
    opacity: 0.4;
    filter: grayscale(0.7);
    cursor: not-allowed;
}
.param-row .unitat {
    font-size: 9.5px; color: var(--muted-2);
    white-space: nowrap; text-transform: uppercase;
    letter-spacing: 0.4px; font-weight: 500;
}
.param-row.param-selected .unitat { color: var(--accent); opacity: 0.8; }

.pp-buit {
    color: var(--muted-2); font-size: 12px;
    text-align: center; padding: 22px 10px;
}

.ciu-fila {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; margin: 0;
    border-radius: 5px; cursor: pointer;
}
.ciu-fila:hover { background: var(--panel-hover); }
.ciu-fila.sel { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.ciu-pin {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); border: 1.5px solid var(--text);
    flex: 0 0 auto;
}
.ciu-pin.cap { background: var(--gold); }
.ciu-nom { flex: 1; font-size: 12.5px; color: var(--text); font-weight: 500; }
.ciu-pob { font-size: 10px; color: var(--muted); }
.ciu-info { padding: 0 16px 6px; font-size: 10px; color: var(--muted); flex-shrink: 0; }
.ciu-treu {
    margin: 0 14px 8px; padding: 7px 10px;
    font-size: 11px; font-weight: 600; cursor: pointer;
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px;
    font-family: inherit; display: none;
    align-items: center; gap: 6px;
    flex-shrink: 0;
}
.ciu-treu:hover { color: var(--text); background: var(--panel-hover); }

.capes-cos { padding: 8px 16px 18px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.cap-titol {
    font-size: 9.5px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.8px;
    margin: 14px 0 2px; padding-bottom: 4px;
}
.cap-fila {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; font-size: 12.5px; color: var(--text-2);
    cursor: pointer; user-select: none;
}
.cap-fila:hover { color: var(--text); }
.interruptor {
    width: 30px; height: 17px; border-radius: 9px;
    background: var(--panel-2); border: 1px solid var(--line-strong);
    position: relative; transition: all 0.18s ease; flex: 0 0 auto;
}
.interruptor::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--muted); transition: all 0.18s ease;
}
.cap-fila.on .interruptor { background: var(--accent-soft); border-color: var(--accent); }
.cap-fila.on .interruptor::after { transform: translateX(13px); background: var(--accent); }

.ctrl-label {
    display: block; font-size: 9.5px; color: var(--muted);
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px;
    margin: 10px 0 5px;
}
.ctrl-select {
    width: 100%; background: var(--panel-2);
    border: 1px solid var(--line); color: var(--text);
    padding: 7px 9px; border-radius: 6px;
    font-size: 12px; font-family: inherit; outline: none; cursor: pointer;
}
.ctrl-select option { background: var(--panel); color: var(--text); }
#panell-pro input[type=range] { width: 100%; accent-color: var(--accent); }
.cap-reset {
    margin-top: 16px; width: 100%; padding: 8px;
    font-size: 10.5px; font-weight: 600; cursor: pointer;
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px;
    font-family: inherit; text-transform: uppercase;
    letter-spacing: 0.5px;
}
.cap-reset:hover { color: var(--text); background: var(--panel-hover); }

.llegenda-css {
    position: fixed;
    right: calc(16px + var(--safe-right));
    bottom: calc(80px + var(--safe-bottom));
    width: 170px;
    background: rgba(15, 20, 32, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    padding: 8px 10px;
    font: 600 11px 'Inter', system-ui, sans-serif;
    color: #e8eef8;
    z-index: 510;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    pointer-events: none;
}
.llegenda-css .lc-titol {
    font-size: 11.5px; font-weight: 700; margin-bottom: 6px; color: #fff;
    letter-spacing: 0.2px;
}
.llegenda-css .lc-unitat {
    font-size: 10px; opacity: 0.7; font-weight: 500; margin-left: 4px;
}
.llegenda-css .lc-fila {
    display: flex; align-items: center; gap: 6px;
    margin: 2px 0; font-size: 10.5px;
}
.llegenda-css .lc-color {
    width: 22px; height: 11px; border-radius: 2px;
    flex-shrink: 0; border: 1px solid rgba(0, 0, 0, 0.35);
}
.llegenda-css .lc-valor { font-variant-numeric: tabular-nums; }

#dock {
    position: fixed;
    left: calc(var(--panel-width) + 16px + var(--safe-left));
    right: calc(90px + var(--safe-right));
    bottom: calc(14px + var(--safe-bottom));
    z-index: 900;
    height: 48px; display: flex; align-items: center; gap: 6px;
    padding: 4px; border: 1px solid var(--line); border-radius: 10px;
    background: rgba(13, 17, 23, 0.88);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.25s ease;
}
body.panell-plegat #dock { left: calc(16px + var(--safe-left)); }

#btnPlay {
    flex: 0 0 auto; height: 38px; padding: 0 14px;
    border: 1px solid transparent; border-radius: 6px;
    background: transparent; color: var(--text-2);

     CONTROLS DEL DOCK
     ═══════════════════════════════════════════════════════════════════ -->
<script>
(function () {
    'use strict';

    function $(id) { return document.getElementById(id); }

    window.actualitzarControlsDock = function () {
        const btnIso = $('btnIsolines');
        const btnVent = $('btnVent');
        if (!btnIso) return;

        const teIso = window.variableActivaTeIsolines ? window.variableActivaTeIsolines() : true;
        if (teIso) {
            btnIso.disabled = false;
            btnIso.classList.toggle('actiu', !!window.MOSTRAR_ISOLINIES);
            btnIso.title = window.MOSTRAR_ISOLINIES ? 'Desactivar isolínies' : 'Activar isolínies';
        } else {
            btnIso.disabled = true;
            btnIso.classList.remove('actiu');
            btnIso.title = 'Aquesta variable no té isolínies';
        }

        const teVent = window.variableActivaTeStreamlines ? window.variableActivaTeStreamlines() : true;
        if (teVent) {
            btnVent.disabled = false;
            btnVent.classList.toggle('actiu', !!window.MOSTRAR_VENT);
        } else {
            btnVent.disabled = true;
            btnVent.classList.remove('actiu');
        }
    };

    function inicialitzarControls() {
        const btnPrev = $('btnPrev');
        const btnNext = $('btnNext');
        const selVel = $('selVelocitat');
        const btnIso = $('btnIsolines');
        const btnVent = $('btnVent');

        if (btnPrev) btnPrev.addEventListener('click', () => {
            if (window.canviarHora) window.canviarHora(-1);
        });
        if (btnNext) btnNext.addEventListener('click', () => {
            if (window.canviarHora) window.canviarHora(+1);
        });

        if (selVel) {
            if (window.getVelocitatAnimacio) selVel.value = String(window.getVelocitatAnimacio());
            selVel.addEventListener('change', () => {
                const v = parseInt(selVel.value, 10);
                if (!isNaN(v) && window.canviarVelocitatAnimacio) {
                    window.canviarVelocitatAnimacio(v);
                }
            });
        }

        if (btnIso) btnIso.addEventListener('click', () => {
            if (btnIso.disabled) return;
            window.MOSTRAR_ISOLINIES = !window.MOSTRAR_ISOLINIES;
            if (typeof guardarCapes === 'function') guardarCapes();
            if (typeof refrescarVentIsolines === 'function') refrescarVentIsolines();
            window.actualitzarControlsDock();
        });

        if (btnVent) btnVent.addEventListener('click', () => {
            if (btnVent.disabled) return;
            window.MOSTRAR_VENT = !window.MOSTRAR_VENT;
            if (typeof guardarCapes === 'function') guardarCapes();
            if (typeof programarRedibuix === 'function') programarRedibuix();
            window.actualitzarControlsDock();
        });

        setTimeout(window.actualitzarControlsDock, 800);
        setTimeout(window.actualitzarControlsDock, 2000);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', inicialitzarControls);
    } else {
        inicialitzarControls();
    }
})();
</script>

<!-- ═══════════════════════════════════════════════════════════════════
     MODALS + LOGIN + PERFIL + INFO RUN
     ═══════════════════════════════════════════════════════════════════ -->
<script>
(function () {
    'use strict';

    window.obrirModal = function (id) {
        const el = document.getElementById(id);
        if (el) el.classList.add('active');
    };
    window.tancarModal = function (id) {
        const el = document.getElementById(id);
        if (el) el.classList.remove('active');
    };

    document.querySelectorAll('.modal-overlay').forEach(m => {
        m.addEventListener('click', e => {
            if (e.target === m) m.classList.remove('active');
        });
    });
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
        }
    });

    async function obtenirNomUsuari(user) {
        if (!user) return null;
        try {
            const r = await fetch(`https://tempestescat-default-rtdb.firebaseio.com/users/${user.uid}.json`);
            const d = await r.json();
            if (d && d.nomPersonalitzat) return d.nomPersonalitzat;
        } catch (e) {}
        const local = localStorage.getItem(`nom_usuari_${user.uid}`);
        if (local) return local;
        return user.displayName || (user.email ? user.email.split('@')[0] : 'Usuari');
    }

    async function haCanviatNom(user) {
        if (!user) return false;
        try {
            const r = await fetch(`https://tempestescat-default-rtdb.firebaseio.com/users/${user.uid}.json`);
            const d = await r.json();
            if (d && d.nomCanviat === true) return true;
        } catch (e) {}
        const local = localStorage.getItem(`nom_info_${user.uid}`);
        if (local) { try { return JSON.parse(local).canviat === true; } catch (e) {} }
        return false;
    }

    window.openProfile = async function () {
        const user = window._firebaseUser;
        if (!user) { obrirModal('modalLogin'); return; }
        const nom = await obtenirNomUsuari(user);
        const canviat = await haCanviatNom(user);
        document.getElementById('perfilNom').value = nom;
        document.getElementById('perfilEmail').value = user.email || '';
        const inp = document.getElementById('perfilNom');
        inp.disabled = canviat;
        inp.title = canviat ? 'El nom només es pot canviar 1 vegada' : '';
        obrirModal('modalPerfil');
    };

    window.desarPerfil = async function () {
        const user = window._firebaseUser;
        if (!user) return;
        const nom = document.getElementById('perfilNom').value.trim();
        if (nom.length < 3) { alert('El nom ha de tenir mínim 3 caràcters'); return; }
        if (nom.length > 20) { alert('El nom ha de tenir màxim 20 caràcters'); return; }
        const jaCanviat = await haCanviatNom(user);
        if (jaCanviat) { alert('El nom ja s\'ha canviat un cop'); return; }
        try {
            const token = await user.getIdToken();
            await fetch(`https://tempestescat-default-rtdb.firebaseio.com/users/${user.uid}.json?auth=${token}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    uid: user.uid, email: user.email,
                    nomPersonalitzat: nom, nomCanviat: true,
                    dataCanvi: new Date().toISOString()
                })
            });
            localStorage.setItem(`nom_usuari_${user.uid}`, nom);
            localStorage.setItem(`nom_info_${user.uid}`, JSON.stringify({ canviat: true }));
            alert('Nom canviat correctament!');
            tancarModal('modalPerfil');
            actualitzarUIUsuari(user);
        } catch (e) {
            alert('Error guardant el nom');
        }
    };

    async function actualitzarUIUsuari(user) {
        const btnLogin = document.getElementById('ppBtnLogin');
        const btnPerfil = document.getElementById('ppBtnPerfil');
        if (!btnLogin || !btnPerfil) return;
        if (user) {
            const nom = await obtenirNomUsuari(user);
            const inicial = nom.charAt(0).toUpperCase();
            const foto = user.photoURL || '';
            btnLogin.style.display = 'none';
            btnPerfil.style.display = 'flex';
            btnPerfil.innerHTML = `
                <span class="avatar">${foto ? `<img src="${foto}" alt="">` : inicial}</span>
                <span>${nom}</span>
            `;
        } else {
            btnLogin.style.display = 'flex';
            btnPerfil.style.display = 'none';
        }
    }

    window.addEventListener('tc:login', e => actualitzarUIUsuari(e.detail));
    window.addEventListener('tc:logout', () => actualitzarUIUsuari(null));

    window.obtenirNomUsuari = obtenirNomUsuari;
    window.haCanviatNom = haCanviatNom;
    window.actualitzarUIUsuari = actualitzarUIUsuari;

    function rutaBase() {
        const p = window.location.pathname;
        return p.substring(0, p.lastIndexOf('/') + 1);
    }

    async function carregarInfoRun() {
        const base = rutaBase();
        const urls = [
            base + 'web_data_GFS/imatges/info_run.json',
            '/web_data_GFS/imatges/info_run.json',
            '/public/web_data_GFS/imatges/info_run.json',
        ];
        for (const url of urls) {
            try {
                const r = await fetch(url + '?_cb=' + Date.now(), { cache: 'no-store' });
                if (!r.ok) continue;
                const ct = r.headers.get('content-type') || '';
                if (ct.includes('text/html')) continue;
                return await r.json();
            } catch (e) {}
        }
        return null;
    }

    function formatDataRun(info) {
        if (info.run_iso) {
            const ms = Date.parse(info.run_iso);
            if (isFinite(ms)) {
                const d = new Date(ms);
                const dia = String(d.getDate()).padStart(2, '0');
                const mes = String(d.getMonth() + 1).padStart(2, '0');
                const hora = String(d.getHours()).padStart(2, '0');
                const min = String(d.getMinutes()).padStart(2, '0');
                return `${dia}/${mes} · ${hora}:${min}`;
            }
        }
        if (info.run_ts && isFinite(info.run_ts)) {
            const ms = info.run_ts > 1e12 ? info.run_ts : info.run_ts * 1000;
            const d = new Date(ms);
            const dia = String(d.getDate()).padStart(2, '0');
            const mes = String(d.getMonth() + 1).padStart(2, '0');
            const hora = String(d.getHours()).padStart(2, '0');
            const min = String(d.getMinutes()).padStart(2, '0');
            return `${dia}/${mes} · ${hora}:${min}`;
        }
        return 'avui';
    }

    function pintarInfoRun(info) {
        const el = document.getElementById('info_run');
        if (!el || !info) return;
        el.innerHTML = `
            <span class="punt"></span>
            <span class="run">${info.run_z || '—'}</span>
            <span class="sep">·</span>
            <span class="fa">${formatDataRun(info)}</span>
        `;
        el.classList.add('visible');
    }

    async function inicialitzarInfoRun() {
        const info = await carregarInfoRun();
        if (info) pintarInfoRun(info);
        setInterval(async () => {
            const nou = await carregarInfoRun();
            if (nou) pintarInfoRun(nou);
        }, 15 * 60 * 1000);
    }

    async function inicialitzar() {
        if (window._firebaseUser) actualitzarUIUsuari(window._firebaseUser);
        inicialitzarInfoRun();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', inicialitzar);
    } else {
        inicialitzar();
    }
})();
</script>

</body>
</html>
