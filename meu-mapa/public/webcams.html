    { id: "queralbs", t: "Queralbs", u: "https://meteoguilleries.cat/ca/webcam/queralbs-ajuntament.jpg", s: "https://www.meteoguilleries.cat" },
    { id: "queralbs2", t: "Queralbs 2", u: "https://meteoguilleries.cat/ca/webcam/queralbs-mirador.jpg", s: "https://www.meteoguilleries.cat" },
    { id: "puigcerda", t: "Puigcerdà", u: "https://www.cerdanya.cat/webcams/puigcerda.jpg", s: "https://www.cerdanya.cat" },
    { id: "bellver", t: "Bellver de Cerdanya", u: "https://www.cerdanya.cat/webcams/bellver.jpg", s: "https://www.cerdanya.cat" },
    { id: "llivia", t: "Llívia", u: "https://www.cerdanya.cat/webcams/llivia.jpg", s: "https://www.cerdanya.cat" },
  ],
  "Lérida": [
    { id: "estany_gento", t: "Estany Gento (2141m)", u: "https://meteoguilleries.cat/ca/webcam/gento.jpg", s: "https://www.meteoguilleries.cat" },
    { id: "filia", t: "Cabana de Filià (1961m)", u: "https://meteoguilleries.cat/ca/webcam/filia.jpg", s: "https://www.meteoguilleries.cat" },
  ],

    { id: "bellvei", t: "Bellvei", u: "http://alatsaeroclub.ddns.net:85/mjpg/video.mjpg", s: "http://alatsaeroclub.ddns.net:85" },
    { id: "bellvei2", t: "Bellvei 2", u: "https://www.meteobellvei.cat/webcammeteobellvei.jpg", s: "https://www.meteobellvei.cat" },

// ── MAPA ──
var map = L.map('map', {
  zoomControl: false,
  attributionControl: false,
  minZoom: 7,
  maxZoom: 12,
  maxBounds: [[40.3, 0.0], [43.0, 3.8]]
}).setView([41.7, 1.8], 8);



fetch('dades/catalunya_comarques.geojson')
  .then(res => {
    if (!res.ok) throw new Error('GeoJSON no trobat: ' + res.status);
    return res.json();
  })
  .then(data => {
    L.geoJSON(data, {
      style: function(f) {
        var nom = f.properties.name || f.properties.nom_comar || f.properties.NOMCOMAR;
        var actiu = DATA_CAMS[nom] && DATA_CAMS[nom].some(c => c.u);
        return {
          fillColor: actiu ? '#2e7d4f' : 'rgba(180,160,120,0.1)',
          weight: 2,
          color: '#5a3e1b',
          fillOpacity: actiu ? 0.45 : 0.08
        };
      },
      onEachFeature: function(f, layer) {
        var nom = f.properties.name || f.properties.nom_comar || f.properties.NOMCOMAR;
        var actiu = DATA_CAMS[nom] && DATA_CAMS[nom].some(c => c.u);
        var numCams = actiu ? DATA_CAMS[nom].filter(c => c.u).length : 0;
        layer.bindTooltip(
          '<strong>' + nom + '</strong>' + (actiu
            ? ' &mdash; [ ' + numCams + ' ' + (numCams === 1 ? 'CAMERA' : 'CAMERAS') + ' ]'
            : ' &mdash; sense webcams'),
          { sticky: true, direction: 'top' }
        );
        layer.on('mouseover', () => layer.setStyle({
          fillOpacity: 0.7,
          fillColor: actiu ? '#1a5c36' : '#c4a84a'
        }));
        layer.on('mouseout', () => layer.setStyle({
          fillOpacity: actiu ? 0.45 : 0.08,
          fillColor: actiu ? '#2e7d4f' : 'rgba(180,160,120,0.1)'
        }));
        if (actiu) {
          layer.on('click', () => openCams(nom));
          layer.on('add', () => {
            var el = layer.getElement && layer.getElement();
            if (el) el.style.cursor = 'pointer';
          });
        }
      }
    }).addTo(map);
  })
  .catch(err => {
    console.error('Error GeoJSON:', err);
    document.getElementById('map').innerHTML =
      '<div style="padding:40px;text-align:center;font-family:monospace;color:#8b6914;background:#f5f0e8;">' +
      '[ ATENCIO ] No s\'ha trobat el fitxer GeoJSON de comarques.<br><br>' +
      '<em>Comprova que existeix: <strong>dades/catalunya_comarques.geojson</strong></em></div>';
  });

// ── VARS GLOBALS ──
let currentCams = [];
let currentFullIndex = 0;
let currentTs = 0;

// ── OBERTURA MODAL COMARQUES ──
function openCams(comarca) {
  const modal = document.getElementById('cam-modal');
  const body  = document.getElementById('modal-body');
  const title = document.getElementById('modal-title');
  currentTs   = Date.now();
  currentCams = DATA_CAMS[comarca].filter(c => c.u && c.t);

  title.textContent = 'WEBCAMS: ' + comarca.toUpperCase() + ' (' + currentCams.length + ' CAMERES)';
  body.innerHTML = '';

  currentCams.forEach((cam, idx) => {
    const box = document.createElement('div');
    box.className = 'cam-box';

    const titleRow = document.createElement('div');
    titleRow.className = 'cam-box-title';

    const labelEl = document.createElement('span');
    labelEl.className = 'cam-title-text';
    labelEl.textContent = cam.t;

    const sourceLink = document.createElement('a');
    sourceLink.className = 'cam-source-link';
    sourceLink.href = cam.s || '#';
    sourceLink.target = '_blank';
    sourceLink.rel = 'noopener noreferrer';
    sourceLink.textContent = 'FONT';
    sourceLink.onclick = e => e.stopPropagation();

    titleRow.appendChild(labelEl);
    titleRow.appendChild(sourceLink);

    const img = document.createElement('img');
    img.src = cam.u + '?t=' + currentTs;
    img.alt = cam.t;
    img.loading = 'lazy';

    const hint = document.createElement('div');
    hint.className = 'cam-hint';
    hint.textContent = '[ clic per obrir en pantalla gran ]';

    box.appendChild(titleRow);
    box.appendChild(img);
    box.appendChild(hint);

    box.onclick = () => openFullscreen(idx);
    body.appendChild(box);
  });

  modal.style.display = 'flex';
}

function closeCams() {
  document.getElementById('cam-modal').style.display = 'none';
}

function closeModalBg(e) {
  if (e.target.id === 'cam-modal') closeCams();
}

// ── PANTALLA GRAN ──
function openFullscreen(idx) {
  currentFullIndex = idx;
  updateFullscreen();
  document.getElementById('fullscreen-overlay').classList.add('active');
}

function updateFullscreen() {
  const cam = currentCams[currentFullIndex];
  if (!cam) return;
  document.getElementById('full-img').src = cam.u + '?t=' + currentTs;
  document.getElementById('full-title-text').textContent =
    (currentFullIndex + 1) + ' / ' + currentCams.length + ' — ' + cam.t.toUpperCase();
  document.getElementById('full-source-btn').href = cam.s || cam.u;
  document.getElementById('btn-prev').disabled = currentFullIndex === 0;
  document.getElementById('btn-next').disabled = currentFullIndex === currentCams.length - 1;
}

function navFull(dir) {
  const newIdx = currentFullIndex + dir;
  if (newIdx >= 0 && newIdx < currentCams.length) {
    currentFullIndex = newIdx;
    updateFullscreen();
  }
}

function closeFullscreen() {
  document.getElementById('fullscreen-overlay').classList.remove('active');
}

// ── TIMELAPSE ──
function openTlSelector() {
  document.getElementById('tl-selector-modal').style.display = 'flex';
}
function closeTlSelector() {
  document.getElementById('tl-selector-modal').style.display = 'none';
}

// ── TECLAT ──
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeFullscreen();
    closeCams();
    closeTlSelector();
  }
  if (document.getElementById('fullscreen-overlay').classList.contains('active')) {
    if (e.key === 'ArrowLeft') navFull(-1);
    if (e.key === 'ArrowRight') navFull(1);
  }
});

</script>
