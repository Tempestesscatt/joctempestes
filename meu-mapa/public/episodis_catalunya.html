<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galeria de Fotos - Tempestes.cat</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QDWCZ0Z9XF"></script>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-QDWCZ0Z9XF');
    </script>
    <style>
        :root {
            --bg: #0a0f18;
            --bg2: #111927;
            --bg3: #182233;
            --border: #1e2d42;
            --border2: #263548;
            --text: #dde4ee;
            --text2: #8899b4;
            --text3: #556680;
            --accent: #4a90d9;
            --accent2: #5da0e9;
            --danger: #e05555;
            --success: #45b070;
            --warning: #d9a040;
            --purple: #8e6fc4;
            --radius: 10px;
            --radius-sm: 6px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(180deg, #0a0f18 0%, #0d1520 50%, #111927 100%);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding: 12px;
            font-size: 15px;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        .container { max-width: 900px; margin: 0 auto; overflow-x: hidden; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 12px;
            flex-wrap: wrap;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg2);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 30px;
        }
        .logo svg { flex-shrink: 0; }
        .title { font-size: 18px; font-weight: 700; }
        .title span { color: var(--accent2); }
        .btn {
            padding: 8px 16px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-accent { background: var(--accent); color: #fff; }
        .btn-accent:hover { background: var(--accent2); transform: translateY(-1px); }
        .btn-accent:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-home { background: var(--bg3); border: 1px solid var(--border); color: var(--text2); }
        .btn-home:hover { border-color: var(--accent); color: var(--text); }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text2);
            font-size: 10px;
            padding: 5px 12px;
            border-radius: 25px;
        }
        .btn-outline:hover { border-color: var(--accent); color: var(--text); }

        .user-pill {
            display: none;
            align-items: center;
            gap: 8px;
            background: var(--bg2);
            border: 1px solid var(--border);
            padding: 5px 14px;
            border-radius: 25px;
            font-size: 12px;
        }
        .avatar {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            font-size: 12px;
        }

        /* CALENDARI */
        .cal-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            background: var(--bg2);
            border: 1px solid var(--border);
            padding: 14px 16px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            user-select: none;
            transition: all 0.2s;
            touch-action: manipulation;
        }
        .cal-toggle:active { border-color: var(--accent); }
        .cal-toggle.open { border-color: var(--accent); background: rgba(74,144,217,0.05); }
        .cal-toggle svg { flex-shrink: 0; transition: transform 0.3s; }
        .cal-toggle.open svg.arrow { transform: rotate(180deg); }
        .cal-toggle span { flex: 1; }
        .cal-toggle .badge-count {
            font-size: 10px;
            color: var(--success);
            font-weight: 700;
            background: rgba(69,176,112,0.12);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .calendar-wrap {
            display: none;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 8px;
            margin-bottom: 12px;
            animation: slideDown 0.3s ease;
            width: 100%;
            overflow: hidden;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .calendar-wrap.open { display: block; }

        .cal-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        .cal-nav button {
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--text);
            width: 36px; height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            touch-action: manipulation;
            flex-shrink: 0;
        }
        .cal-nav button:active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            transform: scale(0.95);
        }
        .cal-nav button:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }
        .cal-nav button:disabled:active { background: var(--bg3); border-color: var(--border); color: var(--text); transform: none; }
        .cal-nav .month-label {
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            color: var(--accent2);
            flex: 1;
            padding: 0 8px;
        }
        .cal-hint {
            text-align: center;
            font-size: 10px;
            color: var(--text3);
            margin-top: 8px;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            width: 100%;
        }
        .cal-grid .day-hdr {
            text-align: center;
            font-size: 10px;
            color: var(--text3);
            padding: 6px 0;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .cal-grid .day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: default;
            font-size: 14px;
            font-weight: 600;
            border: 2px solid transparent;
            transition: all 0.15s ease;
            position: relative;
            touch-action: manipulation;
            min-width: 0;
            width: 100%;
            color: var(--text3);
            opacity: 0.25;
        }
        /* Nomes els dies amb fotos son interactius i visibles */
        .cal-grid .day.has-obs {
            cursor: pointer;
            color: #fff;
            font-weight: 700;
            opacity: 1;
        }
        .cal-grid .day.has-obs:active {
            background: var(--bg3);
            border-color: var(--accent);
            transform: scale(0.93);
        }
        .cal-grid .day.today.has-obs {
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(74, 144, 217, 0.2);
        }
        .cal-grid .day.today:not(.has-obs) {
            opacity: 0.4;
            border-color: var(--border2);
        }
        .cal-grid .day.selected {
            background: linear-gradient(135deg, var(--accent), #3a7bc8);
            color: #fff;
            border-color: var(--accent2);
            box-shadow: 0 3px 15px rgba(74, 144, 217, 0.3);
            font-weight: 800;
            transform: scale(1.05);
            opacity: 1;
        }
        .cal-grid .day.other { opacity: 0; pointer-events: none; }
        .cal-grid .day .day-count {
            font-size: 9px;
            color: rgba(255,255,255,0.85);
            margin-top: 1px;
            font-weight: 700;
        }
        .cal-grid .day.has-obs:not(.selected) {
            background: rgba(69, 176, 112, 0.14);
        }
        .cal-grid .day.has-obs:not(.selected) .day-count { color: var(--success); }

        @media (max-width: 400px) {
            .calendar-wrap { padding: 8px 6px; }
            .cal-grid { gap: 2px; }
            .cal-grid .day { font-size: 13px; border-radius: 7px; }
            .cal-grid .day-hdr { font-size: 9px; padding: 5px 0; }
            .cal-nav button { width: 34px; height: 34px; }
            .cal-nav .month-label { font-size: 14px; }
        }

        /* FORMULARI PUJADA (nomes visible per l'ID autoritzada) */
        .form {
            display: none;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
        }
        .form.open { display: block; }
        .form textarea {
            width: 100%;
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 13px;
            resize: vertical;
            min-height: 60px;
            max-height: 130px;
        }
        .form textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px rgba(74,144,217,0.1); }
        .form-row { display: flex; gap: 10px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
        .img-upload {
            width: 70px; height: 70px;
            border-radius: var(--radius-sm);
            border: 2px dashed var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            overflow: hidden;
            transition: all 0.2s;
        }
        .img-upload:hover { border-color: var(--accent); background: rgba(74,144,217,0.05); }
        .img-upload svg { opacity: 0.4; transition: opacity 0.2s; }
        .img-upload:hover svg { opacity: 0.7; }
        .img-upload img { width: 100%; height: 100%; object-fit: cover; }
        .img-upload.has-img { border-style: solid; border-color: var(--border2); }
        .form-label { font-size: 10px; color: var(--text3); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }

        .not-authorized {
            background: var(--bg2);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 12px;
            font-size: 12px;
            color: var(--text3);
            text-align: center;
        }

        /* GALERIA GRID */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }
        .photo-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
        }
        .photo-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .photo-card .ph-img-wrap {
            width: 100%;
            aspect-ratio: 4/3;
            overflow: hidden;
            background: var(--bg3);
        }
        .photo-card img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }
        .photo-card .ph-img-wrap.ph-multi {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2px;
        }
        .photo-card .ph-img-wrap.ph-multi img { aspect-ratio: 1/1; }
        .photo-card .ph-caption {
            padding: 8px 10px;
            font-size: 11px;
            color: var(--text2);
            line-height: 1.4;
            max-height: 3em;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .photo-card .ph-meta {
            padding: 0 10px 8px;
            font-size: 9px;
            color: var(--text3);
        }
        .photo-card .ph-del {
            position: absolute;
            top: 6px; right: 6px;
            background: rgba(10,15,24,0.75);
            border: none;
            color: #fff;
            width: 26px; height: 26px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .photo-card .ph-del:hover { background: var(--danger); }

        .empty { text-align: center; padding: 50px 20px; color: var(--text3); font-size: 13px; }
        .empty svg { margin-bottom: 12px; opacity: 0.4; }

        .img-modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.93);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-direction: column;
            padding: 20px;
        }
        .img-modal.open { display: flex; }
        .img-modal img { max-width: 92vw; max-height: 80vh; border-radius: 10px; }
        .img-modal .modal-caption {
            color: var(--text2);
            font-size: 13px;
            margin-top: 14px;
            max-width: 600px;
            text-align: center;
        }

        .auth-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .auth-overlay.open { display: flex; }
        .auth-box {
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: var(--radius);
            padding: 24px;
            text-align: center;
            width: 310px;
            max-width: 92vw;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
        }
        .auth-box h3 { margin-bottom: 16px; font-size: 15px; }

        .footer { text-align: center; padding: 20px; color: var(--text3); font-size: 10px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent2)" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="3"/>
                <circle cx="8.5" cy="8.5" r="1.5" fill="var(--accent2)" stroke="none"/>
                <circle cx="15.5" cy="8.5" r="1.5" fill="var(--accent2)" stroke="none"/>
                <path d="M8 14c1.5 2 4 3 6 3s4.5-1 6-3"/>
            </svg>
            <div class="title">Galeria <span>de fotos</span></div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
            <a href="index.html" class="btn btn-home">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Inici
            </a>
            <button class="btn btn-accent" id="btn-login" onclick="openAuth()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                Entrar
            </button>
            <div class="user-pill" id="user-pill">
                <div class="avatar" id="user-avatar">?</div>
                <span id="user-name">Usuari</span>
                <button class="btn-outline" onclick="logoutUser()">Sortir</button>
            </div>
        </div>
    </div>

    <div class="cal-toggle" id="cal-toggle" onclick="toggleCalendar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent2)" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span id="cal-label">Totes les fotos</span>
        <span class="badge-count" id="cal-badge" style="display:none;"></span>
        <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>

    <div class="calendar-wrap" id="calendar-wrap">
        <div class="cal-nav">
            <button id="cal-prev" onclick="changeMonth(-1)" aria-label="Mes anterior">&#9664;</button>
            <span class="month-label" id="cal-title"></span>
            <button id="cal-next" onclick="changeMonth(1)" aria-label="Mes següent">&#9654;</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-hint">Només es mostren els dies amb fotos publicades</div>
    </div>

    <!-- Formulari de pujada: nomes visible si l'usuari te la UID autoritzada -->
    <div class="form" id="form">
        <div class="form-label">Nova foto</div>
        <textarea id="obs-text" placeholder="Descripció de la foto (opcional)" maxlength="300"></textarea>
        <div class="form-row">
            <div class="img-upload" id="img-up-1" onclick="document.getElementById('img-in-1').click()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </div>
            <div class="img-upload" id="img-up-2" onclick="document.getElementById('img-in-2').click()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </div>
            <div class="img-upload" id="img-up-3" onclick="document.getElementById('img-in-3').click()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </div>
            <input type="file" id="img-in-1" accept="image/*" style="display:none" onchange="handleImg(1)">
            <input type="file" id="img-in-2" accept="image/*" style="display:none" onchange="handleImg(2)">
            <input type="file" id="img-in-3" accept="image/*" style="display:none" onchange="handleImg(3)">
            <button class="btn btn-accent" id="btn-publish" onclick="publishPhoto()" style="margin-left:auto;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                Publicar
            </button>
        </div>
        <div class="form-hint" style="font-size:10px;color:var(--text3);margin-top:8px;">Màxim 3 fotos per publicació</div>
    </div>

    <div class="not-authorized" id="not-authorized" style="display:none;">
        Només l'administrador pot publicar noves fotos a la galeria.
    </div>

    <div class="gallery-grid" id="gallery-grid">
        <div class="empty">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
            <p>Carregant galeria...</p>
        </div>
    </div>

    <div class="footer">Tempestes.cat · Galeria de Fotos</div>
</div>

<div class="img-modal" id="img-modal" onclick="closeImgModal()">
    <img id="img-modal-img" src="" alt="">
    <div class="modal-caption" id="img-modal-caption"></div>
</div>

<div class="auth-overlay" id="auth-overlay" onclick="closeAuth(event)">
    <div class="auth-box" onclick="event.stopPropagation()">
        <h3>Inicia sessió</h3>
        <button class="btn btn-accent" onclick="loginGoogle()" style="width:100%;justify-content:center;padding:10px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Continuar amb Google
        </button>
    </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getDatabase, ref, push, get, remove } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

const fc = {
    apiKey: "AIzaSyBGcGUk2gsoDaHkg9Yv-nqMJ5_x-QPTMS8",
    authDomain: "tempestescat.firebaseapp.com",
    databaseURL: "https://tempestescat-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "tempestescat",
    storageBucket: "tempestescat.firebasestorage.app",
    messagingSenderId: "683240351775",
    appId: "1:683240351775:web:bc65d73249537b9cc28d2a"
};

// Unica UID autoritzada a publicar fotos
const ADMIN_UID = "86Ljz4YlGag8w6BxJpziaxD3cX92";

const app = initializeApp(fc);
const db = getDatabase(app);
const auth = getAuth(app);

let user = null;
let imgs = { 1: null, 2: null, 3: null };

// dataKeys: totes les dates (YYYY-MM-DD) que tenen fotos, amb comptador
let dayCounts = {};
// monthsWithData: set de "YYYY-M" que tenen almenys una foto
let monthsWithData = new Set();
// llista ordenada de mesos amb dades (per navegar nomes entre ells)
let sortedMonths = [];
let curMonthIdx = -1; // index dins sortedMonths
let selDateKey = null; // null = totes les fotos
let calOpen = false;
let allPhotos = [];

function dk(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function mk(y,m) { return y+'-'+m; }
function fd(d) { const mm=['Gener','Febrer','Març','Abril','Maig','Juny','Juliol','Agost','Setembre','Octubre','Novembre','Desembre']; return d.getDate()+' de '+mm[d.getMonth()]+' '+d.getFullYear(); }
function esc(t) { return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ago(ts) { if(!ts)return''; const m=Math.floor((Date.now()-ts)/60000); if(m<1)return'Ara'; if(m<60)return'Fa '+m+' min'; const h=Math.floor(m/60); if(h<24)return'Fa '+h+' h'; return'Fa '+Math.floor(h/24)+' d'; }

// Auth
window.openAuth = function() { document.getElementById('auth-overlay')?.classList.add('open'); };
window.closeAuth = function(e) {
    if(e && e.target !== e.currentTarget) return;
    document.getElementById('auth-overlay')?.classList.remove('open');
};
window.loginGoogle = async function() {
    try {
        await signInWithPopup(auth, new GoogleAuthProvider());
        document.getElementById('auth-overlay')?.classList.remove('open');
    } catch(e) { alert(e.message); }
};
window.logoutUser = async function() {
    if(confirm('Tancar sessió?')) {
        await signOut(auth);
        imgs = {1:null,2:null,3:null}; updateImgPreview();
    }
};

// Imatges (fins a 3)
window.handleImg = function(n) {
    const input = document.getElementById('img-in-'+n);
    const f = input.files[0];
    if(!f) return;
    if(f.size > 5*1024*1024) { alert('Màxim 5MB'); return; }
    const r = new FileReader();
    r.onload = e => { imgs[n] = e.target.result; updateImgPreview(); };
    r.readAsDataURL(f);
};
function updateImgPreview() {
    const svg = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
    [1,2,3].forEach(n => {
        const up = document.getElementById('img-up-'+n);
        if(!up) return;
        if(imgs[n]) { up.innerHTML = '<img src="'+imgs[n]+'">'; up.classList.add('has-img'); }
        else { up.innerHTML = svg; up.classList.remove('has-img'); }
    });
}

window.publishPhoto = async function() {
    if(!user || user.uid !== ADMIN_UID) { alert('No autoritzat'); return; }
    const images = [imgs[1], imgs[2], imgs[3]].filter(Boolean);
    if(images.length === 0) { alert('Selecciona almenys una imatge'); return; }
    if(images.length > 3) { alert('Màxim 3 fotos per publicació'); return; }
    const caption = document.getElementById('obs-text')?.value?.trim() || '';
    const now = new Date();
    const photo = {
        uid: user.uid,
        nick: user.displayName || 'Admin',
        caption: caption,
        images: images,
        dateKey: dk(now),
        timestamp: Date.now()
    };
    try {
        await push(ref(db, 'gallery'), photo);
        document.getElementById('obs-text').value = '';
        imgs = {1:null,2:null,3:null}; updateImgPreview();
        await loadAll();
        selDateKey = null;
        renderCalToggleLabel();
        renderGallery();
    } catch(e) { alert('Error: '+e.message); }
};

window.delPhoto = async function(key, uidOwner) {
    if(!user || user.uid !== uidOwner) { alert('No pots eliminar això'); return; }
    if(!confirm('Eliminar aquesta foto?')) return;
    try {
        await remove(ref(db, 'gallery/'+key));
        await loadAll();
        renderGallery();
        if(calOpen) renderCal();
    } catch(e) { alert('Error: '+e.message); }
};

// Calendari — nomes navega entre mesos amb dades
window.toggleCalendar = function() {
    if(sortedMonths.length === 0) return; // sense dades, no obrim
    calOpen = !calOpen;
    document.getElementById('calendar-wrap')?.classList.toggle('open', calOpen);
    document.getElementById('cal-toggle')?.classList.toggle('open', calOpen);
    if(calOpen) {
        if(curMonthIdx === -1) curMonthIdx = sortedMonths.length - 1; // mes mes recent amb dades
        renderCal();
    }
};

window.changeMonth = function(d) {
    const next = curMonthIdx + d;
    if(next < 0 || next >= sortedMonths.length) return; // no hi ha dades, no es mou
    curMonthIdx = next;
    renderCal();
};

window.selectDay = function(dateKey) {
    selDateKey = dateKey;
    const [y,m,day] = dateKey.split('-').map(Number);
    document.getElementById('cal-label').textContent = fd(new Date(y, m-1, day));
    document.getElementById('cal-badge').style.display = 'none';
    document.getElementById('calendar-wrap')?.classList.remove('open');
    document.getElementById('cal-toggle')?.classList.remove('open');
    calOpen = false;
    renderGallery();
};

window.selectAll = function() {
    selDateKey = null;
    renderCalToggleLabel();
    document.getElementById('calendar-wrap')?.classList.remove('open');
    document.getElementById('cal-toggle')?.classList.remove('open');
    calOpen = false;
    renderGallery();
};

function renderCalToggleLabel() {
    const label = document.getElementById('cal-label');
    const badge = document.getElementById('cal-badge');
    if(!label) return;
    if(selDateKey) {
        const [y,m,day] = selDateKey.split('-').map(Number);
        label.textContent = fd(new Date(y, m-1, day));
    } else {
        label.textContent = 'Totes les fotos';
    }
    if(badge) {
        if(allPhotos.length) { badge.style.display='inline-block'; badge.textContent = allPhotos.length + ' fotos'; }
        else badge.style.display = 'none';
    }
}

function renderCal() {
    const grid = document.getElementById('cal-grid');
    const title = document.getElementById('cal-title');
    const prevBtn = document.getElementById('cal-prev');
    const nextBtn = document.getElementById('cal-next');
    if(!grid || !title) return;

    if(sortedMonths.length === 0) { grid.innerHTML = ''; title.textContent = ''; return; }

    const [year, month] = sortedMonths[curMonthIdx].split('-').map(Number);
    const mNames = ['Gener','Febrer','Març','Abril','Maig','Juny','Juliol','Agost','Setembre','Octubre','Novembre','Desembre'];
    title.textContent = mNames[month] + ' ' + year;

    prevBtn.disabled = curMonthIdx <= 0;
    nextBtn.disabled = curMonthIdx >= sortedMonths.length - 1;

    const ds = ['Dg','Dl','Dt','Dc','Dj','Dv','Ds'];
    let h = '';
    ds.forEach(d => h += '<div class="day-hdr">'+d+'</div>');

    const firstDow = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const today = dk(new Date());

    for(let i=0;i<firstDow;i++) h += '<div class="day other"></div>';

    for(let d=1; d<=daysInMonth; d++) {
        const key = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
        const count = dayCounts[key] || 0;
        let cls = 'day';
        if(key === today) cls += ' today';
        if(count > 0) cls += ' has-obs';
        if(key === selDateKey) cls += ' selected';
        const onclick = count > 0 ? ' onclick="selectDay(\''+key+'\')"' : '';
        h += '<div class="'+cls+'"'+onclick+'>'+d+(count?'<span class="day-count">'+count+'</span>':'')+'</div>';
    }
    grid.innerHTML = h;
}

// Renderitzat de la galeria (grid de fotos)
function renderGallery() {
    const grid = document.getElementById('gallery-grid');
    if(!grid) return;
    let photos = selDateKey ? allPhotos.filter(p => p.dateKey === selDateKey) : allPhotos;
    photos = photos.slice().sort((a,b) => (b.timestamp||0)-(a.timestamp||0));

    if(photos.length === 0) {
        grid.innerHTML = '<div class="empty" style="grid-column:1/-1;">'+
            '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>'+
            '<p>Encara no hi ha fotos publicades'+(selDateKey?' aquest dia':'')+'</p></div>';
        return;
    }

    grid.innerHTML = '';
    photos.forEach(p => {
        const isOwn = user && user.uid === p.uid;
        const imgList = p.images && p.images.length ? p.images : (p.image ? [p.image] : []);
        const card = document.createElement('div');
        card.className = 'photo-card';
        let imgsHtml = '';
        if(imgList.length === 1) {
            imgsHtml = '<div class="ph-img-wrap"><img src="'+esc(imgList[0])+'" loading="lazy" onclick="openImg(\''+p.key+'\',0)"></div>';
        } else {
            imgsHtml = '<div class="ph-img-wrap ph-multi">';
            imgList.forEach((im,i) => imgsHtml += '<img src="'+esc(im)+'" loading="lazy" onclick="event.stopPropagation();openImg(\''+p.key+'\','+i+')">');
            imgsHtml += '</div>';
        }
        card.innerHTML =
            imgsHtml +
            (p.caption ? '<div class="ph-caption">'+esc(p.caption)+'</div>' : '')+
            '<div class="ph-meta">'+ago(p.timestamp)+(imgList.length>1?' · '+imgList.length+' fotos':'')+'</div>'+
            (isOwn ? '<button class="ph-del" title="Eliminar" onclick="event.stopPropagation();delPhoto(\''+p.key+'\',\''+p.uid+'\')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>' : '');
        grid.appendChild(card);
    });
}

window.openImg = function(key, idx) {
    const p = allPhotos.find(x => x.key === key);
    if(!p) return;
    const imgList = p.images && p.images.length ? p.images : (p.image ? [p.image] : []);
    const src = imgList[idx || 0] || imgList[0];
    document.getElementById('img-modal-img').src = src;
    document.getElementById('img-modal-caption').textContent = p.caption || '';
    document.getElementById('img-modal').classList.add('open');
};
window.closeImgModal = function() { document.getElementById('img-modal')?.classList.remove('open'); };

async function loadAll() {
    try {
        const snap = await get(ref(db, 'gallery'));
        allPhotos = [];
        dayCounts = {};
        monthsWithData = new Set();
        if(snap.exists()) {
            Object.entries(snap.val()).forEach(([key, v]) => {
                allPhotos.push({ key, ...v });
                if(v.dateKey) {
                    dayCounts[v.dateKey] = (dayCounts[v.dateKey]||0) + 1;
                    const [y,m] = v.dateKey.split('-');
                    monthsWithData.add(y+'-'+(parseInt(m,10)-1));
                }
            });
        }
        sortedMonths = Array.from(monthsWithData).sort((a,b) => {
            const [ya,ma] = a.split('-').map(Number);
            const [yb,mb] = b.split('-').map(Number);
            return (ya*12+ma) - (yb*12+mb);
        });
        curMonthIdx = sortedMonths.length ? sortedMonths.length - 1 : -1;
        renderCalToggleLabel();
    } catch(e) { console.error(e); }
}

function updateUploadUI() {
    const form = document.getElementById('form');
    const notAuth = document.getElementById('not-authorized');
    if(!form || !notAuth) return;
    if(user && user.uid === ADMIN_UID) {
        form.classList.add('open');
        notAuth.style.display = 'none';
    } else {
        form.classList.remove('open');
        notAuth.style.display = user ? 'block' : 'none';
    }
}

onAuthStateChanged(auth, async (u) => {
    user = u;
    const lb = document.getElementById('btn-login');
    const up = document.getElementById('user-pill');
    const av = document.getElementById('user-avatar');
    const nm = document.getElementById('user-name');
    if(u) {
        if(lb) lb.style.display = 'none';
        if(up) up.style.display = 'flex';
        if(nm) nm.textContent = u.displayName || u.email?.split('@')[0] || 'Usuari';
        if(av) av.textContent = (u.displayName||'U')[0].toUpperCase();
    } else {
        if(lb) lb.style.display = 'inline-flex';
        if(up) up.style.display = 'none';
        img1 = null; updateImgPreview();
    }
    updateUploadUI();
    renderGallery();
});

document.addEventListener('keydown', e => {
    if(e.key === 'Escape') {
        closeImgModal();
        document.getElementById('auth-overlay')?.classList.remove('open');
    }
});

(async () => {
    await loadAll();
    updateUploadUI();
    renderGallery();
})();
</script>
