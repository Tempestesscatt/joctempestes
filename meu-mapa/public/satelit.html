<html lang="ca">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; font-family: 'Segoe UI', 'Trebuchet MS', Arial, sans-serif; font-size: 13px; color: #bbb; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; height: 100vh; touch-action: none; }
        .barra-top { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 14px; background: rgba(10,10,10,0.95); border-bottom: 1px solid #222; flex-wrap: wrap; }
        .barra-top select, .btn { background: #1a1a1a; color: #ccc; border: 1px solid #444; padding: 5px 10px; border-radius: 4px; font-family: inherit; font-size: 13px; cursor: pointer; outline: none; }
        .btn { padding: 5px 12px; font-size: 12px; white-space: nowrap; }
        .btn:hover { background: #2a2a2a; border-color: #666; }
        .btn.actiu { background: #3a3a3a; color: #fff; border-color: #777; }
        .btn-fletxa { padding: 5px 8px; font-size: 13px; }
        .slider-grup { display: flex; align-items: center; gap: 8px; flex: 1; max-width: 400px; min-width: 160px; }
        .slider-grup input[type="range"] { -webkit-appearance: none; appearance: none; flex: 1; height: 4px; border-radius: 2px; background: #333; cursor: pointer; outline: none; border: none; }
        .slider-grup input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #ccc; cursor: pointer; border: none; }
        .slider-grup .hora-label { font-size: 11px; font-weight: bold; min-width: 32px; text-align: center; color: #999; }
        .contenidor-principal { position: fixed; top: 46px; left: 0; right: 0; bottom: 28px; overflow: hidden; background: #000; cursor: grab; }
        .contenidor-principal:active { cursor: grabbing; }
        .contenidor-principal.panning { cursor: grabbing; }
        .visor-inner { position: absolute; transform-origin: 0 0; will-change: transform; }
        .visor-inner canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .overlay-carga { position: fixed; inset: 0; background: rgba(5,5,5,0.95); display: flex; align-items: center; justify-content: center; z-index: 200; }
        .overlay-carga.fi { display: none; }
        .caixa-carga { text-align: center; padding: 40px 50px; background: #141414; border: 1px solid #333; border-radius: 8px; }
        .caixa-carga .pct-gran { font-size: 72px; font-weight: bold; color: #ddd; line-height: 1; }
        .caixa-carga .barra-progres { width: 200px; height: 4px; background: #222; border-radius: 2px; overflow: hidden; margin: 16px auto 0; }
        .caixa-carga .barra-progres .ple { height: 100%; background: #666; width: 0%; transition: width 0.08s linear; }
        .info-peu { position: fixed; bottom: 0; left: 0; right: 0; padding: 5px 12px; background: rgba(10,10,10,0.9); border-top: 1px solid #222; font-size: 10px; color: #666; z-index: 30; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .info-peu span { white-space: nowrap; }
        .indicador-zoom { position: fixed; bottom: 35px; right: 12px; background: rgba(20,20,20,0.85); color: #aaa; padding: 4px 10px; border-radius: 4px; font-size: 11px; z-index: 40; border: 1px solid #333; pointer-events: none; }
        .boto-reset-zoom { position: fixed; bottom: 35px; right: 80px; background: rgba(20,20,20,0.85); color: #ccc; padding: 4px 10px; border-radius: 4px; font-size: 11px; z-index: 40; cursor: pointer; border: 1px solid #444; pointer-events: auto; display: none; }
        .boto-reset-zoom:hover { background: #2a2a2a; }
        @media (max-width: 600px) { .barra-top { gap: 6px; padding: 6px 8px; } .btn { padding: 4px 8px; font-size: 11px; } .slider-grup { max-width: 100%; } .contenidor-principal { top: 42px; bottom: 24px; } .info-peu { font-size: 9px; padding: 4px 8px; } .indicador-zoom { bottom: 30px; right: 8px; font-size: 10px; } .boto-reset-zoom { bottom: 30px; right: 70px; font-size: 10px; } .caixa-carga .pct-gran { font-size: 52px; } }
    </style>
</head>
<body>

<div class="barra-top" id="barraTop">
    <select id="selectCanal"><option value="bt108" selected>BT 10.8 µm</option><option value="bt62">BT 6.2 µm</option></select>
    <button class="btn btn-fletxa" id="btnRetrocedir" title="Enrere">&laquo;</button>
    <button class="btn" id="btnPlay">Play</button>
    <button class="btn btn-fletxa" id="btnAvancar" title="Endavant">&raquo;</button>
    <div class="slider-grup"><span class="hora-label" id="lblHoraInici">+00h</span><input type="range" id="sliderHores" min="0" max="51" value="0" step="1"><span class="hora-label" id="lblHoraFi">+51h</span></div>
</div>
<div class="contenidor-principal" id="contenidorPrincipal"><div class="visor-inner" id="visorInner"></div></div>
<div class="info-peu" id="infoPeu"><span>tempestes.cat</span><span id="infoHoraUtc"></span><span id="infoHoraLocal"></span></div>
<div class="indicador-zoom" id="indicadorZoom">285%</div>
<div class="boto-reset-zoom" id="botoResetZoom" title="Restaurar zoom per defecte">Reset</div>
<div class="overlay-carga" id="overlayCarga"><div class="caixa-carga"><div class="pct-gran" id="pctGran">0%</div><div class="barra-progres"><div class="ple" id="pleProgres"></div></div></div></div>

<script>
(function() {
    // ═══════════════════ CONFIG ═══════════════════
    var BASE_PATH = './web_data_arome/';
    var MAX_HORES = 52;
    var canalActual = 'bt108', horaActual = 0;
    var reproduint = false, timerPlay = null;
    var cacheDades = {};  // { '03': { bt108: {nombre, unidades, datos}, coordenadas: {...} } }
    var horesDisponibles = { bt108: [], bt62: [] };
    var ampleOriginal = 0, altOriginal = 0;

    // ═══════════════════ ZOOM / PAN ═══════════════════
    var ZOOM_BT108 = 2.85, ZOOM_BT62 = 2.20;
    var ZOOM_PER_DEFECTE = ZOOM_BT108, zoomNivell = ZOOM_PER_DEFECTE, zoomMin = ZOOM_PER_DEFECTE, zoomMax = 6;
    var panX = 0, panY = 0, zoomInicialitzat = false, arrossegant = false;
    var iniciPanX = 0, iniciPanY = 0, panInicialX = 0, panInicialY = 0, distTocInicial = 0, zoomInicialToc = ZOOM_PER_DEFECTE;

    var canvasBaseEl = null;
    var selectCanal = document.getElementById('selectCanal'), sliderHores = document.getElementById('sliderHores');
    var btnRetrocedir = document.getElementById('btnRetrocedir'), btnPlay = document.getElementById('btnPlay'), btnAvancar = document.getElementById('btnAvancar');
    var visorInner = document.getElementById('visorInner'), contenidorPrincipal = document.getElementById('contenidorPrincipal');
    var overlayCarga = document.getElementById('overlayCarga'), pleProgres = document.getElementById('pleProgres'), pctGran = document.getElementById('pctGran');
    var infoHoraUtc = document.getElementById('infoHoraUtc'), infoHoraLocal = document.getElementById('infoHoraLocal');
    var lblHoraInici = document.getElementById('lblHoraInici'), lblHoraFi = document.getElementById('lblHoraFi');
    var indicadorZoom = document.getElementById('indicadorZoom'), botoResetZoom = document.getElementById('botoResetZoom');

    // ═══════════════════ CÀRREGA DE DADES ═══════════════════
    async function carregarStatusGeneral() {
        try {
            var r = await fetch(BASE_PATH + 'status.json');
            if (!r.ok) return;
            var status = await r.json();
            if (status.total_hores) {
                MAX_HORES = Math.min(52, status.total_hores);
                sliderHores.max = MAX_HORES - 1;
                lblHoraFi.textContent = '+' + String(MAX_HORES - 1).padStart(2,'0') + 'h';
            }
            // Si el status general ja diu quines hores hi ha
            if (status.hores && status.hores.length > 0) {
                status.hores.forEach(function(h) {
                    horesDisponibles.bt108.push(h);
                    horesDisponibles.bt62.push(h);
                });
            }
        } catch(e) {
            console.warn('status.json general no disponible');
        }
    }

    async function escanejarHoresDisponibles() {
        // Si ja tenim hores del status general, no cal escanejar
        if (horesDisponibles.bt108.length > 0) return;
        
        var total = MAX_HORES;
        var fetes = 0;
        
        for (var i = 0; i < total; i++) {
            var horaStr = String(i).padStart(2, '0');
            try {
                var r = await fetch(BASE_PATH + horaStr + '/status.json');
                if (r.ok) {
                    var status = await r.json();
                    if (status.variables_disponibles) {
                        if (status.variables_disponibles.includes('bt108')) horesDisponibles.bt108.push(i);
                        if (status.variables_disponibles.includes('bt62')) horesDisponibles.bt62.push(i);
                    }
                }
            } catch(e) {
                // 404 = carpeta no existeix, normal
            }
            fetes++;
            var pct = Math.round((fetes / total) * 50);
            pleProgres.style.width = pct + '%';
            pctGran.textContent = pct + '%';
        }
    }

    async function carregarDadesHora(hora) {
        var horaStr = String(hora).padStart(2, '0');
        if (!cacheDades[horaStr]) cacheDades[horaStr] = {};
        
        var promeses = [];
        
        // Carregar BT108
        if (horesDisponibles.bt108.includes(hora) && !cacheDades[horaStr].bt108) {
            promeses.push(
                fetch(BASE_PATH + horaStr + '/bt108.js')
                    .then(function(r) { return r.ok ? r.json() : null; })
                    .then(function(d) {
                        if (d && d.variables && d.variables.bt108) {
                            cacheDades[horaStr].bt108 = d.variables.bt108;
                            cacheDades[horaStr].coordenadas = d.coordenadas;
                        }
                    })
                    .catch(function() {})
            );
        }
        
        // Carregar BT62
        if (horesDisponibles.bt62.includes(hora) && !cacheDades[horaStr].bt62) {
            promeses.push(
                fetch(BASE_PATH + horaStr + '/bt62.js')
                    .then(function(r) { return r.ok ? r.json() : null; })
                    .then(function(d) {
                        if (d && d.variables && d.variables.bt62) {
                            cacheDades[horaStr].bt62 = d.variables.bt62;
                            cacheDades[horaStr].coordenadas = d.coordenadas;
                        }
                    })
                    .catch(function() {})
            );
        }
        
        await Promise.all(promeses);
    }

    async function carregarTot() {
        overlayCarga.classList.remove('fi');
        pleProgres.style.width = '0%';
        pctGran.textContent = '0%';

        await carregarStatusGeneral();
        await escanejarHoresDisponibles();

        // Carregar totes les dades disponibles
        var totesHores = new Set();
        horesDisponibles.bt108.forEach(function(h) { totesHores.add(h); });
        horesDisponibles.bt62.forEach(function(h) { totesHores.add(h); });
        var llistaHores = Array.from(totesHores).sort(function(a,b) { return a - b; });
        
        if (llistaHores.length === 0) {
            overlayCarga.classList.add('fi');
            visorInner.innerHTML = '<div style="color:#666;text-align:center;padding-top:100px;">No s\'han trobat dades de satèl·lit.<br>Executa python arome.py primer.</div>';
            return;
        }
        
        var total = llistaHores.length;
        var carregades = 0;
        
        // Carregar en lots de 4 per no saturar
        for (var i = 0; i < llistaHores.length; i += 4) {
            var lot = llistaHores.slice(i, i + 4);
            await Promise.all(lot.map(function(h) { return carregarDadesHora(h); }));
            carregades += lot.length;
            var pct = 50 + Math.round((carregades / total) * 50);
            pleProgres.style.width = pct + '%';
            pctGran.textContent = pct + '%';
        }

        // Establir hora inicial
        if (horesDisponibles[canalActual].length > 0) {
            horaActual = horesDisponibles[canalActual][0];
            sliderHores.value = horaActual;
        }

        setTimeout(function() {
            overlayCarga.classList.add('fi');
            mostrar();
        }, 300);
    }

    // ═══════════════════ DIBUIXAR ═══════════════════
    function assegurarCanvas(w, h) {
        if (!canvasBaseEl) {
            canvasBaseEl = document.createElement('canvas');
            visorInner.innerHTML = '';
            visorInner.appendChild(canvasBaseEl);
        }
        if (canvasBaseEl.width !== w || canvasBaseEl.height !== h) {
            canvasBaseEl.width = w;
            canvasBaseEl.height = h;
            visorInner.style.width = w + 'px';
            visorInner.style.height = h + 'px';
        }
    }

    function dibuixarBTCanvas(canvas, dadesVar, lats, lons) {
        if (!dadesVar || !dadesVar.datos) return;
        
        var bt = dadesVar.datos;
        var w = lons.length;
        var h = lats.length;
        
        if (bt.length !== w * h) {
            console.warn('Mida incorrecta: esperat ' + (w*h) + ', rebut ' + bt.length);
            return;
        }
        
        var ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        var imgData = ctx.createImageData(w, h);
        
        var rang = canalActual === 'bt108' ? { min: -80, max: 40 } : { min: -70, max: 30 };
        
        for (var py = 0; py < h; py++) {
            var dataRow = h - 1 - py;
            for (var x = 0; x < w; x++) {
                var v = bt[dataRow * w + x];
                var r = 0, g = 0, b = 0;
                if (v !== null && v !== undefined && !isNaN(v)) {
                    var t = (v - rang.min) / (rang.max - rang.min);
                    t = Math.max(0, Math.min(1, t));
                    var gris = Math.round(255 * (1 - t));
                    r = gris; g = gris; b = gris;
                }
                var idx = (py * w + x) * 4;
                imgData.data[idx] = r;
                imgData.data[idx+1] = g;
                imgData.data[idx+2] = b;
                imgData.data[idx+3] = 255;
            }
        }
        ctx.putImageData(imgData, 0, 0);
    }

    function mostrar() {
        var horaStr = String(horaActual).padStart(2, '0');
        var cacheHora = cacheDades[horaStr];
        
        if (!cacheHora || !cacheHora[canalActual]) {
            // Buscar l'hora disponible més propera
            var disponibles = horesDisponibles[canalActual];
            if (disponibles.length === 0) {
                visorInner.innerHTML = '<div style="color:#666;text-align:center;padding-top:100px;">Sense dades</div>';
                return;
            }
            var millor = disponibles[0];
            var md = Math.abs(millor - horaActual);
            for (var i = 0; i < disponibles.length; i++) {
                var d = Math.abs(disponibles[i] - horaActual);
                if (d < md) { md = d; millor = disponibles[i]; }
            }
            horaActual = millor;
            sliderHores.value = horaActual;
            horaStr = String(horaActual).padStart(2, '0');
            cacheHora = cacheDades[horaStr];
        }
        
        if (!cacheHora || !cacheHora[canalActual]) return;
        
        var dadesVar = cacheHora[canalActual];  // { nombre, unidades, datos }
        var coords = cacheHora.coordenadas;     // { lat: [...], lon: [...] }
        
        if (!coords || !dadesVar || !dadesVar.datos) return;
        
        var lats = coords.lat;
        var lons = coords.lon;
        var w = lons.length;
        var h = lats.length;
        
        assegurarCanvas(w, h);
        dibuixarBTCanvas(canvasBaseEl, dadesVar, lats, lons);
        
        ampleOriginal = w;
        altOriginal = h;
        
        if (!zoomInicialitzat) {
            centrarImatge();
            zoomInicialitzat = true;
        }
        limitarPan();
        actualitzarTransform();
        
        infoHoraUtc.textContent = '+'+String(horaActual).padStart(2,'0')+'h';
        infoHoraLocal.textContent = 'BT ' + canalActual + ' (' + w + 'x' + h + ')';
        document.title = '+'+String(horaActual).padStart(2,'0')+'h BT ' + canalActual;
    }

    // ═══════════════════ ZOOM / PAN ═══════════════════
    function actualitzarTransform() {
        visorInner.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + zoomNivell + ')';
        indicadorZoom.textContent = Math.round(zoomNivell * 100) + '%';
        botoResetZoom.style.display = (zoomNivell !== ZOOM_PER_DEFECTE || panX !== 0 || panY !== 0) ? 'block' : 'none';
    }

    function limitarPan() {
        var ac = contenidorPrincipal.clientWidth, al = contenidorPrincipal.clientHeight;
        var ae = ampleOriginal * zoomNivell, aa = altOriginal * zoomNivell;
        var minX = ac - ae, maxX = 0, minY = al - aa, maxY = 0;
        if (ae < ac) { minX = maxX = (ac - ae) / 2; }
        if (aa < al) { minY = maxY = (al - aa) / 2; }
        panX = Math.max(minX, Math.min(maxX, panX));
        panY = Math.max(minY, Math.min(maxY, panY));
    }

    function aplicarZoom(nz, cx, cy) {
        var za = zoomNivell;
        zoomNivell = Math.max(zoomMin, Math.min(zoomMax, nz));
        if (cx !== undefined && cy !== undefined) {
            var fz = zoomNivell / za;
            panX = cx - fz * (cx - panX);
            panY = cy - fz * (cy - panY);
        }
        limitarPan();
        actualitzarTransform();
    }

    function resetZoom() {
        zoomNivell = ZOOM_PER_DEFECTE;
        panX = 0; panY = 0;
        centrarImatge();
        actualitzarTransform();
    }

    function centrarImatge() {
        if (!ampleOriginal || !altOriginal) return;
        var ac = contenidorPrincipal.clientWidth, al = contenidorPrincipal.clientHeight;
        panX = (ac - ampleOriginal * zoomNivell) / 2;
        panY = (al - altOriginal * zoomNivell) / 2;
    }

    // ═══════════════════ EVENTS ═══════════════════
    contenidorPrincipal.addEventListener('mousedown', function(e) {
        if (e.button === 0) {
            arrossegant = true;
            contenidorPrincipal.classList.add('panning');
            iniciPanX = e.clientX; iniciPanY = e.clientY;
            panInicialX = panX; panInicialY = panY;
            e.preventDefault();
        }
    });

    window.addEventListener('mousemove', function(e) {
        if (!arrossegant) return;
        panX = panInicialX + (e.clientX - iniciPanX);
        panY = panInicialY + (e.clientY - iniciPanY);
        limitarPan(); actualitzarTransform();
    });

    window.addEventListener('mouseup', function() {
        arrossegant = false;
        contenidorPrincipal.classList.remove('panning');
    });

    contenidorPrincipal.addEventListener('wheel', function(e) {
        e.preventDefault();
        var r = contenidorPrincipal.getBoundingClientRect();
        aplicarZoom(zoomNivell * (e.deltaY > 0 ? 0.9 : 1.1), e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });

    contenidorPrincipal.addEventListener('touchstart', function(e) {
        if (e.touches.length === 1) {
            arrossegant = true;
            contenidorPrincipal.classList.add('panning');
            iniciPanX = e.touches[0].clientX; iniciPanY = e.touches[0].clientY;
            panInicialX = panX; panInicialY = panY;
        } else if (e.touches.length === 2) {
            arrossegant = false;
            distTocInicial = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            zoomInicialToc = zoomNivell;
        }
        e.preventDefault();
    }, { passive: false });

    contenidorPrincipal.addEventListener('touchmove', function(e) {
        if (e.touches.length === 1 && arrossegant) {
            panX = panInicialX + (e.touches[0].clientX - iniciPanX);
            panY = panInicialY + (e.touches[0].clientY - iniciPanY);
            limitarPan(); actualitzarTransform();
        } else if (e.touches.length === 2) {
            var da = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            var cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            var cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            var r = contenidorPrincipal.getBoundingClientRect();
            aplicarZoom(zoomInicialToc * (da / distTocInicial), cx - r.left, cy - r.top);
        }
        e.preventDefault();
    }, { passive: false });

    contenidorPrincipal.addEventListener('touchend', function() {
        arrossegant = false;
        contenidorPrincipal.classList.remove('panning');
    });

    botoResetZoom.addEventListener('click', function(e) { resetZoom(); e.stopPropagation(); });
    window.addEventListener('resize', function() { limitarPan(); actualitzarTransform(); });

    // ═══════════════════ CONTROLS ═══════════════════
    function anar(h) {
        h = Math.max(0, Math.min(MAX_HORES - 1, h));
        horaActual = h;
        sliderHores.value = h;
        mostrar();
    }

    function togglePlay() { if (reproduint) aturar(); else play(); }

    function play() {
        reproduint = true;
        btnPlay.textContent = 'Pausa';
        btnPlay.classList.add('actiu');
        function tick() {
            if (!reproduint) return;
            var n = horaActual + 1;
            if (n >= MAX_HORES) n = 0;
            anar(n);
            timerPlay = setTimeout(tick, 400);
        }
        tick();
    }

    function aturar() {
        reproduint = false;
        btnPlay.textContent = 'Play';
        btnPlay.classList.remove('actiu');
        clearTimeout(timerPlay);
        timerPlay = null;
    }

    function canviarCanal(nou) {
        canalActual = nou;
        selectCanal.value = nou;
        if (nou === 'bt108') { ZOOM_PER_DEFECTE = ZOOM_BT108; zoomMin = ZOOM_BT108; }
        else { ZOOM_PER_DEFECTE = ZOOM_BT62; zoomMin = ZOOM_BT62; }
        zoomNivell = ZOOM_PER_DEFECTE;
        zoomInicialitzat = false;
        mostrar();
    }

    selectCanal.addEventListener('change', function() { aturar(); canviarCanal(selectCanal.value); });
    sliderHores.addEventListener('input', function() { aturar(); anar(parseInt(sliderHores.value)); });
    btnRetrocedir.addEventListener('click', function() { aturar(); anar(horaActual - 1); });
    btnAvancar.addEventListener('click', function() { aturar(); anar(horaActual + 1); });
    btnPlay.addEventListener('click', togglePlay);

    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
        switch(e.key) {
            case 'ArrowLeft': e.preventDefault(); aturar(); anar(horaActual - 1); break;
            case 'ArrowRight': e.preventDefault(); aturar(); anar(horaActual + 1); break;
            case ' ': e.preventDefault(); togglePlay(); break;
            case '1': e.preventDefault(); aturar(); canviarCanal('bt108'); break;
            case '2': e.preventDefault(); aturar(); canviarCanal('bt62'); break;
            case '0': e.preventDefault(); resetZoom(); break;
            case '+': case '=': e.preventDefault(); aplicarZoom(zoomNivell * 1.2, contenidorPrincipal.clientWidth/2, contenidorPrincipal.clientHeight/2); break;
            case '-': e.preventDefault(); aplicarZoom(zoomNivell * 0.8, contenidorPrincipal.clientWidth/2, contenidorPrincipal.clientHeight/2); break;
        }
    });

    // ═══════════════════ INICI ═══════════════════
    carregarTot();
})();
</script>
