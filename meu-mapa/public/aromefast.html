<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AROME0025 - Visor Meteorològic Catalunya | ICC</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: white;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        
        #container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        
        #map {
            flex: 1;
            height: 100%;
            z-index: 1;
        }
        
        #sidebar {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            width: 300px;
            max-height: calc(100vh - 20px);
            overflow-y: auto;
        }
        
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 18px;
            display: none;
            text-align: center;
            border: 2px solid #4CAF50;
        }
        
        #loading.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .title-bar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(20, 20, 30, 0.9);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            backdrop-filter: blur(10px);
            border: 1px solid #4CAF50;
            pointer-events: none;
            text-align: center;
        }
        
        .title-bar small {
            display: block;
            font-size: 11px;
            color: #aaa;
            font-weight: normal;
        }
        
        .legend-wind {
            position: absolute;
            bottom: 30px;
            left: 10px;
            z-index: 1000;
            background: rgba(20, 20, 30, 0.9);
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
            backdrop-filter: blur(10px);
            border: 1px solid #555;
        }
        
        .legend-wind h4 {
            margin: 0 0 5px 0;
            color: #4CAF50;
        }
        
        @media (max-width: 768px) {
            #sidebar {
                width: 250px;
                font-size: 12px;
            }
            .title-bar {
                font-size: 14px;
                padding: 8px 15px;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <!-- Mapa -->
        <div id="map"></div>
        
        <!-- Títol -->
        <div class="title-bar">
            🌍 AROME0025 - Previsió Meteorològica
            <small>Institut Cartogràfic i Geològic de Catalunya</small>
        </div>
        
        <!-- Panell de controls -->
        <div id="sidebar">
            <div id="controls"></div>
        </div>
        
        <!-- Llegenda de vent -->
        <div class="legend-wind">
            <h4>💨 Llegenda vent (barbes)</h4>
            <div style="display:flex; align-items:center; gap:10px;">
                <span>○ Calma</span>
                <span>⎯ 10 km/h</span>
                <span>⎯⎯ 20 km/h</span>
            </div>
            <div style="display:flex; align-items:center; gap:10px; margin-top:3px;">
                <span>▶ 50 km/h</span>
                <span style="color:#ffd700;">Direcció: d'on ve</span>
            </div>
        </div>
        
        <!-- Indicador de càrrega -->
        <div id="loading">
            <div class="spinner"></div>
            <div>Carregant dades meteorològiques...</div>
        </div>
    </div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Mòdul de vent (barbes tradicionals) -->
    <script src="js/vent.js"></script>
    
    <!-- Motor de visualització principal -->
    <script src="js/mapafast.js"></script>
    
    <script>
        // Gestió de loading
        const loadingEl = document.getElementById('loading');
        
        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
            loadingEl.classList.add('active');
            try {
                const response = await originalFetch.apply(this, args);
                return response;
            } finally {
                setTimeout(() => loadingEl.classList.remove('active'), 300);
            }
        };
        
        // Tecles addicionals
        document.addEventListener('keydown', (e) => {
            const viewer = window.aromeViewer;
            if (!viewer) return;
            
            switch(e.key.toLowerCase()) {
                case 'r':
                    viewer.config.showRaster = !viewer.config.showRaster;
                    document.getElementById('showRaster').checked = viewer.config.showRaster;
                    viewer.renderVariable(viewer.currentVariable);
                    break;
                case 'w':
                    viewer.config.showWind = !viewer.config.showWind;
                    document.getElementById('showWind').checked = viewer.config.showWind;
                    viewer.renderVariable(viewer.currentVariable);
                    break;
                case 'i':
                    viewer.config.showIsolines = !viewer.config.showIsolines;
                    document.getElementById('showIsolines').checked = viewer.config.showIsolines;
                    viewer.renderVariable(viewer.currentVariable);
                    break;
                case 'm':
                    if (viewer.config.ventMode === 'particles') {
                        viewer.config.ventMode = 'streamlines';
                        document.getElementById('btnVentMode').textContent = '🎯 Mode: Streamlines';
                    } else {
                        viewer.config.ventMode = 'particles';
                        document.getElementById('btnVentMode').textContent = '🎯 Mode: Barbes';
                    }
                    viewer.renderVariable(viewer.currentVariable);
                    break;
            }
        });
        
        console.log('🌍 AROME0025 Fast Viewer + ICC + Barbes de vent | Llest!');
        console.log('   Tecles: ← → (hores), Espai (play), R (raster), W (vent), I (isolínies), M (mode)');
    </script>
</body>
</html>
