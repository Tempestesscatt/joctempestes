<style>
/* ═══════════════════════════════════════════════════════════════════
   VARIABLES GLOBALS
   ═══════════════════════════════════════════════════════════════════ */
:root {
    --bg: #0d1117;
    --panel: #0d1117;
    --panel-2: #161b22;
    --panel-hover: #1c2128;
    --line: rgba(240, 246, 252, 0.07);
    --line-strong: rgba(240, 246, 252, 0.15);
    --accent: #58a6ff;
    --accent-soft: rgba(88, 166, 255, 0.12);
    --gold: #ffd700;
    --gold-soft: rgba(255, 215, 0, 0.12);
    --gold-line: rgba(255, 215, 0, 0.28);
    --ok: #3fb950;
    --warn: #d29922;
    --danger: #f85149;
    --text: #f0f6fc;
    --text-2: #c9d1d9;
    --muted: #8b949e;
    --muted-2: #6e7681;
    --panel-width: 280px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
    width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none; font-size: 13px;
    touch-action: manipulation;
}

#map {
    position: absolute; inset: 0; width: 100%; height: 100%;
    background: #0e1620;
    touch-action: none;
}

body::before {
    content: ""; position: fixed; inset: 0; z-index: 400; pointer-events: none;
    background:
        linear-gradient(180deg, rgba(13, 17, 23, 0.35), transparent 10%),
        linear-gradient(0deg, rgba(13, 17, 23, 0.35), transparent 12%);
}

/* ═══════════════════════════════════════════════════════════════════
   ETIQUETA D'HORA
   ═══════════════════════════════════════════════════════════════════ */
#current_time_label {
    position: fixed;
    top: calc(14px + var(--safe-top));
    left: calc(var(--panel-width) + ((100vw - var(--panel-width)) / 2) + var(--safe-left));
    transform: translateX(-50%);
    z-index: 950;
    min-height: 34px;
    display: flex; align-items: center;
    padding: 7px 16px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: rgba(13, 17, 23, 0.88);
    color: var(--text);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    font-size: 12.5px; font-weight: 600; letter-spacing: 0.2px;
    pointer-events: none; white-space: nowrap;
    transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
body.panell-plegat #current_time_label { left: calc(50vw + var(--safe-left)); }
#current_time_label:empty { display: none; }

/* ═══════════════════════════════════════════════════════════════════
   INFO RUN
   ═══════════════════════════════════════════════════════════════════ */
#info_run {
    position: fixed;
    top: calc(14px + var(--safe-top));
    right: calc(16px + var(--safe-right));
    z-index: 950;
    min-height: 34px;
    display: none; align-items: center; gap: 8px;
    padding: 7px 14px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: rgba(13, 17, 23, 0.88);
    color: var(--text-2);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(20px) saturate(150%);
    font-size: 11.5px; font-weight: 500;
    pointer-events: none; white-space: nowrap;
}
#info_run.visible { display: inline-flex; }
#info_run .punt {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok); box-shadow: 0 0 8px var(--ok);
    flex: 0 0 auto; animation: pols 2s ease-in-out infinite;
}
#info_run.antic .punt { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
#info_run.pendent .punt { background: var(--muted-2); box-shadow: none; animation: none; }
@keyframes pols { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
#info_run .run { color: var(--text); font-weight: 700; font-family: 'SF Mono', monospace; }
#info_run .sep { color: var(--muted-2); }
#info_run .fa { color: var(--muted); font-size: 11px; }

/* ═══════════════════════════════════════════════════════════════════
   PANELL LATERAL
   ═══════════════════════════════════════════════════════════════════ */
#panell-pro {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: var(--panel-width); z-index: 700;
    display: flex; flex-direction: column;
    background: var(--panel);
    border-right: 1px solid var(--line);
    color: var(--text-2); overflow: hidden;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    font-family: 'Inter', system-ui, sans-serif;
}
#panell-pro.plegat { transform: translateX(-100%); }

#btn-obrir-panell {
    position: fixed;
    top: calc(14px + var(--safe-top));
    left: calc(14px + var(--safe-left));
    z-index: 800;
    background: rgba(13, 17, 23, 0.9);
    color: var(--text);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(12px);
    display: none; align-items: center; gap: 8px;
    font-family: inherit;
    transition: all 0.15s ease;
}
#btn-obrir-panell.visible { display: inline-flex; }
#btn-obrir-panell:hover { background: var(--panel-hover); border-color: var(--accent); }

.pp-cap {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 10px;
    flex-shrink: 0;
}
.pp-titol {
    font-size: 11.5px; font-weight: 700; color: var(--text);
    letter-spacing: 0.6px; text-transform: uppercase;
}
.pp-sub { font-size: 10px; color: var(--muted); margin-top: 2px; }
.pp-plega {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
    transition: all 0.15s ease;
    flex-shrink: 0;
}
.pp-plega:hover { color: var(--text); background: var(--panel-hover); border-color: var(--line-strong); }
.pp-plega svg { display: block; }

.pp-user-bar {
    margin: 0 14px 10px;
    display: flex; align-items: center; gap: 6px;
    flex-shrink: 0;
}
.pp-user-bar button {
    flex: 1;
    padding: 8px 10px;
    font-size: 11px; font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text-2);
    font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: all 0.15s ease;
}
.pp-user-bar button:hover { background: var(--panel-hover); color: var(--text); }
.pp-user-bar button.primary {
    background: var(--accent-soft);
    border-color: rgba(88, 166, 255, 0.35);
    color: var(--accent);
}
.pp-user-bar button.primary:hover { background: rgba(88, 166, 255, 0.2); }
.pp-user-bar button .avatar {
    width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700;
    color: #0d1117;
    background: linear-gradient(135deg, var(--gold), #ffb300);
    overflow: hidden;
}
.pp-user-bar button .avatar img { width: 100%; height: 100%; object-fit: cover; }

.pp-actual {
    margin: 0 14px 12px;
    padding: 9px 12px;
    border-radius: 6px;
    background: var(--accent-soft);
    border: 1px solid rgba(88, 166, 255, 0.25);
    font-size: 12.5px;
    color: var(--accent);
    font-weight: 600;
    display: flex; justify-content: space-between; gap: 8px;
    align-items: center;
    flex-shrink: 0;
}
.pp-actual span:last-child {
    color: var(--muted); font-weight: 500;
    white-space: nowrap; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.5px;
}

.pp-tabs {
    display: flex; gap: 0; padding: 0 16px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
}
.pp-tab {
    flex: 1; padding: 9px 4px;
    font-size: 10.5px; font-weight: 600;
    cursor: pointer; background: transparent; color: var(--muted);
    font-family: inherit; border: none;
    border-bottom: 2px solid transparent;
    transition: all 0.15s ease; letter-spacing: 0.5px; text-transform: uppercase;
}
.pp-tab:hover { color: var(--text-2); }
.pp-tab.actiu { color: var(--accent); border-bottom-color: var(--accent); }

.pp-cos {
    display: none; flex-direction: column;
    min-height: 0; flex: 1 1 0; overflow: hidden;
}
.pp-cos.actiu { display: flex; }

.pp-cerca { position: relative; margin: 12px 14px 8px; flex-shrink: 0; }
.pp-cerca input {
    width: 100%; box-sizing: border-box;
    padding: 8px 30px 8px 32px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text); font-size: 12px;
    outline: none; font-family: inherit;
}
.pp-cerca input:focus { border-color: var(--accent); }
.pp-cerca input::placeholder { color: var(--muted-2); }
.pp-cerca .ico {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none; display: flex;
}
.pp-cerca .ico svg { display: block; }
.pp-cerca .esb {
    position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--muted); cursor: pointer;
    width: 24px; height: 24px; display: none;
    align-items: center; justify-content: center; padding: 0;
}
.pp-cerca .esb:hover { color: var(--text); }
.pp-cerca .esb svg { display: block; }

.pp-llista {
    overflow-y: auto; padding: 0 8px 14px;
    min-height: 0; flex: 1 1 0;
    -webkit-overflow-scrolling: touch;
}
.pp-llista::-webkit-scrollbar { width: 5px; }
.pp-llista::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }

.sec { margin-bottom: 1px; }
.sec-cap {
    display: flex; align-items: center; gap: 9px;
    width: 100%; padding: 9px 10px;
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.6px;
    text-align: left; font-family: inherit;
    border-radius: 5px; transition: background 0.12s ease;
}
.sec-cap:hover { background: var(--panel-hover); color: var(--text-2); }
.sec-punt { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }
.sec-nom { flex: 1; }
.sec-n {
    font-size: 9.5px; font-weight: 600; color: var(--muted-2);
    background: var(--panel-2); padding: 1px 6px; border-radius: 8px;
}
.sec-fletxa { color: var(--muted-2); transition: transform 0.15s ease; display: flex; }
.sec-fletxa svg { display: block; }
.sec.oberta .sec-fletxa { transform: rotate(90deg); }
.sec-cos {
    display: none; padding: 0 0 4px 8px;
    margin-left: 12px; border-left: 1px solid var(--line);
}
.sec.oberta .sec-cos { display: block; }

.param-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; padding: 7px 10px; margin: 0;
    border-radius: 5px; cursor: pointer;
    font-size: 12.5px; color: var(--text-2);
    font-weight: 400; transition: background 0.12s ease;
    line-height: 1.3;
}
.param-row:hover { background: var(--panel-hover); color: var(--text); }
.param-row.param-selected {
    background: var(--accent-soft);
    color: var(--accent); font-weight: 600;
    box-shadow: inset 2px 0 0 var(--accent);
}
.param-row.premium-bloquejat {
    opacity: 0.4;
    filter: grayscale(0.7);
    cursor: not-allowed;
}
.param-row .unitat {
    font-size: 9.5px; color: var(--muted-2);
    white-space: nowrap; text-transform: uppercase;
    letter-spacing: 0.4px; font-weight: 500;
}
.param-row.param-selected .unitat { color: var(--accent); opacity: 0.8; }

.pp-buit {
    color: var(--muted-2); font-size: 12px;
    text-align: center; padding: 22px 10px;
}

/* ═══════════════════════════════════════════════════════════════════
   SELECTOR D'ALÇADES
   ═══════════════════════════════════════════════════════════════════ */
.param-altura-grup {
    margin: 1px 0;
    border-radius: 6px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.015);
    border: 1px solid transparent;
    transition: all 0.15s ease;
}
.param-altura-grup:hover { background: rgba(255, 255, 255, 0.03); }
.param-altura-grup.obert {
    background: rgba(88, 166, 255, 0.05);
    border-color: rgba(88, 166, 255, 0.2);
}
.param-altura-grup.premium-bloquejat {
    opacity: 0.4;
    filter: grayscale(0.7);
}
.param-altura-cap {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--text-2);
    user-select: none;
    transition: color 0.15s ease;
}
.param-altura-cap:hover { color: var(--text); }
.param-altura-grup.obert .param-altura-cap { color: var(--accent); font-weight: 600; }
.param-altura-nom {
    flex: 1;
    display: flex; align-items: center; gap: 6px;
    min-width: 0;
}
.param-altura-nom .nom { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.param-altura-nom .cadenat { font-size: 10px; opacity: 0.7; }
.param-altura-valor {
    font-size: 10px;
    color: var(--muted);
    font-family: 'SF Mono', ui-monospace, monospace;
    white-space: nowrap;
    padding: 2px 7px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.04);
    transition: all 0.15s ease;
}
.param-altura-grup.obert .param-altura-valor {
    background: rgba(88, 166, 255, 0.15);
    color: var(--accent);
}
.param-altura-fletxa {
    color: var(--muted-2);
    font-size: 9px;
    transition: transform 0.2s ease;
}
.param-altura-grup.obert .param-altura-fletxa { transform: rotate(180deg); }
.param-altura-opcions {
    display: none;
    padding: 4px 6px 8px 6px;
    background: rgba(0, 0, 0, 0.25);
    border-top: 1px solid rgba(255, 255, 255, 0.05);
}
.param-altura-grup.obert .param-altura-opcions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
}
.param-altura-opcio {
    padding: 6px 8px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 10.5px;
    color: var(--text-2);
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid transparent;
    text-align: center;
    transition: all 0.12s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    line-height: 1.2;
}
.param-altura-opcio:hover {
    background: rgba(88, 166, 255, 0.1);
    color: var(--accent);
    border-color: rgba(88, 166, 255, 0.2);
}
.param-altura-opcio.activa {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: rgba(88, 166, 255, 0.4);
    font-weight: 600;
}
.param-altura-opcio .hpa {
    font-weight: 700;
    font-family: 'SF Mono', ui-monospace, monospace;
    font-size: 11px;
}
.param-altura-opcio .km {
    font-size: 9px;
    color: var(--muted);
    font-weight: 400;
}
.param-altura-opcio.activa .km { color: var(--accent); opacity: 0.8; }

/* Ciutats */
.ciu-fila {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; margin: 0;
    border-radius: 5px; cursor: pointer;
}
.ciu-fila:hover { background: var(--panel-hover); }
.ciu-fila.sel { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.ciu-pin {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); border: 1.5px solid var(--text);
    flex: 0 0 auto;
}
.ciu-pin.cap { background: var(--gold); }
.ciu-nom { flex: 1; font-size: 12.5px; color: var(--text); font-weight: 500; }
.ciu-pob { font-size: 10px; color: var(--muted); }
.ciu-info { padding: 0 16px 6px; font-size: 10px; color: var(--muted); flex-shrink: 0; }
.ciu-treu {
    margin: 0 14px 8px; padding: 7px 10px;
    font-size: 11px; font-weight: 600; cursor: pointer;
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px;
    font-family: inherit; display: none;
    align-items: center; gap: 6px;
    flex-shrink: 0;
}
.ciu-treu:hover { color: var(--text); background: var(--panel-hover); }

/* Capes */
.capes-cos { padding: 8px 16px 18px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.cap-titol {
    font-size: 9.5px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.8px;
    margin: 14px 0 2px; padding-bottom: 4px;
}
.cap-fila {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; font-size: 12.5px; color: var(--text-2);
    cursor: pointer; user-select: none;
}
.cap-fila:hover { color: var(--text); }
.interruptor {
    width: 30px; height: 17px; border-radius: 9px;
    background: var(--panel-2); border: 1px solid var(--line-strong);
    position: relative; transition: all 0.18s ease; flex: 0 0 auto;
}
.interruptor::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--muted); transition: all 0.18s ease;
}
.cap-fila.on .interruptor { background: var(--accent-soft); border-color: var(--accent); }
.cap-fila.on .interruptor::after { transform: translateX(13px); background: var(--accent); }

.ctrl-label {
    display: block; font-size: 9.5px; color: var(--muted);
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px;
    margin: 10px 0 5px;
}
.ctrl-select {
    width: 100%; background: var(--panel-2);
    border: 1px solid var(--line); color: var(--text);
    padding: 7px 9px; border-radius: 6px;
    font-size: 12px; font-family: inherit; outline: none; cursor: pointer;
}
.ctrl-select option { background: var(--panel); color: var(--text); }
#panell-pro input[type=range] { width: 100%; accent-color: var(--accent); }
.cap-reset {
    margin-top: 16px; width: 100%; padding: 8px;
    font-size: 10.5px; font-weight: 600; cursor: pointer;
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px;
    font-family: inherit; text-transform: uppercase;
    letter-spacing: 0.5px;
}
.cap-reset:hover { color: var(--text); background: var(--panel-hover); }

/* ═══════════════════════════════════════════════════════════════════
   SISTEMA (botó d'actualitzacions)
   ═══════════════════════════════════════════════════════════════════ */
.sistema-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 12px;
    margin-top: 4px;
    border-radius: 8px;
    border: 1px solid var(--line-strong);
    background: var(--panel-2);
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
}
.sistema-btn:hover {
    background: var(--panel-hover);
    border-color: var(--accent);
    color: var(--accent);
}
.sistema-btn:disabled {
    opacity: 0.55;
    cursor: wait;
}
.sistema-btn.carregant .ico {
    display: inline-block;
    animation: gira 1s linear infinite;
}
.sistema-btn.nova {
    background: rgba(255, 215, 0, 0.12);
    border-color: rgba(255, 215, 0, 0.5);
    color: var(--gold);
    animation: polsSistema 1.6s ease-in-out infinite;
}
@keyframes polsSistema {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,215,0,0.4); }
    50%      { box-shadow: 0 0 0 6px rgba(255,215,0,0); }
}
.sistema-btn .ico { display: inline-block; }

.sistema-estat {
    margin-top: 8px;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 10.5px;
    font-weight: 500;
    text-align: center;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--line);
    min-height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.sistema-estat:empty { display: none; }
.sistema-estat.ok     { color: var(--ok); border-color: rgba(63, 185, 80, 0.3); background: rgba(63, 185, 80, 0.08); }
.sistema-estat.nova   { color: var(--gold); border-color: rgba(255, 215, 0, 0.4); background: rgba(255, 215, 0, 0.10); }
.sistema-estat.error  { color: var(--danger); border-color: rgba(248, 81, 73, 0.3); background: rgba(248, 81, 73, 0.08); }
.sistema-estat.comprovant { color: var(--accent); border-color: rgba(88, 166, 255, 0.3); background: rgba(88, 166, 255, 0.08); }

/* Banner flotant de nova versió */
.banner-nova-versio {
    position: fixed;
    top: calc(14px + var(--safe-top));
    left: 50%;
    transform: translate(-50%, -140%);
    z-index: 9600;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: rgba(13, 17, 23, 0.96);
    border: 1px solid rgba(255, 215, 0, 0.5);
    border-radius: 10px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
    max-width: calc(100vw - 24px);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: auto;
}
.banner-nova-versio.visible { transform: translate(-50%, 0); }
.banner-nova-versio .bnv-ico { font-size: 20px; flex-shrink: 0; }
.banner-nova-versio .bnv-text {
    display: flex; flex-direction: column; gap: 1px; min-width: 0;
}
.banner-nova-versio .bnv-text strong {
    font-size: 12.5px; color: var(--gold); font-weight: 700;
}
.banner-nova-versio .bnv-text span {
    font-size: 10.5px; color: var(--muted);
}
.banner-nova-versio .bnv-btn {
    background: var(--gold); color: #1b1030; border: none;
    padding: 7px 14px; border-radius: 6px;
    font-family: inherit; font-size: 11.5px; font-weight: 700;
    cursor: pointer; white-space: nowrap;
    transition: background 0.15s ease;
}
.banner-nova-versio .bnv-btn:hover { background: #ffdf33; }
.banner-nova-versio .bnv-tanca {
    background: none; border: none; color: var(--muted);
    font-size: 14px; cursor: pointer; padding: 0 4px; font-family: inherit;
}
.banner-nova-versio .bnv-tanca:hover { color: var(--text); }

/* Toast sistema */
.toast-sistema {
    position: fixed;
    bottom: calc(80px + var(--safe-bottom));
    left: 50%;
    transform: translate(-50%, 20px);
    z-index: 9700;
    padding: 9px 16px;
    background: rgba(13, 17, 23, 0.95);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    max-width: calc(100vw - 32px);
    white-space: nowrap;
}
.toast-sistema.visible {
    opacity: 1;
    transform: translate(-50%, 0);
}
.toast-sistema.ok    { border-color: rgba(63, 185, 80, 0.5); color: #7ee787; }
.toast-sistema.error { border-color: rgba(248, 81, 73, 0.5); color: #ff7b72; }

/* ═══════════════════════════════════════════════════════════════════
   LLEGENDES CSS
   ═══════════════════════════════════════════════════════════════════ */
.llegenda-css {
    position: fixed;
    right: calc(16px + var(--safe-right));
    bottom: calc(80px + var(--safe-bottom));
    width: 170px;
    background: rgba(15, 20, 32, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    padding: 8px 10px;
    font: 600 11px 'Inter', system-ui, sans-serif;
    color: #e8eef8;
    z-index: 510;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    pointer-events: none;
}
.llegenda-css .lc-titol {
    font-size: 11.5px; font-weight: 700; margin-bottom: 6px; color: #fff;
    letter-spacing: 0.2px;
}
.llegenda-css .lc-unitat {
    font-size: 10px; opacity: 0.7; font-weight: 500; margin-left: 4px;
}
.llegenda-css .lc-fila {
    display: flex; align-items: center; gap: 6px;
    margin: 2px 0; font-size: 10.5px;
}
.llegenda-css .lc-color {
    width: 22px; height: 11px; border-radius: 2px;
    flex-shrink: 0; border: 1px solid rgba(0, 0, 0, 0.35);
}
.llegenda-css .lc-valor { font-variant-numeric: tabular-nums; }

/* ═══════════════════════════════════════════════════════════════════
   DOCK INFERIOR
   ═══════════════════════════════════════════════════════════════════ */
#dock {
    position: fixed;
    left: calc(var(--panel-width) + 16px + var(--safe-left));
    right: calc(90px + var(--safe-right));
    bottom: calc(14px + var(--safe-bottom));
    z-index: 900;
    height: 48px; display: flex; align-items: center; gap: 6px;
    padding: 4px; border: 1px solid var(--line); border-radius: 10px;
    background: rgba(13, 17, 23, 0.88);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.25s ease;
}
body.panell-plegat #dock { left: calc(16px + var(--safe-left)); }

#btnPlay {
    flex: 0 0 auto; height: 38px; padding: 0 14px;
    border: 1px solid transparent; border-radius: 6px;
    background: transparent; color: var(--text-2);
    font: 600 10.5px 'Inter', sans-serif;
    letter-spacing: 0.5px; cursor: pointer;
    white-space: nowrap;
    display: inline-flex; align-items: center; gap: 7px;
    text-transform: uppercase;
    transition: all 0.15s ease;
}
#btnPlay svg { display: block; flex: 0 0 auto; }
#btnPlay:hover { background: var(--panel-hover); color: var(--text); }
#btnPlay.actiu { background: var(--accent-soft); color: var(--accent); border-color: rgba(88, 166, 255, 0.3); }

#fh_grid { flex: 1 1 auto; min-width: 0; overflow: hidden; }
#fh_grid .fh-scroll {
    display: flex; gap: 1px; padding: 2px;
    overflow-x: auto; scrollbar-width: none;
    -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
}
#fh_grid .fh-scroll::-webkit-scrollbar { display: none; }

.fh-item {
    flex: 0 0 auto; padding: 3px 9px;
    border-radius: 5px; cursor: pointer;
    font-size: 10.5px; font-weight: 500;
    text-align: center; min-width: 42px;
    user-select: none; line-height: 1.2;
    color: var(--muted); background: transparent;
    border: 1px solid transparent;
    position: relative;
    transition: all 0.15s ease;
}
.fh-item:hover { background: var(--panel-hover); color: var(--text-2); }
.fh-item.active {
    color: var(--accent); background: var(--accent-soft);
    border-color: rgba(88, 166, 255, 0.35); font-weight: 600;
}
.fh-item.locked {
    opacity: 0.3; cursor: not-allowed;
    filter: grayscale(0.7);
}
.fh-item.locked::after {
    content: '🔒';
    position: absolute; top: 1px; right: 2px;
    font-size: 7px;
}
.fh-hora { font-weight: 600; }
.fh-dia { font-size: 8px; opacity: 0.7; margin-top: -1px; text-transform: uppercase; letter-spacing: 0.3px; }
.fh-ahir  { color: var(--muted-2); }
.fh-avui  { color: var(--accent); }
.fh-dema  { color: #d29922; }
.fh-dema2 { color: #f85149; }

/* ═══════════════════════════════════════════════════════════════════
   LLEGENDA PNG (base)
   ═══════════════════════════════════════════════════════════════════ */
.llegenda-mapa {
    position: fixed;
    right: calc(16px + var(--safe-right));
    bottom: calc(80px + var(--safe-bottom));
    max-width: 220px; max-height: 45vh;
    z-index: 500; border-radius: 6px; display: none;
    pointer-events: none;
    background: rgba(13, 17, 23, 0.85);
    padding: 6px; border: 1px solid var(--line);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

/* ═══════════════════════════════════════════════════════════════════
   PANTALLA DE CÀRREGA
   ═══════════════════════════════════════════════════════════════════ */
#loading_overlay {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    background: var(--bg); color: var(--text-2);
    font-size: 12px; font-weight: 500;
    transition: opacity 0.35s ease;
}
#loading_overlay.hidden { opacity: 0; pointer-events: none; }
#loading_overlay .spinner {
    width: 28px; height: 28px;
    border: 2px solid var(--line-strong);
    border-top-color: var(--accent); border-radius: 50%;
    animation: gira 0.9s linear infinite;
}
@keyframes gira { to { transform: rotate(360deg); } }

/* ═══════════════════════════════════════════════════════════════════
   MENÚ CONTEXTUAL
   ═══════════════════════════════════════════════════════════════════ */
.menu-ctx {
    position: fixed; z-index: 8500;
    background: rgba(13, 17, 23, 0.96);
    border: 1px solid var(--line-strong);
    border-radius: 8px; padding: 4px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 12px; color: var(--text-2);
    min-width: 200px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
}
.menu-ctx-cap {
    padding: 8px 12px; font-size: 10px; color: var(--muted);
    border-bottom: 1px solid var(--line);
    text-transform: uppercase; letter-spacing: 0.5px;
    font-weight: 600; font-family: 'SF Mono', monospace;
}
.menu-ctx-boto {
    display: flex; align-items: center; gap: 10px;
    width: 100%; background: none; border: none;
    text-align: left; padding: 10px 12px;
    color: var(--text-2); cursor: pointer;
    font-family: inherit; font-size: 12.5px;
    border-radius: 5px; transition: background 0.15s ease;
}
.menu-ctx-boto:hover { background: var(--panel-hover); color: var(--text); }
.menu-ctx-ico { color: var(--accent); font-weight: 700; font-size: 14px; }

/* ═══════════════════════════════════════════════════════════════════
   DIÀLEGS SKEW-T
   ═══════════════════════════════════════════════════════════════════ */
.skewt-dlg {
    position: fixed; inset: 0; z-index: 8600;
    display: flex; align-items: center; justify-content: center;
    background: rgba(13, 17, 23, 0.7);
    backdrop-filter: blur(4px);
    font-family: 'Inter', system-ui, sans-serif;
}
.skewt-dlg-cos {
    background: var(--panel-2);
    border: 1px solid var(--line-strong);
    border-radius: 10px; padding: 20px 24px;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
    color: var(--text-2);
}
.skewt-dlg-titol { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.skewt-dlg-text { font-size: 12.5px; line-height: 1.6; margin-bottom: 18px; }
.skewt-dlg-coord { color: var(--muted); font-family: 'SF Mono', monospace; font-size: 11px; }
.skewt-dlg-botons { display: flex; gap: 8px; justify-content: flex-end; }
.skewt-btn {
    padding: 8px 16px; border-radius: 6px; cursor: pointer;
    font-family: inherit; font-size: 12px; font-weight: 600;
    transition: all 0.15s ease;
}
.skewt-btn-no {
    background: transparent; border: 1px solid var(--line-strong); color: var(--text-2);
}
.skewt-btn-no:hover { background: var(--panel-hover); color: var(--text); }
.skewt-btn-si { background: var(--accent); border: 1px solid var(--accent); color: #0d1117; font-weight: 700; }
.skewt-btn-si:hover { background: #79b8ff; border-color: #79b8ff; }

.skewt-carregant {
    position: fixed; inset: 0; z-index: 8700;
    display: flex; align-items: center; justify-content: center;
    background: rgba(13, 17, 23, 0.95);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text); flex-direction: column; gap: 14px;
}
.skewt-spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--line-strong);
    border-top-color: var(--accent); border-radius: 50%;
    animation: gira 0.9s linear infinite;
}
.skewt-carregant-text { font-size: 13px; font-weight: 600; }
.skewt-carregant-coord { font-size: 11px; color: var(--muted); font-family: 'SF Mono', monospace; }

.skewt-error {
    position: fixed; inset: 0; z-index: 8700;
    display: flex; align-items: center; justify-content: center;
    background: rgba(13, 17, 23, 0.95);
    font-family: 'Inter', system-ui, sans-serif;
}
.skewt-error-cos {
    background: var(--panel-2);
    border: 1px solid var(--line-strong);
    border-radius: 10px; padding: 22px 28px;
    max-width: 420px; color: var(--text-2);
    text-align: center; line-height: 1.6;
}
.skewt-error-ico { font-size: 32px; opacity: 0.5; }
.skewt-error-text { font-size: 13px; margin-top: 12px; white-space: pre-line; }
.skewt-error-btn {
    margin-top: 16px; background: var(--accent);
    border: 1px solid var(--accent); color: #0d1117;
    padding: 8px 18px; border-radius: 6px;
    cursor: pointer; font-family: inherit;
    font-size: 12px; font-weight: 700;
}

/* ═══════════════════════════════════════════════════════════════════
   MODALS
   ═══════════════════════════════════════════════════════════════════ */
.modal-overlay {
    position: fixed; inset: 0; z-index: 10000;
    display: none; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(4px);
    padding: 16px;
}
.modal-overlay.active { display: flex; }

.modal-cos {
    background: var(--panel);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    max-width: 400px; width: 100%;
    max-height: 85vh; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
}
.modal-cap {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
}
.modal-titol { font-size: 14px; font-weight: 700; color: var(--text); }
.modal-tanca {
    background: none; border: none; color: var(--muted);
    font-size: 18px; cursor: pointer; padding: 0 4px;
}
.modal-tanca:hover { color: var(--text); }
.modal-body { padding: 18px; }

.btn-google {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 10px;
    background: white; color: #333;
    border: none; border-radius: 6px;
    font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    transition: background 0.15s ease;
}
.btn-google:hover { background: #f5f5f5; }
.btn-google i { color: #db4437; font-size: 16px; }

.camp { margin-bottom: 12px; }
.camp label {
    display: block; font-size: 10px; font-weight: 600;
    color: var(--muted); margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: 0.5px;
}
.camp input {
    width: 100%; padding: 9px 12px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; color: var(--text); font-size: 13px;
    outline: none; font-family: inherit;
}
.camp input:focus { border-color: var(--accent); }
.camp input:disabled { opacity: 0.5; cursor: not-allowed; }

/* Xat */
.xat-msgs {
    flex: 1; overflow-y: auto;
    padding: 12px 16px;
    display: flex; flex-direction: column; gap: 6px;
    min-height: 200px; max-height: 400px;
}
.xat-msgs::-webkit-scrollbar { width: 4px; }
.xat-msgs::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }
.xat-msg { display: flex; flex-direction: column; gap: 2px; }
.xat-msg-cap { display: flex; align-items: center; gap: 6px; }
.xat-avatar {
    width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: #fff;
    flex-shrink: 0; overflow: hidden;
}
.xat-avatar img { width: 100%; height: 100%; object-fit: cover; }
.xat-nom { font-size: 11px; font-weight: 700; color: var(--gold); }
.xat-hora { font-size: 8px; color: var(--muted); margin-left: auto; }
.xat-text {
    font-size: 12.5px; color: var(--text-2);
    background: var(--panel-2); padding: 6px 10px;
    border-radius: 8px; max-width: 90%;
    word-break: break-word; line-height: 1.4;
}
.xat-peu {
    padding: 10px 14px; border-top: 1px solid var(--line);
    display: flex; gap: 8px;
}
.xat-peu input {
    flex: 1; padding: 8px 14px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 18px; color: var(--text);
    font-size: 12px; outline: none; font-family: inherit;
}
.xat-peu input:focus { border-color: var(--accent); }
.xat-peu button {
    padding: 8px 16px; border-radius: 18px;
    background: var(--accent); border: none;
    color: #0d1117; font-weight: 700;
    font-size: 12px; cursor: pointer; font-family: inherit;
}
.xat-peu button:disabled { opacity: 0.4; cursor: not-allowed; }

/* Radar */
.radar-body { flex: 1; position: relative; background: #000; min-height: 400px; }
.radar-body iframe { width: 100%; height: 100%; border: none; display: block; min-height: 400px; }

/* ═══════════════════════════════════════════════════════════════════
   RESPONSIVE — MÒBIL
   ═══════════════════════════════════════════════════════════════════ */
@media (max-width: 860px) {
    :root { --panel-width: 100vw; }

    #panell-pro {
        width: 100vw;
        border-right: none;
        padding-top: var(--safe-top);
        padding-bottom: var(--safe-bottom);
    }

    .pp-cap {
        padding: 12px 14px 10px;
        gap: 10px;
    }
    .pp-plega {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: var(--panel-2);
        border: 1px solid var(--line-strong);
        color: var(--text);
        position: relative;
        z-index: 10;
        flex-shrink: 0;
    }
    .pp-plega svg { width: 18px; height: 18px; }

    #btn-obrir-panell {
        top: calc(10px + var(--safe-top));
        left: calc(10px + var(--safe-left));
        z-index: 800;
        padding: 10px 14px;
        font-size: 13px;
    }

    #current_time_label {
        top: calc(10px + var(--safe-top));
        left: 50vw;
        font-size: 12px;
        padding: 6px 14px;
    }
    body.panell-plegat #current_time_label { left: 50vw; }

    #info_run {
        top: calc(56px + var(--safe-top));
        right: calc(10px + var(--safe-right));
        padding: 5px 10px;
        font-size: 10.5px;
        z-index: 940;
    }

    #dock {
        left: calc(10px + var(--safe-left));
        right: calc(10px + var(--safe-right));
        bottom: calc(10px + var(--safe-bottom));
        height: 52px;
        padding: 5px;
    }
    #btnPlay {
        height: 40px;
        padding: 0 12px;
        font-size: 10px;
    }
    .fh-item {
        min-width: 46px;
        padding: 5px 9px;
        font-size: 11px;
    }
    .fh-hora { font-size: 11.5px; }
    .fh-dia { font-size: 8.5px; }

    /* 🔑 Amagar el dock quan el panell està obert a mòbil */
    body:not(.panell-plegat) #dock {
        transform: translateY(140%);
        opacity: 0;
        pointer-events: none;
    }

    .llegenda-mapa {
        right: calc(10px + var(--safe-right));
        bottom: calc(76px + var(--safe-bottom));
        max-width: 160px;
        max-height: 35vh;
    }
    .llegenda-css {
        right: calc(10px + var(--safe-right));
        bottom: calc(76px + var(--safe-bottom));
        width: 130px;
        font-size: 10px;
        padding: 6px 8px;
    }

    .pp-cos {
        min-height: 0;
        flex: 1 1 0;
        overflow: hidden;
    }
    .pp-llista {
        min-height: 0;
        flex: 1 1 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
    }
    .pp-tabs { flex-shrink: 0; }
    .pp-user-bar,

            '/web_data_NE/imatges/info_run.json',
            '/public/web_data_NE/imatges/info_run.json',
        ];
        for (const url of urls) {
            try {
                const r = await fetch(url + '?_cb=' + Date.now(), { cache: 'no-store' });
                if (!r.ok) continue;
                const ct = r.headers.get('content-type') || '';
                if (ct.includes('text/html')) continue;
                return await r.json();
            } catch (e) {}
        }
        return null;
    }

    function formatDataRun(info) {
        // Si el JSON porta una data ISO del run
        if (info.run_iso) {
            const ms = Date.parse(info.run_iso);
            if (isFinite(ms)) {
                const d = new Date(ms);
                const dia = String(d.getDate()).padStart(2, '0');
                const mes = String(d.getMonth() + 1).padStart(2, '0');
                const hora = String(d.getHours()).padStart(2, '0');
                const min = String(d.getMinutes()).padStart(2, '0');
                return `${dia}/${mes} · ${hora}:${min}`;
            }
        }
        // Si porta run_ts (segons o ms)
        if (info.run_ts && isFinite(info.run_ts)) {
            const ms = info.run_ts > 1e12 ? info.run_ts : info.run_ts * 1000;
            const d = new Date(ms);
            const dia = String(d.getDate()).padStart(2, '0');
            const mes = String(d.getMonth() + 1).padStart(2, '0');
            const hora = String(d.getHours()).padStart(2, '0');
            const min = String(d.getMinutes()).padStart(2, '0');
            return `${dia}/${mes} · ${hora}:${min}`;
        }
        // Si no hi ha data, mostrem només "avui"
        return 'avui';
    }

    // ─── Xat ─────────────────────────────────────────────────────────
    const PUSHER_KEY = '54b645506c85aed5b62e';
    const PUSHER_CLUSTER = 'eu';
    const API_CHAT = 'https://tempestes-cat.pages.dev/api';
    let pusherInicialitzat = false;
    const missatgesVistos = new Set();

    function escHtml(s) {
        return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatHora(ts) {
        if (!ts) return '';
        const d = new Date(ts);
        return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    function colorAvatar(nom) {
        const colors = ['#4080c0', '#c04040', '#40a060', '#c08020', '#8040c0', '#20a0a0', '#c04080'];
        let h = 0;
        for (let i = 0; i < (nom || '').length; i++) h = (h * 31 + nom.charCodeAt(i)) & 0xffff;
        return colors[h % colors.length];
    }

    function afegirMissatge(msg) {
        const c = document.getElementById('xatMsgs');
        if (!c) return;
        const id = msg.id || `${msg.ts}_${msg.uid || msg.nick}_${(msg.text || '').substring(0, 20)}`;
        if (missatgesVistos.has(id)) return;
        missatgesVistos.add(id);
        if (missatgesVistos.size > 200) {
            [...missatgesVistos].slice(0, 50).forEach(x => missatgesVistos.delete(x));
        }
        const esSistema = msg.type === 'system';
        const div = document.createElement('div');
        div.className = 'xat-msg';
        if (esSistema) {
            div.innerHTML = `<div style="text-align:center;color:var(--muted);font-size:11px;font-style:italic;">${escHtml(msg.text)}</div>`;
        } else {
            const avatar = msg.photo && msg.photo.length < 5000
                ? `<img src="${escHtml(msg.photo)}" alt="">`
                : (msg.nick || '?').charAt(0).toUpperCase();
            const bg = colorAvatar(msg.nick || 'X');
            div.innerHTML = `
                <div class="xat-msg-cap">
                    <div class="xat-avatar" style="background:${bg}">${avatar}</div>
                    <span class="xat-nom">${escHtml(msg.nick || 'Anònim')}</span>
                    <span class="xat-hora">${formatHora(msg.ts)}</span>
                </div>
                <div class="xat-text">${escHtml(msg.text || '')}</div>
            `;
        }
        c.appendChild(div);
        while (c.children.length > 50) c.removeChild(c.firstChild);
        c.scrollTop = c.scrollHeight;
    }

    window.toggleXat = function () {
        const m = document.getElementById('modalXat');
        if (!m) return;
        const obert = m.classList.contains('active');
        if (obert) { tancarModal('modalXat'); return; }

        if (inp) setTimeout(() => inp.focus(), 300);
        actualitzarBotoEnviar();
    };

    async function carregarMissatgesXat() {
        const c = document.getElementById('xatMsgs');
        if (!c) return;
        try {
            const r = await fetch(API_CHAT + '/get-messages');
            const msgs = await r.json();
            c.innerHTML = '';
            missatgesVistos.clear();
            if (msgs && msgs.length) msgs.slice(-30).forEach(afegirMissatge);
            else c.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px;font-size:13px;">Encara no hi ha missatges</div>';

            c.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px;font-size:13px;">Error carregant xat</div>';
        }
    }

    window.enviarMissatgeXat = async function () {
        const inp = document.getElementById('xatInput');

        const user = window._firebaseUser;
        if (!user) { obrirModal('modalLogin'); return; }

        const btn = document.getElementById('xatSendBtn');
        if (btn) { btn.disabled = true; btn.textContent = '...'; }
        try {
            const r = await fetch(API_CHAT + '/send-message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nick, photo: user.photoURL || '',
                    uid: user.uid, text,

            });
            const d = await r.json();
            if (d.ok) { inp.value = ''; actualitzarBotoEnviar(); }
        } catch (e) { console.error('[Xat]', e); }
        finally {
            if (btn) btn.textContent = 'Enviar';
            actualitzarBotoEnviar();
        }
    };

    function actualitzarBotoEnviar() {
        const inp = document.getElementById('xatInput');
        const btn = document.getElementById('xatSendBtn');
        if (!inp || !btn) return;
        btn.disabled = !(inp.value.trim().length > 0 && window._firebaseUser);
    }

    document.addEventListener('DOMContentLoaded', () => {
        const inp = document.getElementById('xatInput');
        if (inp) {
            inp.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault(); enviarMissatgeXat(); }
            });
            inp.addEventListener('input', actualitzarBotoEnviar);
        }
    });

    function inicialitzarPusher() {
        if (pusherInicialitzat || typeof Pusher === 'undefined') return;
        try {
            const p = new Pusher(PUSHER_KEY, { cluster: PUSHER_CLUSTER });
            const ch = p.subscribe('chat-channel');
            ch.bind('new-message', msg => {
                const modal = document.getElementById('modalXat');
                if (modal && modal.classList.contains('active')) afegirMissatge(msg);
            });
            pusherInicialitzat = true;
        } catch (e) {}
    }

    // ─── Radar ───────────────────────────────────────────────────────
    const RADAR_URL = 'https://radar.tempestes.cat/';
    let radarCarregat = false;
    window.obrirRadarModal = function () {
        const iframe = document.getElementById('radarIframe');
        if (!radarCarregat && iframe) {
            iframe.src = RADAR_URL;
            radarCarregat = true;
        }
        obrirModal('modalRadar');
    };

    // ─── Inicialització ──────────────────────────────────────────────
    async function inicialitzar() {
        if (window._firebaseUser) actualitzarUIUsuari(window._firebaseUser);
        inicialitzarInfoRun();
        setTimeout(inicialitzarPusher, 1500);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', inicialitzar);
    } else {
        inicialitzar();
    }
})();
</script>

</body>
</html>
