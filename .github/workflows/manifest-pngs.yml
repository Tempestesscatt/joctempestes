name: Manifest + Deploy (sense regenerar PNG)

# Només regenera manifest.json a partir del que ja hi ha a la branca 'data'
# i fa el deploy a Cloudflare. NO executa cap script de PNG.
# Es llança a mà ("Run workflow") o des d'on vulguis.
# (Els derivats tenen manifest propi dins web_data_derivats: aquí no es toquen.)
on:
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

# Mateix grup que els altres workflows: s'encuen i no es trepitgen
concurrency:
  group: deploy-data
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  CARPETES: "web_data_NE webdata_waves avis gfsmaps gfsESPmaps previsions_catalunya web_data_GFS web_data_derivats"

jobs:
  manifest_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}
        fetch-depth: 1

    # ══════════════════════════════════════════════════════════════════
    #  CLONAR private-scripts AMB DIAGNÒSTIC DETALLAT
    #  - El token va en una capçalera (no dins la URL) i emmascarat.
    #  - Si falla, a cada intent s'imprimeix:
    #      * si el secret és buit i quin tipus de token és
    #      * codi HTTP i capçaleres de l'API per al repo Scripts
    #      * límit de peticions (rate limit) del token
    #      * estat de githubstatus.com
    #      * les últimes línies del trace de git (amb x-github-request-id)
    # ══════════════════════════════════════════════════════════════════
    - name: Clonar private-scripts (amb diagnòstic)
      env:
        TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        GIT_TERMINAL_PROMPT: "0"
      run: |
        set +e

        diag() {
          echo "┌────────────── DIAGNÒSTIC (intent $1) ──────────────"
          echo "│ Hora UTC: $(date -u +%H:%M:%S)"

          # 1) El secret
          if [ -z "$TOKEN" ]; then
            echo "│ ❌ El secret PRIVATE_REPO_TOKEN està BUIT en aquest job"
          else
            case "$TOKEN" in
              github_pat_*) TIPUS="fine-grained (github_pat_)";;
              ghp_*)        TIPUS="classic (ghp_)";;
              ghs_*)        TIPUS="token d'instal·lació d'app (ghs_)";;
              *)            TIPUS="format desconegut";;
            esac
            echo "│ Secret: ${#TOKEN} caràcters | tipus: $TIPUS"
          fi

          # 2) Accés al repo Scripts via API
          echo "│ ── API: GET /repos/Tempestesscatt/Scripts"
          curl -sS -m 20 -D /tmp/h_repo.txt -o /tmp/b_repo.json \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Tempestesscatt/Scripts
          echo "│ curl exit: $?"
          grep -iE '^(HTTP|x-ratelimit-(limit|remaining|reset|resource)|retry-after|x-github-request-id|x-accepted-github-permissions|github-authentication-token-expiration|x-oauth-scopes)' /tmp/h_repo.txt | sed 's/^/│   /'
          echo "│   missatge: $(python3 -c 'import json;d=json.load(open("/tmp/b_repo.json"));print(d.get("message") or ("OK, private="+str(d.get("private"))+", permisos="+str(d.get("permissions"))))' 2>/dev/null)"
          echo "│   (200=OK | 401=token rebutjat/caducat | 403=rate limit o sense permís | 404=sense accés al repo | 5xx=GitHub)"

          # 3) Rate limit actual
          echo "│ ── API: /rate_limit"
          curl -sS -m 20 -H "Authorization: Bearer $TOKEN" https://api.github.com/rate_limit \
            | python3 -c '
        import json,sys,time
        try:
            r=json.load(sys.stdin)["resources"]
            for k in ("core","git","search"):
                if k in r:
                    x=r[k]; print("│   %-6s %s/%s restants, es reinicia %s UTC"%(k,x["remaining"],x["limit"],time.strftime("%H:%M:%S",time.gmtime(x["reset"]))))
        except Exception as e:
            print("│   no s han pogut llegir:",e)' 2>&1

          # 4) Estat de GitHub
          echo "│ ── githubstatus.com"
          curl -sS -m 15 https://www.githubstatus.com/api/v2/status.json \
            | python3 -c 'import json,sys;d=json.load(sys.stdin)["status"];print("│   "+d["indicator"]+" - "+d["description"])' 2>&1
          curl -sS -m 15 https://www.githubstatus.com/api/v2/incidents/unresolved.json \
            | python3 -c 'import json,sys;[print("│   INCIDENT: "+i["name"]+" ("+i["status"]+")") for i in json.load(sys.stdin)["incidents"]]' 2>&1

          # 5) Trace de git de l'intent
          echo "│ ── Últimes línies del trace de git"
          tail -n 40 /tmp/clone_$1.log | sed 's/^/│   /'
          echo "└────────────────────────────────────────────────────"
        }

        AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
        echo "::add-mask::$AUTH"

        OK=0
        for i in 1 2 3 4 5 6; do
          echo "--- clonant private-scripts: intent $i/6 ($(date -u +%H:%M:%S) UTC) ---"
          rm -rf private-scripts-new
          GIT_TRACE=1 GIT_CURL_VERBOSE=1 git -c http.version=HTTP/1.1 \
            -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --depth 1 https://github.com/Tempestesscatt/Scripts.git private-scripts-new \
            > /tmp/clone_$i.log 2>&1
          RC=$?
          if [ $RC -eq 0 ] && [ -d private-scripts-new/.git ]; then
            echo "✅ Clonat a l'intent $i"
            OK=1
            break
          fi
          echo "❌ git clone ha fallat (codi $RC)"
          grep -E '^(fatal|error|warning)' /tmp/clone_$i.log | sed 's/^/   /'
          diag "$i"
          [ "$i" = 6 ] && break
          sleep $((i * 20))
        done

        if [ "$OK" != 1 ]; then
          echo "::error title=No s'ha pogut clonar private-scripts::Mira el bloc DIAGNÒSTIC de l'últim intent (HTTP 401/403/404/5xx, rate limit i estat de GitHub)."
          exit 1
        fi

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # ── 1) Web = estàtics de main + carpetes dinàmiques de la branca 'data' ──
    - name: Assemblar web (estàtics + branca data)
      id: assemble
      timeout-minutes: 20
      run: |
        set -euo pipefail
        P="$GITHUB_WORKSPACE/meu-mapa/public"
        REMOTE_URL="https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/joctempestes.git"

        # Estat actual de 'data'. Si GitHub no respon ABORTEM: continuar sense
        # 'data' esborraria del web les carpetes dels altres workflows.
        OK=0
        for i in 1 2 3 4 5; do
          if OUT=$(git ls-remote "$REMOTE_URL" refs/heads/data); then OK=1; break; fi
          sleep 10
        done
        [ "$OK" = 1 ] || { echo "No puc contactar amb GitHub (ls-remote)"; exit 1; }
        DATA_SHA=$(echo "$OUT" | cut -f1)
        [ -n "$DATA_SHA" ] || { echo "La branca 'data' no existeix: res a regenerar"; exit 1; }

        # Estàtics protegits (tot el que NO és dinàmic)
        rm -rf /tmp/estatic-base
        mkdir -p /tmp/estatic-base
        if [ -d "$P" ]; then
          cp -r "$P"/. /tmp/estatic-base/
          for c in $CARPETES; do rm -rf "/tmp/estatic-base/$c"; done
          rm -f /tmp/estatic-base/js/status.js
        fi

        rm -rf /tmp/data-branch "$P"
        mkdir -p "$P/js"
        for c in $CARPETES; do mkdir -p "$P/$c"; done
        cp -r /tmp/estatic-base/. "$P/"

        OK=0
        for i in 1 2 3 4 5; do
          if git fetch --depth=1 origin data; then OK=1; break; fi
          sleep 10
        done
        [ "$OK" = 1 ] || { echo "No puc baixar la branca data"; exit 1; }
        git worktree prune
        git worktree add -f /tmp/data-branch FETCH_HEAD
        for c in $CARPETES; do
          cp -r /tmp/data-branch/$c/. "$P/$c/" 2>/dev/null || echo "  $c no trobat a data"
        done
        cp /tmp/data-branch/js/status.js "$P/js/status.js" 2>/dev/null || true

        # Guardem les notícies abans de treure el worktree (per injectar-les després)
        rm -rf /tmp/news-data
        if [ -d /tmp/data-branch/news/noticies ]; then
          cp -r /tmp/data-branch/news/noticies /tmp/news-data
        fi
        git worktree remove /tmp/data-branch --force

        IM="$P/web_data_NE/imatges"
        [ -d "$IM" ] || { echo "Falta web_data_NE/imatges a 'data'"; exit 1; }
        echo "--- Resum ---"
        for c in $CARPETES; do echo "$c: $(find "$P/$c" -type f | wc -l) fitxers"; done
        echo "imatges sfc: $(find "$IM" -name 'sfc_*.png' | wc -l) PNG"
        echo "imatges 3d:  $(find "$IM" -name '3d_*.png' | wc -l) PNG"
        echo "derivats:    $(find "$P/web_data_derivats" -name '3d_*.png' | wc -l) PNG"

    # Sense aquest pas el deploy deixaria la web sense notícies
    - name: Injectar notícies
      run: |
        set -euo pipefail
        P="$GITHUB_WORKSPACE/meu-mapa/public"

        if [ ! -f /tmp/news-data/noticies.html ]; then
          echo "⚠️  No hi ha notícies a data/news/noticies: es desplega sense notícies."
          exit 0
        fi

        rm -rf "$P/noticies"; mkdir -p "$P/noticies"
        cp -r /tmp/news-data/. "$P/noticies/"

        P="$P" python3 - <<'PYEOF'
        import os, re
        p = os.environ["P"]
        frag = open("/tmp/news-data/noticies.html", encoding="utf-8").read()
        idx_path = os.path.join(p, "index.html")
        idx = open(idx_path, encoding="utf-8").read()
        patro = r'<div id="noticiesContingut">.*?</div>\s*</div>\s*</section>'
        nou, n = re.subn(
            patro,
            lambda m: '<div id="noticiesContingut">\n' + frag + '\n</div>\n  </div>\n</section>',
            idx, count=1, flags=re.DOTALL,
        )
        if n:
            open(idx_path, "w", encoding="utf-8").write(nou)
            print("✅ Notícies injectades a index.html")
        else:
            print("⚠️  Patró '<div id=noticiesContingut>' no trobat a index.html: es desplega sense notícies")
        PYEOF

    # ── 2) Regenerar només el manifest sobre els fitxers que ja hi ha ──
    - name: Regenerar manifest.json
      id: manifest
      timeout-minutes: 15
      run: |
        set -euo pipefail
        export IMATGES_DIR="$GITHUB_WORKSPACE/meu-mapa/public/web_data_NE/imatges"
        [ -f "$IMATGES_DIR/manifest.json" ] || { echo "No hi ha manifest anterior (cal extent/aspect/variables)"; exit 1; }
        cd private-scripts-new

        # Si l'script ja llegeix IMATGES_DIR de l'entorn no cal tocar-lo
        if ! grep -q 'os.environ\["IMATGES_DIR"\]' generar_manifestpngs.py; then
          sed -i -E 's|^IMATGES_DIR = .*|IMATGES_DIR = Path(os.environ["IMATGES_DIR"])|' generar_manifestpngs.py
          grep -q 'os.environ\["IMATGES_DIR"\]' generar_manifestpngs.py || { echo "No s'ha pogut canviar IMATGES_DIR"; exit 1; }
        fi
        python3 generar_manifestpngs.py

        python3 - <<'PY'
        import json, os
        m = json.load(open(os.path.join(os.environ["IMATGES_DIR"], "manifest.json"), encoding="utf-8"))
        print("versio:", m.get("versio"), "| SFC:", m.get("total_hores"), "hores | 3D:", m.get("total_hores_3d"),
              "hores | extent:", bool(m.get("extent")))
        if not m.get("total_hores") or not m.get("total_hores_3d") or not m.get("extent") or not m.get("aspect"):
            raise SystemExit("Manifest incomplet: no es publicara")
        PY

    - name: Comprovar límits de Cloudflare Pages
      run: |
        P="$GITHUB_WORKSPACE/meu-mapa/public"
        # Pages: màx. 25 MiB per fitxer i 20.000 fitxers per deploy
        find "$P" -type f -size +25M -print -delete || true
        N=$(find "$P" -type f | wc -l)
        echo "Total fitxers: $N (límit Pages: 20000)"
        if [ "$N" -gt 19000 ]; then
          echo "Massa fitxers: elimino les isolínies dels derivats (opcionals)"
          find "$P/web_data_derivats/imatges" -maxdepth 1 -name 'isolines_3d_*' -delete 2>/dev/null || true
          N=$(find "$P" -type f | wc -l)
          echo "Total fitxers ara: $N"
        fi
        if [ "$N" -gt 19000 ]; then
          echo "Encara massa fitxers: elimino les isolínies 3D (opcionals)"
          find "$P/web_data_NE/imatges" -maxdepth 1 -name 'isolines_3d_*' -delete || true
          N=$(find "$P" -type f | wc -l)
          echo "Total fitxers ara: $N"
        fi
        [ "$N" -le 19900 ] || { echo "Encara massa fitxers per a Cloudflare Pages"; exit 1; }

    # ── 3) Deploy a Cloudflare ──
    - name: Deploy a Cloudflare
      id: deploy
      timeout-minutes: 80
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        WRANGLER_SEND_METRICS: "false"
      run: |
        cd meu-mapa
        for i in 1 2 3; do
          npm install -g wrangler && break
          sleep 10
        done
        for i in 1 2 3; do
          echo "--- deploy intent $i/3 ($(date -u +%H:%M:%S) UTC) ---"
          if timeout 25m wrangler pages deploy public --project-name=tempestes-cat --branch=main --commit-dirty=true; then
            echo "Deploy OK"
            exit 0
          fi
          sleep 20
        done
        echo "El deploy a Cloudflare ha fallat 3 vegades"
        exit 1

    # ── 4) Guardar a 'data' NOMÉS el manifest.json (un sol fitxer, un commit petit) ──
    # No es toca res més de la branca: ni PNG, ni derivats, ni les carpetes d'altres workflows.
    - name: Guardar manifest a la branca 'data'
      if: always() && steps.manifest.outcome == 'success'
      timeout-minutes: 15
      run: |
        set -uo pipefail
        P="$GITHUB_WORKSPACE/meu-mapa/public"
        REMOTE_URL="https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/joctempestes.git"
        MSG="manifest $(date -u +'%Y-%m-%d %H:%M UTC')"
        git config --global user.name "bot-dades"
        git config --global user.email "bot@tempestes-cat"
        git config --global http.version HTTP/1.1

        for i in 1 2 3 4 5; do
          echo "=== Guardar manifest (intent $i/5) ==="
          git worktree prune
          rm -rf /tmp/data-w
          if ! git fetch --depth=1 "$REMOTE_URL" data; then sleep $((i * 10)); continue; fi
          if ! git worktree add -f /tmp/data-w FETCH_HEAD; then sleep 5; continue; fi
          mkdir -p /tmp/data-w/web_data_NE/imatges
          cp "$P/web_data_NE/imatges/manifest.json" /tmp/data-w/web_data_NE/imatges/manifest.json
          git -C /tmp/data-w add web_data_NE/imatges/manifest.json
          if git -C /tmp/data-w diff --cached --quiet; then
            echo "El manifest ja és igual a 'data': res a pujar"
            git worktree remove /tmp/data-w --force || true
            exit 0
          fi
          git -C /tmp/data-w commit -q -m "$MSG"
          # Push normal (sense force): si algú ha tocat 'data', falla i es torna a començar
          if timeout 300 git -C /tmp/data-w push "$REMOTE_URL" HEAD:refs/heads/data; then
            echo "Manifest publicat a 'data'"
            git worktree remove /tmp/data-w --force || true
            exit 0
          fi
          echo "Push fallit (intent $i/5)"
          git worktree remove /tmp/data-w --force || true
          sleep $((i * 10))
        done
        echo "No s'ha pogut guardar el manifest a 'data' (la web SÍ s'ha desplegat a Cloudflare)"
        exit 1

    - name: Completat
      run: echo "Manifest + deploy completat $(date -u)"

    # ── Resum final: diu exactament quin pas ha fallat i què fer ──
    - name: Resum de l'execució
      if: always()
      run: |
        echo "## Resultat per pas" >> "$GITHUB_STEP_SUMMARY"
        echo "- Assemblar web: \`${{ steps.assemble.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- Regenerar manifest: \`${{ steps.manifest.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- Deploy Cloudflare: \`${{ steps.deploy.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "Si el clonat de private-scripts ha fallat, busca el bloc DIAGNÒSTIC al log del pas 'Clonar private-scripts (amb diagnòstic)'." >> "$GITHUB_STEP_SUMMARY"