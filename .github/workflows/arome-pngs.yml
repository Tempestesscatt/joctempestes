name: AROME PNG (SFC + 3D)

on:
  workflow_dispatch:
  schedule:
    - cron: '50 0,3,6,9,12,15,18,21 * * *'

permissions:
  contents: write
  deployments: write

# Mateix grup que els altres workflows: s'encuen i no es trepitgen
concurrency:
  group: deploy-data
  cancel-in-progress: false

jobs:
  # ════════════════════════════════════════════════════════════════
  #  GATE
  # ════════════════════════════════════════════════════════════════
  check_schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
    - name: Gate
      id: gate
      run: |
        USE_INTERNAL_SCHEDULE=false
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "should_run=true" >> "$GITHUB_OUTPUT"
        elif [ "$USE_INTERNAL_SCHEDULE" = "true" ]; then
          echo "should_run=true" >> "$GITHUB_OUTPUT"
        else
          echo "Schedule intern DESACTIVAT"
          echo "should_run=false" >> "$GITHUB_OUTPUT"
        fi

  # ════════════════════════════════════════════════════════════════
  #  JOB 1 (paral·lel): SFC -> PNG
  # ════════════════════════════════════════════════════════════════
  png_sfc:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: check_schedule
    if: needs.check_schedule.outputs.should_run == 'true'
    env:
      IMATGES_DIR: ${{ github.workspace }}/out-sfc/imatges
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests tifffile scipy xarray cfgrib eccodes meteofetch matplotlib pillow shapely pyproj cartopy

    - name: Preparar l'script (ruta de sortida i clau)
      run: |
        mkdir -p "$IMATGES_DIR"
        cd private-scripts-new
        sed -i -E 's|^IMATGES_DIR = .*|IMATGES_DIR = Path(os.environ["IMATGES_DIR"])|' arome_sfc_png.py
        grep -q 'os.environ\["IMATGES_DIR"\]' arome_sfc_png.py || { echo "No s'ha pogut canviar IMATGES_DIR"; exit 1; }
        python3 -c 'import json; cfg = json.load(open("configNE.json", "r", encoding="utf-8-sig")); cfg["api_key"] = "${{ secrets.AROME_API_KEY }}"; json.dump(cfg, open("configNE.json", "w", encoding="utf-8"), indent=2)'

    - name: Executar arome_sfc_png.py
      run: |
        cd private-scripts-new
        for i in 1 2 3; do
          echo "--- arome_sfc_png.py: intent $i/3 ---"
          python3 arome_sfc_png.py
          CODI=$?
          N=$(find "$IMATGES_DIR" -name "sfc_*.png" -type f | wc -l)
          # Bo si surt net, o si peta (134) en tancar pero les dades ja hi son
          if [ $CODI -eq 0 ] || { [ $CODI -eq 134 ] && [ "$N" -ge 5 ] && [ -f "$IMATGES_DIR/manifest.json" ]; }; then
            echo "OK a l'intent $i (codi $CODI, $N PNG)"
            exit 0
          fi
          echo "ERROR (codi $CODI) a l'intent $i/3"
          sleep 30
        done
        echo "ERROR: els 3 intents han fallat."
        exit 1
      timeout-minutes: 170

    - name: Verificar fitxers generats
      run: |
        N=$(find "$IMATGES_DIR" -name "sfc_*.png" -type f | wc -l)
        echo "PNG sfc: $N"
        [ "$N" -lt 5 ] && { echo "Massa pocs PNG"; exit 1; }
        [ -f "$IMATGES_DIR/manifest.json" ] || { echo "Falta manifest.json"; exit 1; }
        [ -f "$IMATGES_DIR/fons.png" ] || { echo "Falta fons.png"; exit 1; }
        echo "OK"

    - name: Pujar SFC com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: png-sfc
        path: out-sfc/imatges/
        retention-days: 5
        if-no-files-found: error

  # ════════════════════════════════════════════════════════════════
  #  JOB 2 (paral·lel): 3D -> PNG
  # ════════════════════════════════════════════════════════════════
  png_3d:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: check_schedule
    if: needs.check_schedule.outputs.should_run == 'true'
    env:
      IMATGES_DIR: ${{ github.workspace }}/out-3d/imatges
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests scipy xarray cfgrib eccodes meteofetch matplotlib pillow msgpack

    - name: Preparar l'script (ruta de sortida i clau)
      run: |
        mkdir -p "$IMATGES_DIR"
        cd private-scripts-new
        sed -i -E 's|^IMATGES_DIR = .*|IMATGES_DIR = Path(os.environ["IMATGES_DIR"])|' arome_3dpng.py
        grep -q 'os.environ\["IMATGES_DIR"\]' arome_3dpng.py || { echo "No s'ha pogut canviar IMATGES_DIR"; exit 1; }
        python3 -c 'import json; cfg = json.load(open("configNE.json", "r", encoding="utf-8-sig")); cfg["api_key"] = "${{ secrets.AROME_API_KEY }}"; json.dump(cfg, open("configNE.json", "w", encoding="utf-8"), indent=2)'

    - name: Executar arome_3dpng.py
      run: |
        cd private-scripts-new
        for i in 1 2 3; do
          echo "--- arome_3dpng.py: intent $i/3 ---"
          python3 arome_3dpng.py
          CODI=$?
          N=$(find "$IMATGES_DIR" -name "3d_*.png" -type f | wc -l)
          if [ $CODI -eq 0 ] || { [ $CODI -eq 134 ] && [ "$N" -ge 5 ]; }; then
            echo "OK a l'intent $i (codi $CODI, $N PNG)"
            exit 0
          fi
          echo "ERROR (codi $CODI) a l'intent $i/3"
          sleep 30
        done
        echo "ERROR: els 3 intents han fallat."
        exit 1
      timeout-minutes: 170

    - name: Verificar fitxers generats
      run: |
        N=$(find "$IMATGES_DIR" -name "3d_*.png" -type f | wc -l)
        S=$(find "$IMATGES_DIR" -name "sondeig_*.msgpack.gz" -type f | wc -l)
        echo "PNG 3d: $N | sondeigs: $S"
        [ "$N" -lt 5 ] && { echo "Massa pocs PNG"; exit 1; }
        echo "OK"

    - name: Pujar 3D com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: png-3d
        path: out-3d/imatges/
        retention-days: 5
        if-no-files-found: error

  # ════════════════════════════════════════════════════════════════
  #  JOB 3: MANIFEST (quan SFC i 3D han acabat bé)
  # ════════════════════════════════════════════════════════════════
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: [check_schedule, png_sfc, png_3d]
    if: >-
      always() &&
      needs.check_schedule.outputs.should_run == 'true' &&
      needs.png_sfc.result == 'success' &&
      needs.png_3d.result == 'success'
    env:
      IMATGES_DIR: ${{ github.workspace }}/merged/imatges
    steps:
    - name: Clonar private-scripts
      run: |
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Descarregar SFC
      uses: actions/download-artifact@v4
      with:
        name: png-sfc
        path: merged/imatges

    - name: Descarregar 3D
      uses: actions/download-artifact@v4
      with:
        name: png-3d
        path: merged/imatges

    - name: Executar generar_manifestpngs.py
      run: |
        cd private-scripts-new
        sed -i -E 's|^IMATGES_DIR = .*|IMATGES_DIR = Path(os.environ["IMATGES_DIR"])|' generar_manifestpngs.py
        grep -q 'os.environ\["IMATGES_DIR"\]' generar_manifestpngs.py || { echo "No s'ha pogut canviar IMATGES_DIR"; exit 1; }
        python3 generar_manifestpngs.py
      timeout-minutes: 170

    - name: Resum del manifest
      run: |
        python3 - <<'PY'
        import json, os
        m = json.load(open(os.path.join(os.environ["IMATGES_DIR"], "manifest.json"), encoding="utf-8"))
        print("SFC:", m.get("total_hores"), "hores | 3D:", m.get("total_hores_3d"),
              "hores | extent:", bool(m.get("extent")))
        PY

    - name: Pujar manifest com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: png-manifest
        path: merged/imatges/manifest.json
        retention-days: 5
        if-no-files-found: error

  # ════════════════════════════════════════════════════════════════
  #  JOB 4: DEPLOY (relectura fresca de 'data' + reintents + estàtics protegits)
  #  Només toca web_data_NE/imatges.
  # ════════════════════════════════════════════════════════════════
  deploy:
    needs: [check_schedule, png_sfc, png_3d, manifest]
    if: >-
      always() &&
      needs.check_schedule.outputs.should_run == 'true' &&
      (needs.png_sfc.result == 'success' || needs.png_3d.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}
        fetch-depth: 0

    - name: Resultat dels jobs anteriors
      run: |
        echo "sfc:      ${{ needs.png_sfc.result }}"
        echo "3d:       ${{ needs.png_3d.result }}"
        echo "manifest: ${{ needs.manifest.result }}"

    - name: Descarregar artifact - SFC
      if: needs.png_sfc.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: png-sfc
        path: /tmp/nou-sfc
      continue-on-error: true

    - name: Descarregar artifact - 3D
      if: needs.png_3d.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: png-3d
        path: /tmp/nou-3d
      continue-on-error: true

    - name: Descarregar artifact - MANIFEST
      if: needs.manifest.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: png-manifest
        path: /tmp/nou-manifest
      continue-on-error: true

    - name: Fusionar i publicar a 'data' (reintents anti-cursa + estàtics protegits)
      run: |
        P="$GITHUB_WORKSPACE/meu-mapa/public"
        CARPETES="web_data_NE webdata_waves avis gfsmaps gfsESPmaps previsions_catalunya"
        MAX_INTENTS=5
        INTENT=1
        PUBLICAT=0
        REMOTE_URL="https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/joctempestes.git"

        # Fitxers del 3D (la resta de web_data_NE/imatges es SFC)
        PAT3D=( -name '3d_*' -o -name 'isolines_3d_*' -o -name 'legend_3d_*' -o -name 'sondeig_*' -o -name 'vent3d_*' )

        while [ $INTENT -le $MAX_INTENTS ]; do
          echo "=== Intent $INTENT/$MAX_INTENTS ==="

          # 1) Llegim 'data' EN FRESC
          cd "$GITHUB_WORKSPACE"
          DATA_SHA_ABANS=$(git ls-remote "$REMOTE_URL" refs/heads/data | cut -f1)
          [ -z "$DATA_SHA_ABANS" ] && DATA_SHA_ABANS="none"

          # Proteccio estatics
          rm -rf /tmp/estatic-base
          mkdir -p /tmp/estatic-base
          if [ -d "$P" ]; then
            cp -r "$P"/. /tmp/estatic-base/
            for c in $CARPETES; do rm -rf "/tmp/estatic-base/$c"; done
            rm -f /tmp/estatic-base/js/status.js
          fi
          echo "--- Estatics protegits ---"
          find /tmp/estatic-base -maxdepth 1

          rm -rf /tmp/data-branch "$P"
          mkdir -p "$P/js"
          for c in $CARPETES; do mkdir -p "$P/$c"; done
          cp -r /tmp/estatic-base/. "$P/"

          if [ "$DATA_SHA_ABANS" != "none" ]; then
            git fetch origin data
            git worktree prune
            git worktree add -f /tmp/data-branch FETCH_HEAD
            for c in $CARPETES; do
              cp -r /tmp/data-branch/$c/. "$P/$c/" 2>/dev/null || echo "  $c no trobat a data"
            done
            cp /tmp/data-branch/js/status.js "$P/js/status.js" 2>/dev/null || true
            git worktree remove /tmp/data-branch --force
          else
            echo "La branca 'data' encara no existeix, es creara"
          fi

          # 2) Sobreescrivim NOMES web_data_NE/imatges
          IM="$P/web_data_NE/imatges"
          mkdir -p "$IM"

          if [ -d /tmp/nou-sfc ] && [ -n "$(ls -A /tmp/nou-sfc 2>/dev/null)" ]; then
            find "$IM" -maxdepth 1 -type f ! \( "${PAT3D[@]}" \) -delete
            cp -r /tmp/nou-sfc/. "$IM/"
            echo "  imatges: SFC substituit"
          fi
          if [ -d /tmp/nou-3d ] && [ -n "$(ls -A /tmp/nou-3d 2>/dev/null)" ]; then
            find "$IM" -maxdepth 1 -type f \( "${PAT3D[@]}" \) -delete
            cp -r /tmp/nou-3d/. "$IM/"
            echo "  imatges: 3D substituit"
          fi

          # 2b) Manifest final (SFC + 3D), per sobre de tot
          if [ -f /tmp/nou-manifest/manifest.json ]; then
            cp /tmp/nou-manifest/manifest.json "$IM/manifest.json"
            echo "  imatges: manifest.json (SFC + 3D) aplicat"
          else
            echo "  AVIS: sense manifest nou; es queda el que hi hagi"
          fi

          echo "--- Resum abans de publicar ---"
          for c in $CARPETES; do
            echo "$c: $(find $P/$c -type f 2>/dev/null | wc -l) fitxers"
          done
          echo "imatges sfc: $(find $IM -name 'sfc_*.png' 2>/dev/null | wc -l) PNG"
          echo "imatges 3d:  $(find $IM -name '3d_*.png' 2>/dev/null | wc -l) PNG"
          if [ -f "$P/selector.html" ]; then echo "selector.html present?: SI"; else echo "selector.html present?: NO"; fi

          # 3) Preparem el commit per a 'data'
          rm -rf /tmp/publish && mkdir -p /tmp/publish
          cp -r "$P/." /tmp/publish/
          cd /tmp/publish
          rm -rf .git
          git init -q
          git checkout -q -b data

          AFEGIT=0
          for c in $CARPETES; do
            if [ -n "$(find "$c" -type f 2>/dev/null)" ]; then
              git add "$c"; AFEGIT=1
            else
              echo "  $c buida, s'omet"
            fi
          done
          if [ -f js/status.js ]; then git add js/status.js; AFEGIT=1; fi

          if [ "$AFEGIT" != "1" ]; then
            echo "Res a publicar"; break
          fi

          git -c user.name="bot-dades" -c user.email="bot@tempestes-cat" \
              commit -q -m "arome png $(date -u +'%Y-%m-%d %H:%M UTC')"
          git remote add origin "$REMOTE_URL"

          # 4) Comprovem que 'data' no ha canviat
          DATA_SHA_ARA=$(git ls-remote origin refs/heads/data | cut -f1)
          [ -z "$DATA_SHA_ARA" ] && DATA_SHA_ARA="none"

          if [ "$DATA_SHA_ABANS" != "$DATA_SHA_ARA" ]; then
            echo "'data' ha canviat (un altre workflow ha publicat). Reintentem..."
            INTENT=$((INTENT + 1))
            sleep $((RANDOM % 10 + 5))
            continue
          fi

          if git push --force origin data; then
            echo "Publicat a 'data' (intent $INTENT)"
            PUBLICAT=1
            break
          else
            echo "Push fallit. Reintentem..."
            INTENT=$((INTENT + 1))
            sleep $((RANDOM % 10 + 5))
          fi
        done

        cd "$GITHUB_WORKSPACE"
        if [ "$PUBLICAT" != "1" ]; then
          echo "No s'ha pogut publicar a 'data' despres de $MAX_INTENTS intents"
          exit 1
        fi
      timeout-minutes: 170

    - name: Comprovar mida de fitxers (limit 25 MiB de Cloudflare Pages)
      run: |
        find meu-mapa/public -type f -size +25M -exec ls -lh {} \; || true
        echo "Total fitxers: $(find meu-mapa/public -type f | wc -l)  (limit Pages: 20000)"

    - name: Deploy a Cloudflare
      run: |
        cd meu-mapa
        npm install -g wrangler
        wrangler pages deploy public --project-name=tempestes-cat --branch=main --commit-dirty=true
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      timeout-minutes: 170

    - name: Completat
      run: echo "Deploy completat $(date -u)"