name: Actualitzar Notícies Meteorològiques

on:
  schedule:
    # S'executa cada 10 hores (a les 00:00, 10:00 i 20:00 UTC)
    - cron: '0 0,10,20 * * *'
  workflow_dispatch: # Et permet executar-ho manualment des de la pestanya "Actions" de GitHub

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessari per fer "push" del nou fitxer JSON al repositori

    steps:
      - name: Checkout del codi
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instal·lar dependències
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Executar l'script de notícies
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python noticias.py

      - name: Guardar i pujar el JSON actualitzat
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add public/noticies/resum_cataluna.json
          # Si hi ha canvis, fa el commit i el push
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Notícies actualitzades automàticament [skip ci]" && git push)