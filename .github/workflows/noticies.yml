name: Actualitzar Notícies Meteorològiques

on:
  schedule:
    # S'executa cada 5 hores (UTC): 00:00, 05:00, 10:00, 15:00 i 20:00
    # (cron no pot fer "cada 5 h" exactes: entre les 20:00 i les 00:00 hi ha 4 h)
    - cron: '0 */5 * * *'
  workflow_dispatch: # Permet executar-ho a mà des de GitHub

permissions:
  contents: write

# Grup COMPARTIT amb "Deploy Manual": els dos s'executen un després de l'altre,
# així mai es trepitgen (ni al push a 'data' ni al deploy a Cloudflare).
# No espera els deploys d'aromeNE/enssables/manifest.
# cancel-in-progress: false perquè Cloudflare Pages no accepta bé deploys tallats a mitges.
concurrency:
  group: deploy-news-${{ github.ref }}
  cancel-in-progress: false

env:
  # Carpetes dinàmiques de la web (viuen a la branca 'data').
  # Han de ser les mateixes que a deploy-onnly.yml, aromeNE.yml i deploy-manual.yml.
  CARPETES: "web_data_NE webdata_waves avis gfsmaps gfsESPmaps previsions_catalunya web_data_GFS"

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    # 1. Descarregar el codi de la web de la branca main
    - name: Descarregar codi de main
      uses: actions/checkout@v4
      with:
        ref: main
        path: repo-principal

    # 2. Descarregar els scripts de Python (on viu el noticias.py)
    - name: Clonar private-scripts
      run: |
        for i in 1 2 3 4; do
          rm -rf private-scripts-new
          if git clone --depth 1 "https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git" private-scripts-new; then break; fi
          [ "$i" = 4 ] && { echo "Error clonant"; exit 1; }
          sleep 15
        done

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Llibreria binària d'ecCodes (per llegir els GRIB2 de GFS)
    - name: Instal·lar llibreria ecCodes
      run: |
        sudo apt-get update
        sudo apt-get install -y libeccodes-dev

    - name: Instal·lar dependències
      run: |
        python -m pip install --upgrade pip
        pip install requests pytz numpy eccodes
        python -c "import numpy, eccodes, pytz, requests; print('✅ Dependències OK, eccodes', eccodes.__version__)"

    # 3. Copiem la plantilla de l'index.html (de main) a la carpeta de treball del Python
    - name: Preparar entorn
      run: |
        cp repo-principal/meu-mapa/public/index.html private-scripts-new/index_plantilla.html
        cd private-scripts-new
        mkdir -p public/noticies

    # 4. Executem el Python injectant la clau de Gemini
    - name: Executar Python
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        cd private-scripts-new
        python -u noticias.py

    # 5. Sobreescrivim l'index.html de la web amb el que ha generat el Python
    #    i copiem també la carpeta noticies (noticies.html + resum_cataluna.json)
    - name: Actualitzar index.html i noticies
      run: |
        set -euo pipefail
        P="$GITHUB_WORKSPACE/repo-principal/meu-mapa/public"
        cp private-scripts-new/public/index.html "$P/index.html"
        rm -rf "$P/noticies"; mkdir -p "$P/noticies"
        cp -r private-scripts-new/public/noticies/. "$P/noticies/"

    # 6. Guardem el RESULTAT de les notícies a la branca 'data' (data/news/noticies/).
    #    Així Deploy Manual i la resta de workflows poden reinjectar-les i no les esborren.
    #    Si falla, el deploy d'aquest run continua (només es perdrien per als altres deploys).
    - name: Guardar notícies a la branca data
      continue-on-error: true
      run: |
        set -euo pipefail
        NEWS_SRC="$GITHUB_WORKSPACE/private-scripts-new/public/noticies"
        [ -f "$NEWS_SRC/noticies.html" ] || { echo "⚠️  noticies.html no existeix, no es guarda res"; exit 1; }

        cd "$GITHUB_WORKSPACE/repo-principal"
        git config user.name "github-actions"
        git config user.email "actions@github.com"

        for i in 1 2 3 4 5; do
          cd "$GITHUB_WORKSPACE/repo-principal"
          rm -rf /tmp/data-push
          git worktree prune
          git fetch --depth=1 origin data
          git worktree add -f /tmp/data-push FETCH_HEAD

          cd /tmp/data-push
          rm -rf news/noticies
          mkdir -p news/noticies
          cp -r "$NEWS_SRC/." news/noticies/
          git add -A news

          if git diff --cached --quiet; then
            echo "Sense canvis a les notícies"; exit 0
          fi
          git commit -m "Notícies actualitzades"

          if git push origin HEAD:data; then
            echo "✅ Notícies guardades a data/news/noticies"; exit 0
          fi
          echo "Push rebutjat (algú ha tocat 'data'), reintent $i/5..."
          sleep $((i * 5))
        done
        echo "❌ No s'ha pogut guardar a data"; exit 1

    # 7. IMPORTANT: Cloudflare Pages substitueix TOT el desplegament anterior.
    #    Les dades del visor (web_data_NE, gfsmaps...) viuen a la branca 'data'.
    - name: Afegir dades de la branca 'data'
      run: |
        set -euo pipefail
        cd repo-principal
        P="$GITHUB_WORKSPACE/repo-principal/meu-mapa/public"
        mkdir -p "$P/js"

        # Si GitHub no respon, ABORTEM: no volem desplegar una web incompleta
        OK=0
        for i in 1 2 3 4 5; do
          if git fetch --depth=1 origin data; then OK=1; break; fi
          sleep 10
        done
        [ "$OK" = 1 ] || { echo "❌ No puc baixar la branca data"; exit 1; }

        git worktree prune
        rm -rf /tmp/data-branch
        git worktree add -f /tmp/data-branch FETCH_HEAD

        for c in $CARPETES; do
          if [ -d "/tmp/data-branch/$c" ]; then
            rm -rf "$P/$c"; mkdir -p "$P/$c"
            cp -r "/tmp/data-branch/$c/." "$P/$c/"
          else
            echo "⚠️  $c no trobat a data (s'ignora)"
          fi
        done
        cp /tmp/data-branch/js/status.js "$P/js/status.js" 2>/dev/null || echo "⚠️  status.js no trobat a data"

        git worktree remove /tmp/data-branch --force

        # Seguretat: sense dades del visor NO es desplega mai
        if [ -z "$(ls -A "$P/web_data_NE/imatges" 2>/dev/null)" ]; then
          echo "❌ web_data_NE/imatges és buit: no desplego per no deixar el visor sense dades"
          exit 1
        fi
        echo "✅ Dades afegides: web_data_NE té $(find "$P/web_data_NE" -type f | wc -l) fitxers"

    - name: Comprovar límits de Cloudflare Pages
      run: |
        P="$GITHUB_WORKSPACE/repo-principal/meu-mapa/public"
        # Pages: màx. 25 MiB per fitxer i 20.000 fitxers per deploy
        find "$P" -type f -size +25M -print -delete || true
        N=$(find "$P" -type f | wc -l)
        echo "Total fitxers: $N (límit Pages: 20000)"
        if [ "$N" -gt 19000 ]; then
          echo "Massa fitxers: elimino isolínies opcionals (3D i GFS)"
          find "$P/web_data_NE/imatges" -maxdepth 1 -name 'isolines_3d_*' -delete 2>/dev/null || true
          find "$P/web_data_GFS/imatges" -maxdepth 1 -name 'isolines_*' -delete 2>/dev/null || true
          N=$(find "$P" -type f | wc -l)
          echo "Total fitxers ara: $N"
        fi
        [ "$N" -le 19900 ] || { echo "❌ Encara massa fitxers per a Cloudflare Pages"; exit 1; }

    # 8. Pugem els canvis a Cloudflare
    - name: Deploy a Cloudflare
      timeout-minutes: 70
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        WRANGLER_SEND_METRICS: "false"
      run: |
        cd repo-principal/meu-mapa
        for i in 1 2 3; do npm install -g wrangler && break; sleep 10; done
        for i in 1 2 3; do
          echo "--- deploy intent $i/3 ($(date -u +%H:%M:%S) UTC) ---"
          if timeout 25m wrangler pages deploy public --project-name=tempestes-cat --branch=main --commit-dirty=true; then
            echo "✅ Deploy OK"; exit 0
          fi
          sleep 20
        done
        echo "❌ El deploy ha fallat 3 vegades"; exit 1