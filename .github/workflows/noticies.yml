name: Actualitzar Notícies Meteorològiques

on:
  schedule:
    # S'executa cada 10 hores (a les 00:00, 10:00 i 20:00 UTC)
    - cron: '0 0,10,20 * * *'
  workflow_dispatch: # Permet executar-ho a mà des de GitHub

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    # 1. Descarregar el codi de la web de la branca main
    - name: Descarregar codi de main
      uses: actions/checkout@v4
      with:
        ref: main
        path: repo-principal

    # 2. Descarregar els scripts de Python (on viu el noticias.py)
    - name: Clonar private-scripts
      run: |
        for i in 1 2 3 4; do
          rm -rf private-scripts-new
          if git clone --depth 1 "https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git" private-scripts-new; then break; fi
          [ "$i" = 4 ] && { echo "Error clonant"; exit 1; }
          sleep 15
        done

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependències
      run: |
        python -m pip install --upgrade pip
        pip install requests pytz

    # 3. Copiem la plantilla de l'index.html a la carpeta de treball del Python
    # perquè el Python pugui llegir-lo i modificar-lo
    - name: Preparar entorn
      run: |
        cp repo-principal/meu-mapa/public/index.html private-scripts-new/index_plantilla.html
        cd private-scripts-new
        mkdir -p public/noticies

    # 4. Executem el Python injectant la clau de Gemini
    - name: Executar Python
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        cd private-scripts-new
        python noticias.py

    # 5. Sobreescrivim l'index.html de la web amb el que ha generat el Python (ja amb les notícies a dins)
    - name: Actualitzar index.html
      run: |
        cp private-scripts-new/public/index.html repo-principal/meu-mapa/public/index.html

    # 6. Pugem els canvis a Cloudflare
    - name: Deploy a Cloudflare
      timeout-minutes: 10
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        cd repo-principal/meu-mapa
        npm install -g wrangler
        wrangler pages deploy public --project-name=tempestes-cat --branch=main