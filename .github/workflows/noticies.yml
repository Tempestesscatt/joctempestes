name: Actualitzar Notícies Meteorològiques

on:
  schedule:
    # S'executa cada 10 hores (a les 00:00, 10:00 i 20:00 UTC)
    - cron: '0 0,10,20 * * *'
  workflow_dispatch: # Permet executar-ho a mà des de GitHub

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Clonar private-scripts
      run: |
        for i in 1 2 3 4; do
          rm -rf private-scripts-new
          if git clone --depth 1 "https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git" private-scripts-new; then break; fi
          [ "$i" = 4 ] && { echo "No s'ha pogut clonar private-scripts"; exit 1; }
          sleep 15
        done

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependències
      run: |
        python -m pip install --upgrade pip
        pip install requests pytz

    - name: Executar l'script de notícies
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        cd private-scripts-new
        python noticias.py

    - name: Guardar el JSON a la branca 'data'
      timeout-minutes: 10
      run: |
        set -uo pipefail
        # Com que l'script s'ha executat dins de private-scripts-new, busquem el JSON allà
        P="$GITHUB_WORKSPACE/private-scripts-new/public/noticies/resum_cataluna.json"
        REMOTE_URL="https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/joctempestes.git"
        MSG="noticies $(date -u +'%Y-%m-%d %H:%M UTC')"

        if [ ! -f "$P" ]; then
          echo "ERROR: L'script de Python no ha generat el fitxer JSON a $P."
          exit 1
        fi

        for INTENT in 1 2 3 4 5 6; do
          echo "=== Guardar notícies a data (intent $INTENT/6) ==="
          rm -rf /tmp/dpub
          
          if ! git clone -q --depth 1 --branch data "$REMOTE_URL" /tmp/dpub; then
            sleep 15; continue
          fi
          
          cd /tmp/dpub
          git config user.name "bot-dades"
          git config user.email "bot@tempestes-cat"
          git config http.version HTTP/1.1
          git config http.postBuffer 1048576000
          git config core.compression 1
          git config gc.auto 0

          mkdir -p public/noticies
          cp "$P" public/noticies/resum_cataluna.json
          
          git add public/noticies/resum_cataluna.json
          
          if git diff --cached --quiet; then 
            echo "Sense canvis respecte a l'anterior. Sortint..."
            exit 0
          fi
          
          git commit -q -m "$MSG"

          if timeout 300 git push origin HEAD:refs/heads/data; then
            echo "Notícies publicades a la branca 'data' correctament!"
            exit 0
          fi
          
          echo "Push fallit; reintento..."
          cd /; sleep $((RANDOM % 10 + 10))
        done
        
        echo "No s'ha pogut guardar a la branca 'data' després de 6 intents."
        exit 1