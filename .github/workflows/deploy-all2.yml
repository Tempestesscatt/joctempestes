name: CAT + ONES + X

on:
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  # ════════════════════════════════════════════════════════════════
  #  JOB 1: CATALUNYA (cat.py)
  # ════════════════════════════════════════════════════════════════
  cat:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Checkout private submodule
      run: |
        git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git submodule update --init --recursive

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests tifffile scipy python-dotenv lxml xarray cfgrib meteofetch matplotlib
      continue-on-error: true

    - name: Netejar web_data
      run: |
        mkdir -p meu-mapa/public/web_data
        rm -rf meu-mapa/public/web_data/*
        echo "web_data netejat"

    - name: Executar cat.py
      run: |
        cd private-scripts
        python3 -c 'import json; cfg = json.load(open("config.json", "r", encoding="utf-8-sig")); cfg["api_key"] = "${{ secrets.AROME_API_KEY }}"; json.dump(cfg, open("config.json", "w", encoding="utf-8"), indent=2)'
        for i in 1 2 3; do
          echo "--- cat.py: intent $i/3 ---"
          python3 cat.py --total-hores 44 && echo "OK cat.py: exit a l'intent $i" && exit 0 || echo "ERROR cat.py: ha fallat (codi $?) a l'intent $i/3"
          sleep 30
        done
        echo "ERROR cat.py: tots els 3 intents han fallat." && exit 1
      timeout-minutes: 200

    - name: Mostrar log de cat.py si falla
      if: failure()
      run: |
        echo "=== LOG DE CAT.PY ==="
        find . -name "*.log" -type f -exec cat {} \; 2>/dev/null || echo "No s'ha trobat cap log"

    - name: Pujar web_data com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: dades-cat
        path: meu-mapa/public/web_data/
        retention-days: 1

  # ════════════════════════════════════════════════════════════════
  #  JOB 2: ONES (ones.py)
  # ════════════════════════════════════════════════════════════════
  ones:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Checkout private submodule
      run: |
        git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git submodule update --init --recursive

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests scipy python-dotenv lxml xarray cfgrib meteofetch matplotlib
      continue-on-error: true

    - name: Netejar sortida Ones
      run: |
        mkdir -p meu-mapa/public/web_data_ones
        echo "preparat"

    - name: Executar ones.py
      run: |
        cd private-scripts
        for i in 1 2 3; do
          echo "--- ones.py: intent $i/3 ---"
          python3 ones.py --total-hores 44 && echo "OK exit a l'intent $i" && exit 0 || echo "ERROR ha fallat (codi $?) a l'intent $i/3"
          sleep 30
        done
        echo "ERROR tots els 3 intents han fallat." && exit 1
      timeout-minutes: 110

    - name: Mostrar log si falla
      if: failure()
      run: |
        find . -name "*ones*.log" -type f -exec cat {} \; 2>/dev/null || echo "No s'ha trobat cap log"

    - name: Pujar Ones com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: dades-ones
        path: meu-mapa/public/web_data_ones/
        retention-days: 1

  # ════════════════════════════════════════════════════════════════
  #  JOB 3: X (X.py) - NOU SCRIPT
  # ════════════════════════════════════════════════════════════════
  x:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Checkout private submodule
      run: |
        git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git submodule update --init --recursive

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests scipy python-dotenv lxml xarray cfgrib meteofetch matplotlib
      continue-on-error: true

    - name: Netejar sortida X
      run: |
        mkdir -p meu-mapa/public/web_data_x
        echo "preparat"

    - name: Executar X.py
      run: |
        cd private-scripts
        for i in 1 2 3; do
          echo "--- X.py: intent $i/3 ---"
          python3 X.py --total-hores 44 && echo "OK exit a l'intent $i" && exit 0 || echo "ERROR ha fallat (codi $?) a l'intent $i/3"
          sleep 30
        done
        echo "ERROR tots els 3 intents han fallat." && exit 1
      timeout-minutes: 110

    - name: Mostrar log si falla
      if: failure()
      run: |
        find . -name "*X*.log" -type f -exec cat {} \; 2>/dev/null || echo "No s'ha trobat cap log"

    - name: Pujar X com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: dades-x
        path: meu-mapa/public/web_data_x/
        retention-days: 1

  # ════════════════════════════════════════════════════════════════
  #  JOB 4: STATUS (status.py) - GENERA status.js
  # ════════════════════════════════════════════════════════════════
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [cat, ones, x]
    if: always()  # S'executa sempre, fins i tot si cat, ones o X fallen
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Checkout private submodule
      run: |
        git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git submodule update --init --recursive

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies (bàsiques)
      run: |
        python3 -m pip install --upgrade pip
        # status.py només necessita Python estàndard

    - name: Descarregar artifact - CAT (per si cal)
      if: needs.cat.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-cat
        path: meu-mapa/public/web_data/
      continue-on-error: true

    - name: Descarregar artifact - ONES (per si cal)
      if: needs.ones.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-ones
        path: meu-mapa/public/web_data_ones/
      continue-on-error: true

    - name: Descarregar artifact - X (per si cal)
      if: needs.x.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-x
        path: meu-mapa/public/web_data_x/
      continue-on-error: true

    - name: Executar status.py
      run: |
        cd private-scripts
        python3 status.py
      timeout-minutes: 5

    - name: Mostrar status.js generat
      run: |
        echo "=== status.js generat ==="
        cat meu-mapa/public/js/status.js 2>/dev/null || echo "No s'ha trobat status.js"

    - name: Pujar status.js com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: dades-status
        path: meu-mapa/public/js/status.js
        retention-days: 1

  # ════════════════════════════════════════════════════════════════
  #  JOB FINAL: deploy
  # ════════════════════════════════════════════════════════════════
  deploy:
    needs: [cat, ones, x, status]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCRIPTS_FALLITS: ""

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Comprovar resultat dels jobs anteriors
      run: |
        FALLITS=""
        if [ "${{ needs.cat.result }}" != "success" ]; then FALLITS="$FALLITS cat"; fi
        if [ "${{ needs.ones.result }}" != "success" ]; then FALLITS="$FALLITS ones"; fi
        if [ "${{ needs.x.result }}" != "success" ]; then FALLITS="$FALLITS x"; fi
        if [ "${{ needs.status.result }}" != "success" ]; then FALLITS="$FALLITS status"; fi
        if [ -n "$FALLITS" ]; then
          echo "ATTENCIO: Jobs que NO han acabat en exit:$FALLITS (es continua igualment)"
          echo "SCRIPTS_FALLITS=$FALLITS" >> "$GITHUB_ENV"
        else
          echo "OK Tots els jobs han acabat en exit"
        fi

    - name: Descarregar artifact - CAT
      if: needs.cat.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-cat
        path: meu-mapa/public/web_data/
      continue-on-error: true

    - name: Descarregar artifact - ONES
      if: needs.ones.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-ones
        path: meu-mapa/public/web_data_ones/
      continue-on-error: true

    - name: Descarregar artifact - X
      if: needs.x.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-x
        path: meu-mapa/public/web_data_x/
      continue-on-error: true

    - name: Descarregar artifact - STATUS
      if: needs.status.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-status
        path: meu-mapa/public/js/
      continue-on-error: true

    - name: Comprovar mida de fitxers (limit 25 MiB de Cloudflare Pages)
      run: |
        echo "Fitxers per sobre de 25 MiB a tot public/ (fallarien el deploy):"
        find meu-mapa/public -type f -size +25M -exec ls -lh {} \; || echo "Cap fitxer supera el limit OK"

    - name: Dades generades (resum)
      run: |
        cd meu-mapa
        echo "Dades meteorologiques generades correctament."
        echo "--- web_data (cat) ---"
        ls public/web_data/ 2>/dev/null | wc -l || echo "buit"
        echo "--- web_data_ones ---"
        ls public/web_data_ones/ 2>/dev/null | wc -l || echo "buit"
        echo "--- web_data_x ---"
        ls public/web_data_x/ 2>/dev/null | wc -l || echo "buit"
        echo "--- status.js ---"
        ls -la public/js/status.js 2>/dev/null || echo "No existeix"
        echo "Pes total: $(du -sh public 2>/dev/null | cut -f1)"

    - name: Deploy a Cloudflare
      run: |
        cd meu-mapa
        npm install -g wrangler
        wrangler pages deploy public --project-name=tempestes-cat --branch=main --commit-dirty=true
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    - name: Comprovar si algun job ha fallat
      run: |
        FALLITS="${{ env.SCRIPTS_FALLITS }}"
        if [ "$FALLITS" = " cat ones x status" ] || [ "$FALLITS" = " ones cat x status" ] || [ "$FALLITS" = " x cat ones status" ]; then
          echo "ERROR: Tots els jobs han fallat ($FALLITS)"
          exit 1
        elif [ -n "$FALLITS" ]; then
          echo "AVIS: Algun job ha fallat:$FALLITS (es continua)"
        else
          echo "OK Tots els jobs han acabat en exit"
        fi

    - name: Completat
      run: |
        echo "============================================"
        echo "  OK TOT COMPLETAT (cat + ones + x + status)!"
        echo "  Dades desplegades a Cloudflare Pages"
        echo "  status.js generat correctament"
        echo "============================================"