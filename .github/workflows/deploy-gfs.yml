name: GFS GLOBAL · SFC + PRES

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'  # Cada 6 hores

permissions:
  contents: write
  deployments: write

jobs:
  # ════════════════════════════════════════════════════════════════
  #  JOB 0: GFS SFC
  # ════════════════════════════════════════════════════════════════
  gfs_sfc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Checkout private submodule
      run: |
        git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git submodule update --init --recursive

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests scipy cfgrib xarray
      continue-on-error: true

    - name: Netejar sortida GFS SFC
      run: |
        mkdir -p meu-mapa/public/webdataGLOBAL
        rm -f meu-mapa/public/webdataGLOBAL/gfs_sfc_*.json.gz
        echo "Preparat"

    - name: Executar gfs.py
      run: |
        cd private-scripts
        for i in 1 2 3; do
          echo "--- gfs.py: intent $i/3 ---"
          python3 gfs.py && echo "OK exit a l'intent $i" && exit 0 || echo "ERROR ha fallat (codi $?) a l'intent $i/3"
          sleep 30
        done
        echo "ERROR tots els 3 intents han fallat." && exit 1
      timeout-minutes: 40

    - name: Mostrar log si falla
      if: failure()
      run: |
        find . -name "*.log" -type f -exec cat {} \; 2>/dev/null || echo "No s'ha trobat cap log"

    - name: Pujar GFS SFC com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: dades-gfs-sfc
        path: meu-mapa/public/webdataGLOBAL/
        retention-days: 1

  # ════════════════════════════════════════════════════════════════
  #  JOB 1: GFS PRES (nivells de pressió)
  # ════════════════════════════════════════════════════════════════
  gfs_pres:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Checkout private submodule
      run: |
        git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git submodule update --init --recursive

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests scipy cfgrib xarray
      continue-on-error: true

    - name: Netejar sortida GFS PRES
      run: |
        mkdir -p meu-mapa/public/webdataGLOBAL
        rm -f meu-mapa/public/webdataGLOBAL/gfs_pres_*.json.gz
        echo "Preparat"

    - name: Executar gfs_pres.py (tots els nivells)
      run: |
        cd private-scripts
        for i in 1 2 3; do
          echo "--- gfs_pres.py all: intent $i/3 ---"
          python3 gfs_pres.py all && echo "OK exit a l'intent $i" && exit 0 || echo "ERROR ha fallat (codi $?) a l'intent $i/3"
          sleep 30
        done
        echo "ERROR tots els 3 intents han fallat." && exit 1
      timeout-minutes: 170

    - name: Mostrar log si falla
      if: failure()
      run: |
        find . -name "*.log" -type f -exec cat {} \; 2>/dev/null || echo "No s'ha trobat cap log"

    - name: Pujar GFS PRES com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: dades-gfs-pres
        path: meu-mapa/public/webdataGLOBAL/
        retention-days: 1

  # ════════════════════════════════════════════════════════════════
  #  JOB FINAL: Merge + Deploy
  # ════════════════════════════════════════════════════════════════
  deploy:
    needs: [gfs_sfc, gfs_pres]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCRIPTS_FALLITS: ""

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Comprovar resultat dels jobs anteriors
      run: |
        FALLITS=""
        if [ "${{ needs.gfs_sfc.result }}" != "success" ]; then FALLITS="$FALLITS gfs_sfc"; fi
        if [ "${{ needs.gfs_pres.result }}" != "success" ]; then FALLITS="$FALLITS gfs_pres"; fi
        if [ -n "$FALLITS" ]; then
          echo "ATTENCIO: Jobs que NO han acabat en exit:$FALLITS (es continua igualment)"
          echo "SCRIPTS_FALLITS=$FALLITS" >> "$GITHUB_ENV"
        else
          echo "OK Tots els jobs han acabat en exit"
        fi

    - name: Descarregar artifact - GFS SFC
      if: needs.gfs_sfc.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-gfs-sfc
        path: meu-mapa/public/webdataGLOBAL/
      continue-on-error: true

    - name: Descarregar artifact - GFS PRES
      if: needs.gfs_pres.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-gfs-pres
        path: meu-mapa/public/webdataGLOBAL/
      continue-on-error: true

    - name: Dades generades (resum)
      run: |
        cd meu-mapa/public/webdataGLOBAL
        echo "--- GFS SFC ---"
        ls gfs_sfc_*.json.gz 2>/dev/null | wc -l || echo "0"
        echo "--- GFS PRES ---"
        ls gfs_pres_*.json.gz 2>/dev/null | wc -l || echo "0"
        echo "--- Total ---"
        ls *.json.gz 2>/dev/null | wc -l || echo "0"
        echo "Pes total: $(du -sh . 2>/dev/null | cut -f1)"

    - name: Deploy a Cloudflare
      run: |
        cd meu-mapa
        npm install -g wrangler
        wrangler pages deploy public --project-name=tempestes-cat --branch=main --commit-dirty=true
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    - name: Comprovar si algun job ha fallat
      if: ${{ env.SCRIPTS_FALLITS != '' }}
      run: |
        echo "ERROR Jobs fallits:${{ env.SCRIPTS_FALLITS }}"
        exit 1

    - name: Completat
      run: |
        echo "============================================"
        echo "  ✅ GFS GLOBAL COMPLETAT!"
        echo "  SFC + PRES desplegats a Cloudflare Pages"
        echo "============================================"