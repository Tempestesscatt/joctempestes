name: GFS + ENSEMBLES

on:
  workflow_dispatch:
  schedule:
    # Cada dia a les 5:00 AM (UTC)
    - cron: '0 5 * * *'

permissions:
  contents: write
  deployments: write

# Mateix grup que l'altre workflow: s'encuen en lloc de trepitjar-se
concurrency:
  group: deploy-data
  cancel-in-progress: false

jobs:
  # ════════════════════════════════════════════════════════════════
  #  JOB: GFSMAP - Genera els mapes GFS (NO desplega)
  # ════════════════════════════════════════════════════════════════
  gfsmap:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests matplotlib scipy
        python3 -m pip install herbie-data xarray cfgrib eccodes
        python3 -m pip install shapely pyproj cartopy metpy
      continue-on-error: true

    - name: Crear carpeta gfsmaps
      run: |
        mkdir -p meu-mapa/public/gfsmaps
        echo "Carpeta gfsmaps creada"

    - name: Executar gfsmap.py
      run: |
        cd private-scripts-new
        echo "--- gfsmap.py: inici ---"
        echo "Hora d'inici: $(date)"
        python3 gfsmap.py 2>&1 | tee gfsmap.log
        echo "Hora de final: $(date)"
        echo "✅ gfsmap.py: completat"
      timeout-minutes: 300

    - name: Mostrar log si falla
      if: failure()
      run: |
        echo "=== LOG DE GFSMAP.PY ==="
        cat private-scripts-new/gfsmap.log 2>/dev/null || echo "No s'ha trobat cap log"

    - name: Verificar fitxers generats
      run: |
        echo "=== Fitxers generats a gfsmaps/ ==="
        ls -la meu-mapa/public/gfsmaps/ 2>/dev/null || echo "No hi ha fitxers"
        echo ""
        echo "=== Comptant imatges PNG ==="
        find meu-mapa/public/gfsmaps/ -name "*.png" -type f | wc -l

    - name: Pujar GFSMAP com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: dades-gfsmap
        path: meu-mapa/public/gfsmaps/
        retention-days: 5

  # ════════════════════════════════════════════════════════════════
  #  JOB: GFSNE - Genera els mapes GFS NE (NO desplega)
  # ════════════════════════════════════════════════════════════════
  gfsne:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests matplotlib scipy
        python3 -m pip install herbie-data xarray cfgrib eccodes
        python3 -m pip install shapely pyproj cartopy metpy
      continue-on-error: true

    - name: Crear carpeta gfsESPmaps
      run: |
        mkdir -p meu-mapa/public/gfsESPmaps
        echo "Carpeta gfsESPmaps creada"

    - name: Executar gfsNE.py
      run: |
        cd private-scripts-new
        echo "--- gfsNE.py: inici ---"
        echo "Hora d'inici: $(date)"
        python3 gfsNE.py 2>&1 | tee gfsNE.log
        echo "Hora de final: $(date)"
        echo "✅ gfsNE.py: completat"
      timeout-minutes: 300

    - name: Mostrar log si falla
      if: failure()
      run: |
        echo "=== LOG DE GFSNE.PY ==="
        cat private-scripts-new/gfsNE.log 2>/dev/null || echo "No s'ha trobat cap log"

    - name: Verificar fitxers generats
      run: |
        echo "=== Fitxers generats a gfsESPmaps/ ==="
        ls -la meu-mapa/public/gfsESPmaps/ 2>/dev/null || echo "No hi ha fitxers"
        echo ""
        echo "=== Comptant imatges PNG ==="
        find meu-mapa/public/gfsESPmaps/ -name "*.png" -type f | wc -l

    - name: Pujar GFSNE com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: dades-gfsne
        path: meu-mapa/public/gfsESPmaps/
        retention-days: 5

  # ════════════════════════════════════════════════════════════════
  #  JOB: ENSEMBLES - Genera els gràfics d'ensembles (NO desplega)
  # ════════════════════════════════════════════════════════════════
  ensembles:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests matplotlib scipy
        python3 -m pip install herbie-data xarray cfgrib eccodes
        python3 -m pip install shapely pyproj
      continue-on-error: true

    - name: Crear carpeta previsions_catalunya
      run: |
        mkdir -p meu-mapa/public/previsions_catalunya
        echo "Carpeta previsions_catalunya creada"

    - name: Executar enssambles.py
      run: |
        cd private-scripts-new
        echo "--- enssambles.py: inici ---"
        echo "Hora d'inici: $(date)"
        python3 enssambles.py 2>&1 | tee ensembles.log
        echo "Hora de final: $(date)"
        echo "✅ enssambles.py: completat"
      timeout-minutes: 300

    - name: Mostrar log si falla
      if: failure()
      run: |
        echo "=== LOG DE ENSSAMBLES.PY ==="
        cat private-scripts-new/ensembles.log 2>/dev/null || echo "No s'ha trobat cap log"

    - name: Verificar fitxers generats
      run: |
        echo "=== Fitxers generats a previsions_catalunya/ ==="
        ls -la meu-mapa/public/previsions_catalunya/ 2>/dev/null || echo "No hi ha fitxers"
        echo ""
        echo "=== Comptant imatges PNG ==="
        find meu-mapa/public/previsions_catalunya/ -name "*.png" -type f | wc -l

    - name: Pujar ENSEMBLES com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: dades-ensembles
        path: meu-mapa/public/previsions_catalunya/
        retention-days: 5

  # ════════════════════════════════════════════════════════════════
  #  JOB FINAL: deploy - Junta GFSMAP + GFSNE + ENSEMBLES + dades
  #  del mapa i fa un ÚNIC deploy a Cloudflare
  # ════════════════════════════════════════════════════════════════
  deploy:
    needs: [gfsmap, gfsne, ensembles]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}
        fetch-depth: 0

    - name: Comprovar resultat dels jobs anteriors
      run: |
        FALLITS=""
        if [ "${{ needs.gfsmap.result }}" != "success" ]; then FALLITS="$FALLITS gfsmap"; fi
        if [ "${{ needs.gfsne.result }}" != "success" ]; then FALLITS="$FALLITS gfsne"; fi
        if [ "${{ needs.ensembles.result }}" != "success" ]; then FALLITS="$FALLITS ensembles"; fi
        if [ -n "$FALLITS" ]; then
          echo "⚠️  ATENCIÓ: Jobs que NO han acabat en èxit:$FALLITS (es continua igualment amb el que hi hagi)"
        else
          echo "✅ Tots els jobs han acabat en èxit"
        fi

    # ── Recuperar TOT el que hi ha a la branca 'data' (mapa + gfsmaps + gfsESPmaps + previsions) ──
    #    Es fa ABANS de baixar els artifacts, perquè les dades fresques d'aquest
    #    workflow sobreescriguin les de 'data', i si un job falla es conservi l'anterior.
    - name: 📥 Recuperar dades de la branca 'data'
      run: |
        git fetch origin data
        rm -rf /tmp/data-branch
        git worktree add /tmp/data-branch origin/data
        mkdir -p meu-mapa/public/web_data_NE meu-mapa/public/webdata_waves meu-mapa/public/js meu-mapa/public/gfsmaps meu-mapa/public/gfsESPmaps meu-mapa/public/previsions_catalunya
        cp -r /tmp/data-branch/web_data_NE/. meu-mapa/public/web_data_NE/ 2>/dev/null || echo "⚠️  web_data_NE no trobat a la branca data"
        cp -r /tmp/data-branch/webdata_waves/. meu-mapa/public/webdata_waves/ 2>/dev/null || echo "⚠️  webdata_waves no trobat a la branca data"
        cp /tmp/data-branch/js/status.js meu-mapa/public/js/status.js 2>/dev/null || echo "⚠️  status.js no trobat a la branca data"
        cp -r /tmp/data-branch/gfsmaps/. meu-mapa/public/gfsmaps/ 2>/dev/null || echo "⚠️  gfsmaps no trobat a la branca data (primera execució?)"
        cp -r /tmp/data-branch/gfsESPmaps/. meu-mapa/public/gfsESPmaps/ 2>/dev/null || echo "⚠️  gfsESPmaps no trobat a la branca data (primera execució?)"
        cp -r /tmp/data-branch/previsions_catalunya/. meu-mapa/public/previsions_catalunya/ 2>/dev/null || echo "⚠️  previsions_catalunya no trobat a la branca data (primera execució?)"
        git worktree remove /tmp/data-branch --force
        echo "✅ Dades de la branca 'data' aplicades sobre el checkout"
      continue-on-error: true

    - name: Descarregar artifact - GFSMAP
      if: needs.gfsmap.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-gfsmap
        path: meu-mapa/public/gfsmaps/
      continue-on-error: true

    - name: Descarregar artifact - GFSNE
      if: needs.gfsne.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-gfsne
        path: meu-mapa/public/gfsESPmaps/
      continue-on-error: true

    - name: Descarregar artifact - ENSEMBLES
      if: needs.ensembles.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-ensembles
        path: meu-mapa/public/previsions_catalunya/
      continue-on-error: true

    - name: Resum abans del deploy
      run: |
        echo "📊 RESUM:"
        echo "--- gfsmaps/ ---"
        find meu-mapa/public/gfsmaps/ -name "*.png" -type f 2>/dev/null | wc -l || echo "buit"
        echo "--- gfsESPmaps/ ---"
        find meu-mapa/public/gfsESPmaps/ -name "*.png" -type f 2>/dev/null | wc -l || echo "buit"
        echo "--- previsions_catalunya/ ---"
        find meu-mapa/public/previsions_catalunya/ -name "*.png" -type f 2>/dev/null | wc -l || echo "buit"
        echo "--- web_data_NE ---"
        find meu-mapa/public/web_data_NE -type f 2>/dev/null | wc -l || echo "buit"
        echo "--- webdata_waves ---"
        find meu-mapa/public/webdata_waves -type f 2>/dev/null | wc -l || echo "buit"
        echo "--- status.js ---"
        ls -la meu-mapa/public/js/status.js 2>/dev/null || echo "No existeix"
        echo "📦 TOTAL: $(find meu-mapa/public -type f 2>/dev/null | wc -l) fitxers"

    - name: Deploy a Cloudflare (ÚNIC, amb tot junt)
      run: |
        cd meu-mapa
        npm install -g wrangler
        wrangler pages deploy public --project-name=tempestes-cat --branch=main --commit-dirty=true
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    # ── NOU: publicar a 'data' el que s'ha generat, preservant la resta ──
    - name: 📤 Publicar dades a la branca 'data' (force-push, sense historial)
      run: |
        cd meu-mapa/public
        mkdir -p web_data_NE webdata_waves js gfsmaps gfsESPmaps previsions_catalunya
        rm -rf .git
        git init -q
        git checkout -q -b data

        AFEGIT=0
        for carpeta in web_data_NE webdata_waves gfsmaps gfsESPmaps previsions_catalunya; do
          if [ -n "$(find "$carpeta" -type f 2>/dev/null)" ]; then
            git add "$carpeta"
            AFEGIT=1
          else
            echo "⚠️  $carpeta buida o inexistent, s'omet"
          fi
        done
        if [ -f js/status.js ]; then
          git add js/status.js
          AFEGIT=1
        else
          echo "⚠️  js/status.js no existeix, s'omet"
        fi

        if [ "$AFEGIT" = "1" ]; then
          git -c user.name="bot-dades" -c user.email="bot@tempestes-cat" commit -q -m "gfs+ensembles $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force "https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/joctempestes.git" data
          echo "✅ Dades publicades a la branca 'data'"
        else
          echo "❌ Cap dada disponible per publicar, s'omet el push"
        fi
      continue-on-error: true

    - name: Completat
      run: |
        echo "============================================"
        echo "  ✅ GFS + ENSEMBLES COMPLETAT!"
        echo "  Un únic deploy amb tots els fitxers junts"
        echo "  Dades publicades a la branca 'data' (mapa + gfs + previsions)"
        echo "  Hora: $(date)"
        echo "============================================"