name: GFS + ENSEMBLES

on:
  workflow_dispatch:
  schedule:
    # Cada dia a les 5:00 AM (UTC)
    - cron: '0 5 * * *'

permissions:
  contents: write
  deployments: write

concurrency:
  group: deploy-data
  cancel-in-progress: false

jobs:
  # ════════════════════════════════════════════════════════════════
  #  GFSMAP
  # ════════════════════════════════════════════════════════════════
  gfsmap:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests matplotlib scipy
        python3 -m pip install herbie-data xarray cfgrib eccodes
        python3 -m pip install shapely pyproj cartopy metpy

    - name: Crear carpeta de sortida (buida)
      run: |
        rm -rf "$GITHUB_WORKSPACE/meu-mapa/public/gfsmaps"
        mkdir -p "$GITHUB_WORKSPACE/meu-mapa/public/gfsmaps"

    - name: Executar gfsmap.py
      run: |
        cd private-scripts-new
        echo "Hora d'inici: $(date)"
        python3 gfsmap.py --out-dir "$GITHUB_WORKSPACE/meu-mapa/public/gfsmaps" 2>&1 | tee gfsmap.log
        echo "Hora de final: $(date)"
      timeout-minutes: 300

    - name: Mostrar log si falla
      if: failure()
      run: cat private-scripts-new/gfsmap.log 2>/dev/null || echo "No hi ha log"

    - name: Verificar fitxers generats (falla si n'hi ha 0)
      run: |
        DIR="$GITHUB_WORKSPACE/meu-mapa/public/gfsmaps"
        N=$(find "$DIR" -name "*.png" -type f | wc -l)
        echo "PNG generats: $N"
        ls "$DIR" | head -5
        if [ "$N" -lt 10 ]; then
          echo "❌ Massa pocs PNG ($N). Es marca el job com a fallit."
          exit 1
        fi
        [ -f "$DIR/mapes.json" ] && echo "✅ mapes.json OK" || { echo "❌ Falta mapes.json"; exit 1; }

    - name: Pujar GFSMAP com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: dades-gfsmap
        path: meu-mapa/public/gfsmaps/
        retention-days: 5
        if-no-files-found: error

  # ════════════════════════════════════════════════════════════════
  #  GFSNE
  # ════════════════════════════════════════════════════════════════
  gfsne:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests matplotlib scipy
        python3 -m pip install herbie-data xarray cfgrib eccodes
        python3 -m pip install shapely pyproj cartopy metpy

    - name: Crear carpeta de sortida (buida)
      run: |
        rm -rf "$GITHUB_WORKSPACE/meu-mapa/public/gfsESPmaps"
        mkdir -p "$GITHUB_WORKSPACE/meu-mapa/public/gfsESPmaps"

    - name: Executar gfsNE.py
      run: |
        cd private-scripts-new
        echo "Hora d'inici: $(date)"
        python3 gfsNE.py --out-dir "$GITHUB_WORKSPACE/meu-mapa/public/gfsESPmaps" 2>&1 | tee gfsNE.log
        echo "Hora de final: $(date)"
      timeout-minutes: 300

    - name: Mostrar log si falla
      if: failure()
      run: cat private-scripts-new/gfsNE.log 2>/dev/null || echo "No hi ha log"

    - name: Verificar fitxers generats (falla si n'hi ha 0)
      run: |
        DIR="$GITHUB_WORKSPACE/meu-mapa/public/gfsESPmaps"
        N=$(find "$DIR" -name "*.png" -type f | wc -l)
        echo "PNG generats: $N"
        ls "$DIR" | head -5
        if [ "$N" -lt 10 ]; then
          echo "❌ Massa pocs PNG ($N). Es marca el job com a fallit."
          exit 1
        fi
        [ -f "$DIR/mapes.json" ] && echo "✅ mapes.json OK" || { echo "❌ Falta mapes.json"; exit 1; }

    - name: Pujar GFSNE com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: dades-gfsne
        path: meu-mapa/public/gfsESPmaps/
        retention-days: 5
        if-no-files-found: error

  # ════════════════════════════════════════════════════════════════
  #  ENSEMBLES
  # ════════════════════════════════════════════════════════════════
  ensembles:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests matplotlib scipy
        python3 -m pip install herbie-data xarray cfgrib eccodes
        python3 -m pip install shapely pyproj

    - name: Crear carpeta previsions_catalunya
      run: mkdir -p "$GITHUB_WORKSPACE/meu-mapa/public/previsions_catalunya"

    - name: Executar enssambles.py
      run: |
        cd private-scripts-new
        echo "Hora d'inici: $(date)"
        python3 enssambles.py 2>&1 | tee ensembles.log
        echo "Hora de final: $(date)"
      timeout-minutes: 300

    - name: Mostrar log si falla
      if: failure()
      run: cat private-scripts-new/ensembles.log 2>/dev/null || echo "No hi ha log"

    - name: Verificar fitxers generats
      run: |
        DIR="$GITHUB_WORKSPACE/meu-mapa/public/previsions_catalunya"
        N=$(find "$DIR" -name "*.png" -type f | wc -l)
        echo "PNG generats: $N"
        if [ "$N" -lt 1 ]; then
          echo "❌ Cap PNG d'ensembles. Es marca el job com a fallit."
          exit 1
        fi

    - name: Pujar ENSEMBLES com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: dades-ensembles
        path: meu-mapa/public/previsions_catalunya/
        retention-days: 5
        if-no-files-found: error

  # ════════════════════════════════════════════════════════════════
  #  DEPLOY ÚNIC
  # ════════════════════════════════════════════════════════════════
  deploy:
    needs: [gfsmap, gfsne, ensembles]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}
        fetch-depth: 0

    - name: Resultat dels jobs anteriors
      run: |
        echo "gfsmap:    ${{ needs.gfsmap.result }}"
        echo "gfsne:     ${{ needs.gfsne.result }}"
        echo "ensembles: ${{ needs.ensembles.result }}"

    # 1) Base: tot el que hi ha a la branca 'data' (com a còpia de seguretat)
    - name: 📥 Recuperar dades de la branca 'data'
      run: |
        git fetch origin data
        rm -rf /tmp/data-branch
        git worktree add /tmp/data-branch origin/data
        P=meu-mapa/public
        mkdir -p $P/web_data_NE $P/webdata_waves $P/js $P/gfsmaps $P/gfsESPmaps $P/previsions_catalunya
        cp -r /tmp/data-branch/web_data_NE/. $P/web_data_NE/ 2>/dev/null || echo "⚠️ web_data_NE no trobat"
        cp -r /tmp/data-branch/webdata_waves/. $P/webdata_waves/ 2>/dev/null || echo "⚠️ webdata_waves no trobat"
        cp /tmp/data-branch/js/status.js $P/js/status.js 2>/dev/null || echo "⚠️ status.js no trobat"
        cp -r /tmp/data-branch/gfsmaps/. $P/gfsmaps/ 2>/dev/null || echo "⚠️ gfsmaps no trobat a data"
        cp -r /tmp/data-branch/gfsESPmaps/. $P/gfsESPmaps/ 2>/dev/null || echo "⚠️ gfsESPmaps no trobat a data"
        cp -r /tmp/data-branch/previsions_catalunya/. $P/previsions_catalunya/ 2>/dev/null || echo "⚠️ previsions_catalunya no trobat a data"
        git worktree remove /tmp/data-branch --force
      continue-on-error: true

    # 2) Si el job ha anat bé: ESBORRAR els vells i posar només els nous
    - name: Netejar carpeta vella - GFSMAP
      if: needs.gfsmap.result == 'success'
      run: rm -rf meu-mapa/public/gfsmaps && mkdir -p meu-mapa/public/gfsmaps

    - name: Descarregar artifact - GFSMAP
      if: needs.gfsmap.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-gfsmap
        path: meu-mapa/public/gfsmaps/

    - name: Netejar carpeta vella - GFSNE
      if: needs.gfsne.result == 'success'
      run: rm -rf meu-mapa/public/gfsESPmaps && mkdir -p meu-mapa/public/gfsESPmaps

    - name: Descarregar artifact - GFSNE
      if: needs.gfsne.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-gfsne
        path: meu-mapa/public/gfsESPmaps/

    - name: Netejar carpeta vella - ENSEMBLES
      if: needs.ensembles.result == 'success'
      run: rm -rf meu-mapa/public/previsions_catalunya && mkdir -p meu-mapa/public/previsions_catalunya

    - name: Descarregar artifact - ENSEMBLES
      if: needs.ensembles.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-ensembles
        path: meu-mapa/public/previsions_catalunya/

    - name: Resum abans del deploy
      run: |
        P=meu-mapa/public
        for d in gfsmaps gfsESPmaps previsions_catalunya; do
          echo "--- $d: $(find $P/$d -name '*.png' -type f 2>/dev/null | wc -l) PNG ---"
        done
        echo "Run publicat GFS:    $(grep -o '"run": *"[^"]*"' $P/gfsmaps/mapes.json 2>/dev/null | head -1)"
        echo "Run publicat GFS NE: $(grep -o '"run": *"[^"]*"' $P/gfsESPmaps/mapes.json 2>/dev/null | head -1)"
        echo "TOTAL: $(find $P -type f | wc -l) fitxers"

    - name: Deploy a Cloudflare
      run: |
        cd meu-mapa
        npm install -g wrangler
        wrangler pages deploy public --project-name=tempestes-cat --branch=main --commit-dirty=true
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    - name: 📤 Publicar dades a la branca 'data'
      run: |
        cd meu-mapa/public
        rm -rf .git
        git init -q
        git checkout -q -b data
        AFEGIT=0
        for carpeta in web_data_NE webdata_waves gfsmaps gfsESPmaps previsions_catalunya; do
          if [ -n "$(find "$carpeta" -type f 2>/dev/null)" ]; then
            git add "$carpeta"; AFEGIT=1
          fi
        done
        [ -f js/status.js ] && { git add js/status.js; AFEGIT=1; }
        if [ "$AFEGIT" = "1" ]; then
          git -c user.name="bot-dades" -c user.email="bot@tempestes-cat" commit -q -m "gfs+ensembles $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force "https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/joctempestes.git" data
          echo "✅ Publicat a 'data'"
        else
          echo "❌ Res a publicar"
        fi
      continue-on-error: true

    - name: Completat
      run: echo "✅ Deploy completat $(date)"