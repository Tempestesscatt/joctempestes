name: GFS + ENSEMBLES

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: write
  deployments: write

concurrency:
  group: deploy-data
  cancel-in-progress: false

jobs:
  gfsmap:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}
    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests matplotlib scipy herbie-data xarray cfgrib eccodes shapely pyproj cartopy metpy
    - name: Crear carpeta de sortida (buida)
      run: |
        rm -rf "$GITHUB_WORKSPACE/meu-mapa/public/gfsmaps"
        mkdir -p "$GITHUB_WORKSPACE/meu-mapa/public/gfsmaps"
    - name: Executar gfsmap.py
      run: |
        cd private-scripts-new
        python3 gfsmap.py --out-dir "$GITHUB_WORKSPACE/meu-mapa/public/gfsmaps" 2>&1 | tee gfsmap.log
      timeout-minutes: 300
    - name: Mostrar log si falla
      if: failure()
      run: cat private-scripts-new/gfsmap.log 2>/dev/null || echo "No hi ha log"
    - name: Verificar fitxers generats
      run: |
        DIR="$GITHUB_WORKSPACE/meu-mapa/public/gfsmaps"
        N=$(find "$DIR" -name "*.png" -type f | wc -l)
        echo "PNG generats: $N"
        [ "$N" -lt 10 ] && { echo "❌ Massa pocs PNG"; exit 1; }
        [ -f "$DIR/mapes.json" ] || { echo "❌ Falta mapes.json"; exit 1; }
        echo "✅ OK"
    - uses: actions/upload-artifact@v4
      with:
        name: dades-gfsmap
        path: meu-mapa/public/gfsmaps/
        retention-days: 5
        if-no-files-found: error

  gfsne:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}
    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests matplotlib scipy herbie-data xarray cfgrib eccodes shapely pyproj cartopy metpy
    - name: Crear carpeta de sortida (buida)
      run: |
        rm -rf "$GITHUB_WORKSPACE/meu-mapa/public/gfsESPmaps"
        mkdir -p "$GITHUB_WORKSPACE/meu-mapa/public/gfsESPmaps"
    - name: Executar gfsNE.py
      run: |
        cd private-scripts-new
        python3 gfsNE.py --out-dir "$GITHUB_WORKSPACE/meu-mapa/public/gfsESPmaps" 2>&1 | tee gfsNE.log
      timeout-minutes: 300
    - name: Mostrar log si falla
      if: failure()
      run: cat private-scripts-new/gfsNE.log 2>/dev/null || echo "No hi ha log"
    - name: Verificar fitxers generats
      run: |
        DIR="$GITHUB_WORKSPACE/meu-mapa/public/gfsESPmaps"
        N=$(find "$DIR" -name "*.png" -type f | wc -l)
        echo "PNG generats: $N"
        [ "$N" -lt 10 ] && { echo "❌ Massa pocs PNG"; exit 1; }
        [ -f "$DIR/mapes.json" ] || { echo "❌ Falta mapes.json"; exit 1; }
        echo "✅ OK"
    - uses: actions/upload-artifact@v4
      with:
        name: dades-gfsne
        path: meu-mapa/public/gfsESPmaps/
        retention-days: 5
        if-no-files-found: error

  ensembles:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}
    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests matplotlib scipy herbie-data xarray cfgrib eccodes shapely pyproj
    - name: Crear carpeta previsions_catalunya
      run: mkdir -p "$GITHUB_WORKSPACE/meu-mapa/public/previsions_catalunya"
    - name: Executar enssambles.py
      run: |
        cd private-scripts-new
        python3 enssambles.py 2>&1 | tee ensembles.log
      timeout-minutes: 300
    - name: Mostrar log si falla
      if: failure()
      run: cat private-scripts-new/ensembles.log 2>/dev/null || echo "No hi ha log"
    - name: Verificar fitxers generats
      run: |
        DIR="$GITHUB_WORKSPACE/meu-mapa/public/previsions_catalunya"
        N=$(find "$DIR" -name "*.png" -type f | wc -l)
        echo "PNG generats: $N"
        [ "$N" -lt 1 ] && { echo "❌ Cap PNG"; exit 1; }
        echo "✅ OK"
    - uses: actions/upload-artifact@v4
      with:
        name: dades-ensembles
        path: meu-mapa/public/previsions_catalunya/
        retention-days: 5
        if-no-files-found: error

  # ════════════════════════════════════════════════════════════════
  #  DEPLOY — robust: relectura fresca de 'data' i push protegit
  #  + PROTECCIÓ dels fitxers estàtics (selector.html, index.html, etc.)
  # ════════════════════════════════════════════════════════════════
  deploy:
    needs: [gfsmap, gfsne, ensembles]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}
        fetch-depth: 0

    - name: Resultat dels jobs anteriors
      run: |
        echo "gfsmap:    ${{ needs.gfsmap.result }}"
        echo "gfsne:     ${{ needs.gfsne.result }}"
        echo "ensembles: ${{ needs.ensembles.result }}"

    # Baixem NOMÉS els artifacts nous a /tmp (no toquem encara 'public/')
    - name: Descarregar artifact - GFSMAP
      if: needs.gfsmap.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-gfsmap
        path: /tmp/nou-gfsmaps

    - name: Descarregar artifact - GFSNE
      if: needs.gfsne.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-gfsne
        path: /tmp/nou-gfsESPmaps

    - name: Descarregar artifact - ENSEMBLES
      if: needs.ensembles.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-ensembles
        path: /tmp/nou-previsions

    # ── Llegeix 'data' EN FRESC, fusiona, publica; reintenta si hi ha cursa ──
    - name: 🔒 Fusionar i publicar (reintents anti-cursa + estàtics protegits)
      run: |
        P="$GITHUB_WORKSPACE/meu-mapa/public"
        CARPETES="web_data_NE webdata_waves avis gfsmaps gfsESPmaps previsions_catalunya"
        MAX_INTENTS=5
        INTENT=1
        PUBLICAT=0
        REMOTE_URL="https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/joctempestes.git"

        while [ $INTENT -le $MAX_INTENTS ]; do
          echo "=== Intent $INTENT/$MAX_INTENTS ==="

          # 1) Llegim 'data' EN FRESC (SHA directe del remot)
          cd "$GITHUB_WORKSPACE"
          DATA_SHA_ABANS=$(git ls-remote "$REMOTE_URL" refs/heads/data | cut -f1)
          [ -z "$DATA_SHA_ABANS" ] && DATA_SHA_ABANS="none"

          # ── PROTECCIÓ ESTÀTICS: guardem TOT el que ja hi ha a public/ ──
          #    (ve del checkout de main: selector.html, index.html, css/, etc.)
          #    abans de destruir-lo, EXCEPTE les carpetes que gestiona 'data'.
          rm -rf /tmp/estatic-base
          mkdir -p /tmp/estatic-base
          if [ -d "$P" ]; then
            cp -r "$P"/. /tmp/estatic-base/
            for c in $CARPETES; do
              rm -rf "/tmp/estatic-base/$c"
            done
            rm -f /tmp/estatic-base/js/status.js
          fi
          echo "--- Fitxers/carpetes estàtics protegits en aquest intent ---"
          find /tmp/estatic-base -maxdepth 1
          # ── FI PROTECCIÓ ESTÀTICS ──

          rm -rf /tmp/data-branch "$P"
          mkdir -p "$P/js"
          for c in $CARPETES; do mkdir -p "$P/$c"; done

          # ── PROTECCIÓ ESTÀTICS: restaurem ABANS de fusionar amb 'data' ──
          cp -r /tmp/estatic-base/. "$P/"
          # ── FI PROTECCIÓ ESTÀTICS ──

          if [ "$DATA_SHA_ABANS" != "none" ]; then
            git fetch origin data
            git worktree prune
            git worktree add -f /tmp/data-branch FETCH_HEAD
            for c in $CARPETES; do
              cp -r /tmp/data-branch/$c/. "$P/$c/" 2>/dev/null || echo "  ⚠️ $c no trobat a data"
            done
            cp /tmp/data-branch/js/status.js "$P/js/status.js" 2>/dev/null || true
            git worktree remove /tmp/data-branch --force
          else
            echo "  ⚠️ La branca 'data' encara no existeix, es crearà"
          fi

          # 2) Sobreescrivim NOMÉS el que aquest run ha generat de nou
          if [ -d /tmp/nou-gfsmaps ] && [ -n "$(ls -A /tmp/nou-gfsmaps 2>/dev/null)" ]; then
            rm -rf "$P/gfsmaps"; mkdir -p "$P/gfsmaps"
            cp -r /tmp/nou-gfsmaps/. "$P/gfsmaps/"
            echo "  ↳ gfsmaps: substituït pel nou run"
          fi
          if [ -d /tmp/nou-gfsESPmaps ] && [ -n "$(ls -A /tmp/nou-gfsESPmaps 2>/dev/null)" ]; then
            rm -rf "$P/gfsESPmaps"; mkdir -p "$P/gfsESPmaps"
            cp -r /tmp/nou-gfsESPmaps/. "$P/gfsESPmaps/"
            echo "  ↳ gfsESPmaps: substituït pel nou run"
          fi
          if [ -d /tmp/nou-previsions ] && [ -n "$(ls -A /tmp/nou-previsions 2>/dev/null)" ]; then
            rm -rf "$P/previsions_catalunya"; mkdir -p "$P/previsions_catalunya"
            cp -r /tmp/nou-previsions/. "$P/previsions_catalunya/"
            echo "  ↳ previsions_catalunya: substituït pel nou run"
          fi

          echo "--- Resum abans de publicar ---"
          for c in $CARPETES; do
            echo "$c: $(find $P/$c -type f 2>/dev/null | wc -l) fitxers"
          done
          echo "Run GFS:    $(grep -o '"run": *"[^"]*"' $P/gfsmaps/mapes.json 2>/dev/null | head -1)"
          echo "Run GFS NE: $(grep -o '"run": *"[^"]*"' $P/gfsESPmaps/mapes.json 2>/dev/null | head -1)"
          if [ -f "$P/selector.html" ]; then echo "selector.html present?: SI"; else echo "selector.html present?: NO"; fi

          # 3) Preparem el commit per a 'data'
          rm -rf /tmp/publish && mkdir -p /tmp/publish
          cp -r "$P/." /tmp/publish/
          cd /tmp/publish
          rm -rf .git
          git init -q
          git checkout -q -b data

          AFEGIT=0
          for c in $CARPETES; do
            if [ -n "$(find "$c" -type f 2>/dev/null)" ]; then
              git add "$c"; AFEGIT=1
            else
              echo "  ⚠️ $c buida, s'omet"
            fi
          done
          if [ -f js/status.js ]; then
            git add js/status.js; AFEGIT=1
          fi

          if [ "$AFEGIT" != "1" ]; then
            echo "❌ Res a publicar"; break
          fi

          git -c user.name="bot-dades" -c user.email="bot@tempestes-cat" \
              commit -q -m "gfs+ensembles $(date -u +'%Y-%m-%d %H:%M UTC')"
          git remote add origin "$REMOTE_URL"

          # 4) Comprovem que 'data' remota no ha canviat mentre treballàvem
          DATA_SHA_ARA=$(git ls-remote origin refs/heads/data | cut -f1)
          [ -z "$DATA_SHA_ARA" ] && DATA_SHA_ARA="none"

          if [ "$DATA_SHA_ABANS" != "$DATA_SHA_ARA" ]; then
            echo "⚠️  'data' ha canviat (altre workflow ha publicat). Reintentem amb dades fresques..."
            INTENT=$((INTENT + 1))
            sleep $((RANDOM % 10 + 5))
            continue
          fi

          if git push --force origin data; then
            echo "✅ Publicat a 'data' (intent $INTENT)"
            PUBLICAT=1
            break
          else
            echo "⚠️  Push fallit. Reintentem..."
            INTENT=$((INTENT + 1))
            sleep $((RANDOM % 10 + 5))
          fi
        done

        cd "$GITHUB_WORKSPACE"
        if [ "$PUBLICAT" != "1" ]; then
          echo "❌ No s'ha pogut publicar a 'data' després de $MAX_INTENTS intents"
          exit 1
        fi

    - name: Deploy a Cloudflare (des de l'estat final ja fusionat)
      run: |
        cd meu-mapa
        npm install -g wrangler
        wrangler pages deploy public --project-name=tempestes-cat --branch=main --commit-dirty=true
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    - name: Completat
      run: echo "✅ Deploy completat $(date -u)"