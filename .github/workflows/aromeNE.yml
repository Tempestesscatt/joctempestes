name: CAT + ONES + MSGPACK

on:
  workflow_dispatch:
  schedule:
    # AROME publica cada 3h (~00:20, 03:20, 06:20, 09:20, 12:20, 15:20, 18:20, 21:20 UTC)
    # Disparamos 30 min después de cada publicación, para dar margen.
    - cron: '50 0,3,6,9,12,15,18,21 * * *'

permissions:
  contents: write
  deployments: write

# MATEIX grup que el workflow GFS + ENSEMBLES: s'encuen en lloc de trepitjar-se
concurrency:
  group: deploy-data
  cancel-in-progress: false

jobs:
  # ════════════════════════════════════════════════════════════════
  #  JOB -1: CHECK
  # ════════════════════════════════════════════════════════════════
  check_schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
    - name: Gate - activa/desactiva el schedule intern
      id: gate
      run: |
        # true  -> el schedule intern SÍ s'executa
        # false -> el schedule intern NO s'executa (Cloudflare s'encarrega)
        # Els disparaments manuals SEMPRE s'executen.
        USE_INTERNAL_SCHEDULE=false

        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "Disparat manualment -> s'executa sempre"
          echo "should_run=true" >> "$GITHUB_OUTPUT"
        elif [ "$USE_INTERNAL_SCHEDULE" = "true" ]; then
          echo "Schedule intern ACTIU -> s'executa"
          echo "should_run=true" >> "$GITHUB_OUTPUT"
        else
          echo "Schedule intern DESACTIVAT -> NO s'executa"
          echo "should_run=false" >> "$GITHUB_OUTPUT"
        fi

  # ════════════════════════════════════════════════════════════════
  #  JOB 0: NETEJA
  # ════════════════════════════════════════════════════════════════
  neteja:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: check_schedule
    if: needs.check_schedule.outputs.should_run == 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Crear estructura de carpetes
      run: |
        mkdir -p meu-mapa/public/web_data_NE
        mkdir -p meu-mapa/public/webdata_waves
        mkdir -p meu-mapa/public/js
        mkdir -p meu-mapa/public/logs
        echo "Estructura de carpetes creada"

    - name: Executar borrar.py
      run: |
        cd private-scripts-new
        python3 borrar.py
      timeout-minutes: 5

    - name: Verificar carpetes netes
      run: |
        echo "--- web_data_NE ---"
        ls -la meu-mapa/public/web_data_NE/ 2>/dev/null || echo "buit"
        echo "--- webdata_waves ---"
        ls -la meu-mapa/public/webdata_waves/ 2>/dev/null || echo "buit"
        echo "✓ Neteja completada"

  # ════════════════════════════════════════════════════════════════
  #  JOB 1: SFC
  # ════════════════════════════════════════════════════════════════
  arome_sfc:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    needs: [check_schedule, neteja]
    if: needs.check_schedule.outputs.should_run == 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests tifffile scipy python-dotenv lxml xarray cfgrib meteofetch matplotlib msgpack
      continue-on-error: true

    - name: Netejar web_data_NE
      run: |
        mkdir -p meu-mapa/public/web_data_NE
        rm -rf meu-mapa/public/web_data_NE/*
        echo "web_data_NE netejat"

    - name: Executar arome_sfc.py
      run: |
        cd private-scripts-new
        python3 -c 'import json; cfg = json.load(open("configNE.json", "r", encoding="utf-8-sig")); cfg["api_key"] = "${{ secrets.AROME_API_KEY }}"; json.dump(cfg, open("configNE.json", "w", encoding="utf-8"), indent=2)'
        for i in 1 2 3; do
          echo "--- arome_sfc.py: intent $i/3 ---"
          python3 arome_sfc.py && echo "OK arome_sfc.py: exit a l'intent $i" && exit 0 || echo "ERROR arome_sfc.py: ha fallat (codi $?) a l'intent $i/3"
          sleep 30
        done
        echo "ERROR arome_sfc.py: tots els 3 intents han fallat." && exit 1
      timeout-minutes: 200

    - name: Mostrar log de arome_sfc.py si falla
      if: failure()
      run: |
        find . -name "*.log" -type f -exec cat {} \; 2>/dev/null || echo "No s'ha trobat cap log"

    - name: Pujar SFC com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: dades-sfc
        path: meu-mapa/public/web_data_NE/
        retention-days: 5

  # ════════════════════════════════════════════════════════════════
  #  JOB 2: 3D
  # ════════════════════════════════════════════════════════════════
  arome_3d:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    needs: [check_schedule, neteja]
    if: needs.check_schedule.outputs.should_run == 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests tifffile scipy python-dotenv lxml xarray cfgrib meteofetch matplotlib msgpack
      continue-on-error: true

    - name: Preparar web_data_NE (3d)
      run: |
        mkdir -p meu-mapa/public/web_data_NE
        echo "preparat"

    - name: Executar arome_3d.py
      run: |
        cd private-scripts-new
        python3 -c 'import json; cfg = json.load(open("configNE.json", "r", encoding="utf-8-sig")); cfg["api_key"] = "${{ secrets.AROME_API_KEY }}"; json.dump(cfg, open("configNE.json", "w", encoding="utf-8"), indent=2)'
        for i in 1 2 3; do
          echo "--- arome_3d.py: intent $i/3 ---"
          python3 arome_3d.py && echo "OK arome_3d.py: exit a l'intent $i" && exit 0 || echo "ERROR arome_3d.py: ha fallat (codi $?) a l'intent $i/3"
          sleep 30
        done
        echo "ERROR arome_3d.py: tots els 3 intents han fallat." && exit 1
      timeout-minutes: 200

    - name: Mostrar log de arome_3d.py si falla
      if: failure()
      run: |
        find . -name "*.log" -type f -exec cat {} \; 2>/dev/null || echo "No s'ha trobat cap log"

    - name: Pujar 3D com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: dades-3d
        path: meu-mapa/public/web_data_NE/
        retention-days: 5

  # ════════════════════════════════════════════════════════════════
  #  JOB 3: ONES
  # ════════════════════════════════════════════════════════════════
  ones:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [check_schedule, neteja]
    if: needs.check_schedule.outputs.should_run == 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests scipy python-dotenv lxml xarray cfgrib meteofetch matplotlib msgpack
      continue-on-error: true

    - name: Preparar sortida Ones
      run: |
        mkdir -p meu-mapa/public/webdata_waves
        echo "preparat"

    - name: Executar ones.py
      run: |
        cd private-scripts-new
        for i in 1 2 3; do
          echo "--- ones.py: intent $i/3 ---"
          python3 ones.py --total-hores 44 && echo "OK exit a l'intent $i" && exit 0 || echo "ERROR ha fallat (codi $?) a l'intent $i/3"
          sleep 30
        done
        echo "ERROR tots els 3 intents han fallat." && exit 1
      timeout-minutes: 110

    - name: Mostrar log si falla
      if: failure()
      run: |
        find meu-mapa/public/webdata_waves/logs -name "*.log" -type f -exec cat {} \; 2>/dev/null || echo "No s'ha trobat cap log"

    - name: Pujar Ones com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: dades-ones
        path: meu-mapa/public/webdata_waves/
        retention-days: 5

  # ════════════════════════════════════════════════════════════════
  #  JOB 4: STATUS
  # ════════════════════════════════════════════════════════════════
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check_schedule, arome_sfc, arome_3d, ones]
    if: always() && needs.check_schedule.outputs.should_run == 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies (bàsiques)
      run: python3 -m pip install --upgrade pip

    - name: Descarregar artifact - SFC
      if: needs.arome_sfc.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-sfc
        path: meu-mapa/public/web_data_NE/
      continue-on-error: true

    - name: Descarregar artifact - 3D
      if: needs.arome_3d.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-3d
        path: meu-mapa/public/web_data_NE/
      continue-on-error: true

    - name: Descarregar artifact - ONES
      if: needs.ones.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-ones
        path: meu-mapa/public/webdata_waves/
      continue-on-error: true

    - name: Executar status.py
      run: |
        cd private-scripts-new
        python3 status.py
      timeout-minutes: 5

    - name: Mostrar status.js generat
      run: cat meu-mapa/public/js/status.js 2>/dev/null || echo "No s'ha trobat status.js"

    - name: Pujar status.js com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: dades-status
        path: meu-mapa/public/js/status.js
        retention-days: 5

  # ════════════════════════════════════════════════════════════════
  #  JOB 5: MANIFEST
  # ════════════════════════════════════════════════════════════════
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check_schedule, status]
    if: always() && needs.check_schedule.outputs.should_run == 'true'
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Descarregar artifact - SFC
      if: needs.status.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-sfc
        path: meu-mapa/public/web_data_NE/
      continue-on-error: true

    - name: Descarregar artifact - 3D
      if: needs.status.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-3d
        path: meu-mapa/public/web_data_NE/
      continue-on-error: true

    - name: Executar generar_manifest.py
      run: |
        cd private-scripts-new
        python3 generar_manifest.py
      timeout-minutes: 5

    - name: Mostrar manifest.json generat
      run: cat meu-mapa/public/web_data_NE/manifest.json 2>/dev/null || echo "No s'ha trobat manifest.json"

    - name: Pujar manifest com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: dades-manifest
        path: meu-mapa/public/web_data_NE/manifest.json
        retention-days: 5

  # ════════════════════════════════════════════════════════════════
  #  JOB FINAL: deploy — robust: relectura fresca de 'data' + reintents
  #  + PROTECCIÓ dels fitxers estàtics (selector.html, index.html, etc.)
  # ════════════════════════════════════════════════════════════════
  deploy:
    needs: [check_schedule, arome_sfc, arome_3d, ones, status, manifest]
    if: always() && needs.check_schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}
        fetch-depth: 0

    - name: Resultat dels jobs anteriors
      run: |
        echo "sfc:      ${{ needs.arome_sfc.result }}"
        echo "3d:       ${{ needs.arome_3d.result }}"
        echo "ones:     ${{ needs.ones.result }}"
        echo "status:   ${{ needs.status.result }}"
        echo "manifest: ${{ needs.manifest.result }}"

    # Baixem els artifacts a /tmp (NO toquem encara public/)
    - name: Descarregar artifact - SFC
      if: needs.arome_sfc.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-sfc
        path: /tmp/nou-sfc
      continue-on-error: true

    - name: Descarregar artifact - 3D
      if: needs.arome_3d.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-3d
        path: /tmp/nou-3d
      continue-on-error: true

    - name: Descarregar artifact - ONES
      if: needs.ones.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-ones
        path: /tmp/nou-ones
      continue-on-error: true

    - name: Descarregar artifact - STATUS
      if: needs.status.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-status
        path: /tmp/nou-status
      continue-on-error: true

    - name: Descarregar artifact - MANIFEST
      if: needs.manifest.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-manifest
        path: /tmp/nou-manifest
      continue-on-error: true

    # ── Fusionar amb 'data' FRESCA i publicar, amb reintents anti-cursa ──
    - name: 🔒 Fusionar i publicar a 'data' (reintents anti-cursa + estàtics protegits)
      run: |
        set -e
        P="$GITHUB_WORKSPACE/meu-mapa/public"
        MAX_INTENTS=5
        INTENT=1
        PUBLICAT=0

        while [ $INTENT -le $MAX_INTENTS ]; do
          echo "=== Intent $INTENT/$MAX_INTENTS ==="

          # 1) Llegim 'data' EN FRESC
          cd "$GITHUB_WORKSPACE"
          git fetch origin data || echo "⚠️ No existeix 'data' encara"
          DATA_SHA_ABANS=$(git rev-parse origin/data 2>/dev/null || echo "none")

          # ── PROTECCIÓ ESTÀTICS: guardem TOT el que ja hi ha a public/ ──
          #    (ve del checkout de main: selector.html, index.html, css/, etc.)
          #    abans de destruir-lo, EXCEPTE les carpetes que gestiona 'data'.
          #    Així qualsevol fitxer estàtic, present o futur, queda protegit
          #    sense haver de llistar-lo a mà.
          CARPETES_DADES="web_data_NE webdata_waves avis previsions_catalunya gfsmaps gfsESPmaps"
          rm -rf /tmp/estatic-base
          mkdir -p /tmp/estatic-base
          if [ -d "$P" ]; then
            cp -r "$P"/. /tmp/estatic-base/
            for c in $CARPETES_DADES; do
              rm -rf "/tmp/estatic-base/$c"
            done
            rm -f /tmp/estatic-base/js/status.js
          fi
          echo "--- Fitxers/carpetes estàtics protegits en aquest intent ---"
          find /tmp/estatic-base -maxdepth 1
          # ── FI PROTECCIÓ ESTÀTICS ──

          rm -rf /tmp/data-branch
          rm -rf "$P"
          mkdir -p "$P/web_data_NE" "$P/webdata_waves" "$P/js" "$P/avis" \
                   "$P/previsions_catalunya" "$P/gfsmaps" "$P/gfsESPmaps"

          # ── PROTECCIÓ ESTÀTICS: restaurem ABANS de fusionar amb 'data' ──
          cp -r /tmp/estatic-base/. "$P/"
          # ── FI PROTECCIÓ ESTÀTICS ──

          if [ "$DATA_SHA_ABANS" != "none" ]; then
            git worktree add -f /tmp/data-branch origin/data
            # Base: TOT el que hi ha a 'data' (inclou el que NO genera aquest workflow)
            for c in web_data_NE webdata_waves avis previsions_catalunya gfsmaps gfsESPmaps; do
              cp -r /tmp/data-branch/$c/. "$P/$c/" 2>/dev/null || echo "  ⚠️ $c no trobat a data"
            done
            cp /tmp/data-branch/js/status.js "$P/js/status.js" 2>/dev/null || true
            git worktree remove /tmp/data-branch --force
          fi

          # 2) Sobreescrivim NOMÉS el que aquest workflow ha generat de nou
          #    web_data_NE: es substitueix sencer (SFC + 3D + manifest)
          if [ -d /tmp/nou-sfc ] || [ -d /tmp/nou-3d ]; then
            rm -rf "$P/web_data_NE"; mkdir -p "$P/web_data_NE"
            [ -d /tmp/nou-sfc ] && cp -r /tmp/nou-sfc/. "$P/web_data_NE/"
            [ -d /tmp/nou-3d ] && cp -r /tmp/nou-3d/. "$P/web_data_NE/"
            echo "  ↳ web_data_NE: substituït pel nou run"
          fi
          if [ -d /tmp/nou-manifest ]; then
            cp /tmp/nou-manifest/manifest.json "$P/web_data_NE/manifest.json" 2>/dev/null || true
          fi
          if [ -d /tmp/nou-ones ] && [ -n "$(ls -A /tmp/nou-ones 2>/dev/null)" ]; then
            rm -rf "$P/webdata_waves"; mkdir -p "$P/webdata_waves"
            cp -r /tmp/nou-ones/. "$P/webdata_waves/"
            echo "  ↳ webdata_waves: substituït pel nou run"
          fi
          if [ -f /tmp/nou-status/status.js ]; then
            cp /tmp/nou-status/status.js "$P/js/status.js"
            echo "  ↳ status.js: actualitzat"
          fi

          echo "--- Resum abans de publicar ---"
          echo "web_data_NE:  $(find $P/web_data_NE -type f 2>/dev/null | wc -l) fitxers"
          echo "webdata_waves: $(find $P/webdata_waves -type f 2>/dev/null | wc -l) fitxers"
          echo "avis:         $(find $P/avis -type f 2>/dev/null | wc -l) fitxers"
          echo "previsions:   $(find $P/previsions_catalunya -name '*.png' 2>/dev/null | wc -l) PNG"
          echo "gfsmaps:      $(find $P/gfsmaps -name '*.png' 2>/dev/null | wc -l) PNG"
          echo "gfsESPmaps:   $(find $P/gfsESPmaps -name '*.png' 2>/dev/null | wc -l) PNG"
          if [ -f "$P/selector.html" ]; then echo "selector.html present?: SI"; else echo "selector.html present?: NO"; fi

          # 3) Preparem el commit per a 'data'
          rm -rf /tmp/publish && mkdir -p /tmp/publish
          cp -r "$P/." /tmp/publish/
          cd /tmp/publish
          rm -rf .git
          git init -q
          git checkout -q -b data

          AFEGIT=0
          for c in web_data_NE webdata_waves avis previsions_catalunya gfsmaps gfsESPmaps; do
            if [ -n "$(find "$c" -type f 2>/dev/null)" ]; then
              git add "$c"; AFEGIT=1
            else
              echo "  ⚠️ $c buida, s'omet"
            fi
          done
          [ -f js/status.js ] && { git add js/status.js; AFEGIT=1; }

          if [ "$AFEGIT" != "1" ]; then
            echo "❌ Res a publicar"; break
          fi

          git -c user.name="bot-dades" -c user.email="bot@tempestes-cat" \
              commit -q -m "dades $(date -u +'%Y-%m-%d %H:%M UTC')"

          REMOTE_URL="https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/joctempestes.git"
          git remote add origin "$REMOTE_URL"

          # 4) Comprovem que 'data' remota no ha canviat mentre treballàvem
          DATA_SHA_ARA=$(git ls-remote origin data | cut -f1)
          [ -z "$DATA_SHA_ARA" ] && DATA_SHA_ARA="none"

          if [ "$DATA_SHA_ABANS" != "$DATA_SHA_ARA" ]; then
            echo "⚠️  'data' ha canviat (altre workflow ha publicat). Reintentem amb dades fresques..."
            INTENT=$((INTENT + 1))
            sleep $((RANDOM % 10 + 5))
            continue
          fi

          if git push --force origin data; then
            echo "✅ Publicat a 'data' (intent $INTENT)"
            PUBLICAT=1
            break
          else
            echo "⚠️  Push fallit. Reintentem..."
            INTENT=$((INTENT + 1))
            sleep $((RANDOM % 10 + 5))
          fi
        done

        if [ "$PUBLICAT" != "1" ]; then
          echo "❌ No s'ha pogut publicar a 'data' després de $MAX_INTENTS intents"
          exit 1
        fi

    - name: Comprovar mida de fitxers (limit 25 MiB de Cloudflare Pages)
      run: |
        find meu-mapa/public -type f -size +25M -exec ls -lh {} \; || true
        echo "Comprovació de mida acabada"

    - name: Deploy a Cloudflare (amb l'estat final ja fusionat)
      run: |
        cd meu-mapa
        npm install -g wrangler
        wrangler pages deploy public --project-name=tempestes-cat --branch=main --commit-dirty=true
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    - name: Completat
      run: |
        echo "============================================"
        echo "  ✅ TOT COMPLETAT (sfc + 3d + ones + status + manifest)"
        echo "  Dades fusionades amb 'data' i desplegades a Cloudflare"
        echo "  Hora: $(date -u)"
        echo "============================================"