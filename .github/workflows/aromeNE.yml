name: CAT + ONES + MSGPACK

on:
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  # ════════════════════════════════════════════════════════════════
  #  JOB 0: NETEJA - Borra carpetes abans de començar
  # ════════════════════════════════════════════════════════════════
  neteja:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Crear estructura de carpetes
      run: |
        mkdir -p meu-mapa/public/web_data_NE
        mkdir -p meu-mapa/public/web_data_ones
        mkdir -p meu-mapa/public/js
        mkdir -p meu-mapa/public/logs
        echo "Estructura de carpetes creada"

    - name: Executar borrar.py
      run: |
        cd private-scripts-new
        python3 borrar.py
      timeout-minutes: 5

    - name: Verificar carpetes netes
      run: |
        echo "=== Estat de les carpetes després de la neteja ==="
        echo "--- web_data_NE ---"
        ls -la meu-mapa/public/web_data_NE/ 2>/dev/null || echo "buit"
        echo "--- web_data_ones ---"
        ls -la meu-mapa/public/web_data_ones/ 2>/dev/null || echo "buit"
        echo "--- logs ---"
        ls -la meu-mapa/public/logs/ 2>/dev/null || echo "buit"
        echo "✓ Neteja completada"

  # ════════════════════════════════════════════════════════════════
  #  JOB 1: SFC (arome_sfc.py)
  # ════════════════════════════════════════════════════════════════
  arome_sfc:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    needs: neteja
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests tifffile scipy python-dotenv lxml xarray cfgrib meteofetch matplotlib msgpack
      continue-on-error: true

    - name: Netejar web_data_NE
      run: |
        mkdir -p meu-mapa/public/web_data_NE
        rm -rf meu-mapa/public/web_data_NE/*
        echo "web_data_NE netejat"

    - name: Executar arome_sfc.py
      run: |
        cd private-scripts-new
        python3 -c 'import json; cfg = json.load(open("configNE.json", "r", encoding="utf-8-sig")); cfg["api_key"] = "${{ secrets.AROME_API_KEY }}"; json.dump(cfg, open("configNE.json", "w", encoding="utf-8"), indent=2)'
        for i in 1 2 3; do
          echo "--- arome_sfc.py: intent $i/3 ---"
          python3 arome_sfc.py && echo "OK arome_sfc.py: exit a l'intent $i" && exit 0 || echo "ERROR arome_sfc.py: ha fallat (codi $?) a l'intent $i/3"
          sleep 30
        done
        echo "ERROR arome_sfc.py: tots els 3 intents han fallat." && exit 1
      timeout-minutes: 200

    - name: Mostrar log de arome_sfc.py si falla
      if: failure()
      run: |
        echo "=== LOG DE AROME_SFC.PY ==="
        find . -name "*.log" -type f -exec cat {} \; 2>/dev/null || echo "No s'ha trobat cap log"

    - name: Pujar SFC com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: dades-sfc
        path: meu-mapa/public/web_data_NE/
        retention-days: 1

  # ════════════════════════════════════════════════════════════════
  #  JOB 2: 3D (arome_3d.py)
  # ════════════════════════════════════════════════════════════════
  arome_3d:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    needs: neteja
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests tifffile scipy python-dotenv lxml xarray cfgrib meteofetch matplotlib msgpack
      continue-on-error: true

    - name: Netejar web_data_NE (3d)
      run: |
        mkdir -p meu-mapa/public/web_data_NE
        echo "preparat"

    - name: Executar arome_3d.py
      run: |
        cd private-scripts-new
        python3 -c 'import json; cfg = json.load(open("configNE.json", "r", encoding="utf-8-sig")); cfg["api_key"] = "${{ secrets.AROME_API_KEY }}"; json.dump(cfg, open("configNE.json", "w", encoding="utf-8"), indent=2)'
        for i in 1 2 3; do
          echo "--- arome_3d.py: intent $i/3 ---"
          python3 arome_3d.py && echo "OK arome_3d.py: exit a l'intent $i" && exit 0 || echo "ERROR arome_3d.py: ha fallat (codi $?) a l'intent $i/3"
          sleep 30
        done
        echo "ERROR arome_3d.py: tots els 3 intents han fallat." && exit 1
      timeout-minutes: 200

    - name: Mostrar log de arome_3d.py si falla
      if: failure()
      run: |
        echo "=== LOG DE AROME_3D.PY ==="
        find . -name "*.log" -type f -exec cat {} \; 2>/dev/null || echo "No s'ha trobat cap log"

    - name: Pujar 3D com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: dades-3d
        path: meu-mapa/public/web_data_NE/
        retention-days: 1

  # ════════════════════════════════════════════════════════════════
  #  JOB 3: ONES (ones.py)
  # ════════════════════════════════════════════════════════════════
  ones:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: neteja
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests scipy python-dotenv lxml xarray cfgrib meteofetch matplotlib msgpack
      continue-on-error: true

    - name: Netejar sortida Ones
      run: |
        mkdir -p meu-mapa/public/web_data_ones
        echo "preparat"

    - name: Executar ones.py
      run: |
        cd private-scripts-new
        for i in 1 2 3; do
          echo "--- ones.py: intent $i/3 ---"
          python3 ones.py --total-hores 44 && echo "OK exit a l'intent $i" && exit 0 || echo "ERROR ha fallat (codi $?) a l'intent $i/3"
          sleep 30
        done
        echo "ERROR tots els 3 intents han fallat." && exit 1
      timeout-minutes: 110

    - name: Mostrar log si falla
      if: failure()
      run: |
        find . -name "*ones*.log" -type f -exec cat {} \; 2>/dev/null || echo "No s'ha trobat cap log"

    - name: Pujar Ones com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: dades-ones
        path: meu-mapa/public/web_data_ones/
        retention-days: 1

  # ════════════════════════════════════════════════════════════════
  #  JOB 4: STATUS (status.py) - GENERA status.js
  # ════════════════════════════════════════════════════════════════
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [arome_sfc, arome_3d, ones]
    if: always()
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies (bàsiques)
      run: |
        python3 -m pip install --upgrade pip
        # status.py només necessita Python estàndard

    - name: Descarregar artifact - SFC (per si cal)
      if: needs.arome_sfc.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-sfc
        path: meu-mapa/public/web_data_NE/
      continue-on-error: true

    - name: Descarregar artifact - 3D (per si cal)
      if: needs.arome_3d.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-3d
        path: meu-mapa/public/web_data_NE/
      continue-on-error: true

    - name: Descarregar artifact - ONES (per si cal)
      if: needs.ones.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-ones
        path: meu-mapa/public/web_data_ones/
      continue-on-error: true

    - name: Executar status.py
      run: |
        cd private-scripts-new
        python3 status.py
      timeout-minutes: 5

    - name: Mostrar status.js generat
      run: |
        echo "=== status.js generat ==="
        cat meu-mapa/public/js/status.js 2>/dev/null || echo "No s'ha trobat status.js"

    - name: Pujar status.js com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: dades-status
        path: meu-mapa/public/js/status.js
        retention-days: 1

  # ════════════════════════════════════════════════════════════════
  #  JOB FINAL: deploy
  # ════════════════════════════════════════════════════════════════
  deploy:
    needs: [arome_sfc, arome_3d, ones, status]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCRIPTS_FALLITS: ""

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Comprovar resultat dels jobs anteriors
      run: |
        FALLITS=""
        if [ "${{ needs.arome_sfc.result }}" != "success" ]; then FALLITS="$FALLITS sfc"; fi
        if [ "${{ needs.arome_3d.result }}" != "success" ]; then FALLITS="$FALLITS 3d"; fi
        if [ "${{ needs.ones.result }}" != "success" ]; then FALLITS="$FALLITS ones"; fi
        if [ "${{ needs.status.result }}" != "success" ]; then FALLITS="$FALLITS status"; fi
        if [ -n "$FALLITS" ]; then
          echo "ATTENCIO: Jobs que NO han acabat en exit:$FALLITS (es continua igualment)"
          echo "SCRIPTS_FALLITS=$FALLITS" >> "$GITHUB_ENV"
        else
          echo "OK Tots els jobs han acabat en exit"
        fi

    - name: Descarregar artifact - SFC
      if: needs.arome_sfc.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-sfc
        path: meu-mapa/public/web_data_NE/
      continue-on-error: true

    - name: Descarregar artifact - 3D
      if: needs.arome_3d.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-3d
        path: meu-mapa/public/web_data_NE/
      continue-on-error: true

    - name: Descarregar artifact - ONES
      if: needs.ones.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-ones
        path: meu-mapa/public/web_data_ones/
      continue-on-error: true

    - name: Descarregar artifact - STATUS
      if: needs.status.result == 'success'
      uses: actions/download-artifact@v4
      with:
        name: dades-status
        path: meu-mapa/public/js/
      continue-on-error: true

    - name: Comprovar mida de fitxers (limit 25 MiB de Cloudflare Pages)
      run: |
        echo "Fitxers per sobre de 25 MiB a tot public/ (fallarien el deploy):"
        find meu-mapa/public -type f -size +25M -exec ls -lh {} \; || echo "Cap fitxer supera el limit OK"

    - name: Dades generades (resum)
      run: |
        cd meu-mapa
        echo "Dades meteorologiques generades correctament."
        echo "--- web_data_NE (sfc + 3d) ---"
        ls public/web_data_NE/ 2>/dev/null | wc -l || echo "buit"
        echo "--- web_data_ones ---"
        ls public/web_data_ones/ 2>/dev/null | wc -l || echo "buit"
        echo "--- status.js ---"
        ls -la public/js/status.js 2>/dev/null || echo "No existeix"
        echo "Pes total: $(du -sh public 2>/dev/null | cut -f1)"

    - name: Deploy a Cloudflare
      run: |
        cd meu-mapa
        npm install -g wrangler
        wrangler pages deploy public --project-name=tempestes-cat --branch=main --commit-dirty=true
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    - name: Comprovar si algun job ha fallat
      run: |
        FALLITS="${{ env.SCRIPTS_FALLITS }}"
        if [ "$FALLITS" = " sfc 3d ones status" ] || [ "$FALLITS" = " 3d sfc ones status" ] || [ "$FALLITS" = " ones sfc 3d status" ]; then
          echo "ERROR: Tots els jobs han fallat ($FALLITS)"
          exit 1
        elif [ -n "$FALLITS" ]; then
          echo "AVIS: Algun job ha fallat:$FALLITS (es continua)"
        else
          echo "OK Tots els jobs han acabat en exit"
        fi

    - name: Completat
      run: |
        echo "============================================"
        echo "  OK TOT COMPLETAT (sfc + 3d + ones + status)!"
        echo "  Dades desplegades a Cloudflare Pages"
        echo "  status.js generat correctament"
        echo "============================================"