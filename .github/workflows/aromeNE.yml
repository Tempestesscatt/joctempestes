name: CAT + ONES + MSGPACK + MANIFEST

on:
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  # ════════════════════════════════════════════════════════════════
  #  JOB 0: NETEJA
  # ════════════════════════════════════════════════════════════════
  neteja:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Crear estructura de carpetes
      run: |
        mkdir -p meu-mapa/public/web_data_NE
        mkdir -p meu-mapa/public/webdata_waves
        mkdir -p meu-mapa/public/js
        mkdir -p meu-mapa/public/logs
        echo "Estructura de carpetes creada"

    - name: Executar borrar.py
      run: |
        cd private-scripts-new
        python3 borrar.py
      timeout-minutes: 5

    - name: Verificar carpetes netes
      run: |
        echo "=== Estat de les carpetes després de la neteja ==="
        echo "--- web_data_NE ---"
        ls -la meu-mapa/public/web_data_NE/ 2>/dev/null || echo "buit"
        echo "--- webdata_waves ---"
        ls -la meu-mapa/public/webdata_waves/ 2>/dev/null || echo "buit"
        echo "--- logs ---"
        ls -la meu-mapa/public/logs/ 2>/dev/null || echo "buit"
        echo "✓ Neteja completada"

  # ════════════════════════════════════════════════════════════════
  #  JOB 1: SFC + 3D + ONES (TOTS EN PARAL·LEL DINS DEL MATEIX JOB)
  # ════════════════════════════════════════════════════════════════
  dades:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    needs: neteja
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --upgrade pip
        python3 -m pip install numpy requests tifffile scipy python-dotenv lxml xarray cfgrib meteofetch matplotlib msgpack
      continue-on-error: true

    - name: Netejar web_data_NE
      run: |
        mkdir -p meu-mapa/public/web_data_NE
        rm -rf meu-mapa/public/web_data_NE/*
        echo "web_data_NE netejat"

    - name: Netejar webdata_waves
      run: |
        mkdir -p meu-mapa/public/webdata_waves
        rm -rf meu-mapa/public/webdata_waves/*
        echo "webdata_waves netejat"

    - name: Executar SFC + 3D + ONES en paral·lel
      id: executa_dades
      run: |
        cd private-scripts-new
        
        # Configurar API key
        python3 -c 'import json; cfg = json.load(open("configNE.json", "r", encoding="utf-8-sig")); cfg["api_key"] = "${{ secrets.AROME_API_KEY }}"; json.dump(cfg, open("configNE.json", "w", encoding="utf-8"), indent=2)'
        
        # Llançar els 3 scripts en paral·lel
        echo "🚀 Iniciant SFC, 3D i ONES en paral·lel..."
        
        python3 arome_sfc.py > /tmp/sfc.log 2>&1 &
        PID_SFC=$!
        
        python3 arome_3d.py > /tmp/3d.log 2>&1 &
        PID_3D=$!
        
        python3 ones.py --total-hores 44 > /tmp/ones.log 2>&1 &
        PID_ONES=$!
        
        echo "📊 SFC (PID $PID_SFC) | 3D (PID $PID_3D) | ONES (PID $PID_ONES)"
        
        # Esperar que acabin tots
        wait $PID_SFC
        EXIT_SFC=$?
        
        wait $PID_3D
        EXIT_3D=$?
        
        wait $PID_ONES
        EXIT_ONES=$?
        
        echo ""
        echo "════════════════════════════════════════════════════════════╗"
        echo "  📋 RESULTATS:"
        echo "    SFC:  $([ $EXIT_SFC -eq 0 ] && echo '✅ OK' || echo '❌ FALLAT (codi $EXIT_SFC)')"
        echo "    3D:   $([ $EXIT_3D -eq 0 ] && echo '✅ OK' || echo '❌ FALLAT (codi $EXIT_3D)')"
        echo "    ONES: $([ $EXIT_ONES -eq 0 ] && echo '✅ OK' || echo '⚠️ FALLAT (codi $EXIT_ONES) - OPCIONAL')"
        echo "╚═══════════════════════════════════════════════════════════╝"
        
        # Mostrar logs si fallen
        if [ $EXIT_SFC -ne 0 ]; then
          echo "=== LOG SFC (últimes 50 línees) ==="
          tail -50 /tmp/sfc.log
        fi
        if [ $EXIT_3D -ne 0 ]; then
          echo "=== LOG 3D (últimes 50 línees) ==="
          tail -50 /tmp/3d.log
        fi
        if [ $EXIT_ONES -ne 0 ]; then
          echo "=== LOG ONES (últimes 50 línees) ==="
          tail -50 /tmp/ones.log
        fi
        
        # Guardar l'estat com a output
        echo "exit_sfc=$EXIT_SFC" >> $GITHUB_OUTPUT
        echo "exit_3d=$EXIT_3D" >> $GITHUB_OUTPUT
        echo "exit_ones=$EXIT_ONES" >> $GITHUB_OUTPUT
        
        # Si SFC o 3D fallen, marcar perquè no es faci deploy
        if [ $EXIT_SFC -ne 0 ] || [ $EXIT_3D -ne 0 ]; then
          echo "deploy_disabled=true" >> $GITHUB_OUTPUT
          echo "❌ SFC o 3D han fallat - NO es farà deploy"
          exit 1
        else
          echo "deploy_disabled=false" >> $GITHUB_OUTPUT
          echo "✅ SFC i 3D han anat bé"
        fi
      timeout-minutes: 240

    - name: Pujar SFC com a artifact (sempre)
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: dades-sfc
        path: meu-mapa/public/web_data_NE/
        retention-days: 5

    - name: Pujar 3D com a artifact (sempre)
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: dades-3d
        path: meu-mapa/public/web_data_NE/
        retention-days: 5

    - name: Pujar ONES com a artifact (sempre)
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: dades-ones
        path: meu-mapa/public/webdata_waves/
        retention-days: 5

  # ════════════════════════════════════════════════════════════════
  #  JOB 2: STATUS (status.py) - SEMPRE S'EXECUTA
  # ════════════════════════════════════════════════════════════════
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: dades
    if: always()
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies (bàsiques)
      run: |
        python3 -m pip install --upgrade pip

    - name: Descarregar artifact - SFC (si existeix)
      uses: actions/download-artifact@v4
      with:
        name: dades-sfc
        path: meu-mapa/public/web_data_NE/
      continue-on-error: true

    - name: Descarregar artifact - 3D (si existeix)
      uses: actions/download-artifact@v4
      with:
        name: dades-3d
        path: meu-mapa/public/web_data_NE/
      continue-on-error: true

    - name: Descarregar artifact - ONES (si existeix)
      uses: actions/download-artifact@v4
      with:
        name: dades-ones
        path: meu-mapa/public/webdata_waves/
      continue-on-error: true

    - name: Executar status.py
      run: |
        cd private-scripts-new
        python3 status.py
      timeout-minutes: 5
      continue-on-error: true

    - name: Mostrar status.js generat
      run: |
        echo "=== status.js generat ==="
        cat meu-mapa/public/js/status.js 2>/dev/null || echo "No s'ha trobat status.js"

    - name: Pujar status.js com a artifact
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: dades-status
        path: meu-mapa/public/js/status.js
        retention-days: 5

  # ════════════════════════════════════════════════════════════════
  #  JOB 3: GENERAR MANIFEST.json - SEMPRE S'EXECUTA
  # ════════════════════════════════════════════════════════════════
  generar_manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [dades, status]
    if: always()
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Clonar private-scripts
      run: |
        rm -rf private-scripts-new
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Descarregar artifact - SFC (si existeix)
      uses: actions/download-artifact@v4
      with:
        name: dades-sfc
        path: meu-mapa/public/web_data_NE/
      continue-on-error: true

    - name: Descarregar artifact - 3D (si existeix)
      uses: actions/download-artifact@v4
      with:
        name: dades-3d
        path: meu-mapa/public/web_data_NE/
      continue-on-error: true

    - name: Descarregar artifact - ONES (si existeix)
      uses: actions/download-artifact@v4
      with:
        name: dades-ones
        path: meu-mapa/public/webdata_waves/
      continue-on-error: true

    - name: Descarregar artifact - STATUS (si existeix)
      uses: actions/download-artifact@v4
      with:
        name: dades-status
        path: meu-mapa/public/js/
      continue-on-error: true

    - name: Executar generar_manifest.py
      run: |
        cd private-scripts-new
        python3 generar_manifest.py
      timeout-minutes: 5
      continue-on-error: true

    - name: Mostrar manifest.json generat
      run: |
        echo "=== manifest.json generat ==="
        cat meu-mapa/public/web_data_NE/manifest.json 2>/dev/null || echo "No s'ha trobat manifest.json"
        echo ""
        echo "=== Contingut de web_data_NE ==="
        ls -la meu-mapa/public/web_data_NE/ 2>/dev/null | head -20

    - name: Pujar manifest.json com a artifact
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: dades-manifest
        path: meu-mapa/public/web_data_NE/manifest.json
        retention-days: 5

  # ════════════════════════════════════════════════════════════════
  #  JOB FINAL: DEPLOY - NOMÉS SI DADES HA ANAT BÉ
  # ════════════════════════════════════════════════════════════════
  deploy:
    needs: [dades, status, generar_manifest]
    if: needs.dades.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}

    - name: Comprovar resultat de STATUS i MANIFEST (opcionals)
      run: |
        if [ "${{ needs.status.result }}" != "success" ]; then
          echo "⚠️ STATUS ha fallat (opcional - es continua)"
        else
          echo "✅ STATUS OK"
        fi
        if [ "${{ needs.generar_manifest.result }}" != "success" ]; then
          echo "⚠️ generar_manifest ha fallat (opcional - es continua)"
        else
          echo "✅ MANIFEST OK"
        fi

    - name: Descarregar artifact - SFC
      uses: actions/download-artifact@v4
      with:
        name: dades-sfc
        path: meu-mapa/public/web_data_NE/

    - name: Descarregar artifact - 3D
      uses: actions/download-artifact@v4
      with:
        name: dades-3d
        path: meu-mapa/public/web_data_NE/

    - name: Descarregar artifact - ONES (si existeix)
      uses: actions/download-artifact@v4
      with:
        name: dades-ones
        path: meu-mapa/public/webdata_waves/
      continue-on-error: true

    - name: Descarregar artifact - STATUS (si existeix)
      uses: actions/download-artifact@v4
      with:
        name: dades-status
        path: meu-mapa/public/js/
      continue-on-error: true

    - name: Descarregar artifact - MANIFEST (si existeix)
      uses: actions/download-artifact@v4
      with:
        name: dades-manifest
        path: meu-mapa/public/web_data_NE/
      continue-on-error: true

    - name: Verificar SFC existeix
      run: |
        if [ -n "$(find meu-mapa/public/web_data_NE -name 'sfc_*.msgpack.gz' 2>/dev/null | head -1)" ]; then
          echo "✅ SFC trobat"
        else
          echo "❌ No hi ha fitxers SFC - Abortant!"
          exit 1
        fi

    - name: Dades generades (resum)
      run: |
        cd meu-mapa
        echo "Dades meteorologiques generades correctament."
        echo "--- web_data_NE (sfc + 3d) ---"
        ls public/web_data_NE/ 2>/dev/null | wc -l || echo "buit"
        echo "--- webdata_waves ---"
        ls public/webdata_waves/ 2>/dev/null | wc -l || echo "buit"
        echo "--- status.js ---"
        ls -la public/js/status.js 2>/dev/null || echo "No existeix"
        echo "--- manifest.json ---"
        ls -la public/web_data_NE/manifest.json 2>/dev/null || echo "No existeix"
        echo "Pes total: $(du -sh public 2>/dev/null | cut -f1)"

    - name: Deploy a Cloudflare
      run: |
        cd meu-mapa
        npm install -g wrangler
        wrangler pages deploy public --project-name=tempestes-cat --branch=main --commit-dirty=true
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    - name: Publicar dades a la branca 'data'
      run: |
        cd meu-mapa/public
        mkdir -p web_data_NE webdata_waves js
        rm -rf .git
        git init -q
        git checkout -q -b data

        AFEGIT=0
        for carpeta in web_data_NE webdata_waves; do
          if [ -n "$(find "$carpeta" -type f 2>/dev/null)" ]; then
            git add "$carpeta"
            AFEGIT=1
          else
            echo "⚠️  $carpeta buida o inexistent, s'omet"
          fi
        done
        if [ -f js/status.js ]; then
          git add js/status.js
          AFEGIT=1
        else
          echo "⚠️  js/status.js no existeix, s'omet"
        fi

        if [ "$AFEGIT" = "1" ]; then
          git -c user.name="bot-dades" -c user.email="bot@tempestes-cat" commit -q -m "dades $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force "https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/joctempestes.git" data
          echo "✅ Dades publicades a la branca 'data'"
        else
          echo "❌ Cap dada disponible per publicar, s'omet el push"
        fi
      continue-on-error: true

    - name: Completat
      run: |
        echo "============================================"
        echo "  ✅ TOT COMPLETAT!"
        echo "  SFC + 3D + ONES (paral·lel) → STATUS → MANIFEST → DEPLOY"
        echo "  Dades desplegades a Cloudflare Pages"
        echo "  Dades publicades a la branca 'data'"
        echo "============================================"