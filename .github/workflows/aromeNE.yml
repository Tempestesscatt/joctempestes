name: AROME PNG (SFC + 3D)

# Només s'executa quan el dispara el worker de Cloudflare (o a mà amb "Run workflow").
# Sense cron intern, així no es pot executar dues vegades alhora.
on:
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

# Mateix grup que els altres workflows: s'encuen i no es trepitgen
concurrency:
  group: deploy-data
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Carpetes dinàmiques de la web (gestionades per diferents workflows).
  # AROME només substitueix web_data_NE; la resta es conserven tal com són a 'data'.
  CARPETES: "web_data_NE webdata_waves avis gfsmaps gfsESPmaps previsions_catalunya web_data_GFS"
  # "1" = esborra les isolínies 3D abans de publicar (≈2.900 fitxers menys => deploy més ràpid).
  # Al visor les isolínies vénen desactivades per defecte.
  ELIMINAR_ISOLINIES_3D: "0"

jobs:
  # ════════════════════════════════════════════════════════════════
  #  JOB 1 (paral·lel): SFC + OUTLOOKS -> PNG
  # ════════════════════════════════════════════════════════════════
  png_sfc:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      IMATGES_DIR: ${{ github.workspace }}/out-sfc/imatges
    steps:
    - name: Clonar private-scripts
      run: |
        for i in 1 2 3 4; do
          rm -rf private-scripts-new
          if git clone --depth 1 "https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git" private-scripts-new; then break; fi
          [ "$i" = 4 ] && { echo "No s'ha pogut clonar private-scripts"; exit 1; }
          sleep 15
        done

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        for i in 1 2 3; do
          sudo apt-get update -qq && sudo apt-get install -y -qq libgeos-dev libproj-dev proj-data proj-bin && break
          sleep 15
        done
        python3 -m pip install --retries 5 --upgrade pip
        python3 -m pip install --retries 5 numpy requests tifffile scipy xarray cfgrib eccodes meteofetch matplotlib pillow shapely pyproj cartopy

    - name: Preparar els scripts (rutes de sortida i clau)
      run: |
        mkdir -p "$IMATGES_DIR"
        cd private-scripts-new

        # SFC principal
        sed -i -E 's|^IMATGES_DIR = .*|IMATGES_DIR = Path(os.environ["IMATGES_DIR"])|' arome_sfc_png.py
        grep -q 'os.environ\["IMATGES_DIR"\]' arome_sfc_png.py || { echo "No s'ha pogut canviar IMATGES_DIR a arome_sfc_png.py"; exit 1; }

        # OUTLOOKS: mateixa carpeta que SFC
        sed -i -E 's|^IMATGES_DIR = .*|IMATGES_DIR = Path(os.environ["IMATGES_DIR"])|' outbrakpngs.py
        grep -q 'os.environ\["IMATGES_DIR"\]' outbrakpngs.py || { echo "No s'ha pogut canviar IMATGES_DIR a outbrakpngs.py"; exit 1; }

        python3 -c 'import json; cfg = json.load(open("configNE.json", "r", encoding="utf-8-sig")); cfg["api_key"] = "${{ secrets.AROME_API_KEY }}"; json.dump(cfg, open("configNE.json", "w", encoding="utf-8"), indent=2)'

    - name: Executar arome_sfc_png.py (3 intents)
      timeout-minutes: 345
      run: |
        # IMPORTANT: GitHub executa "bash -e". Sense "set +e" un error de Python
        # aturava el pas a l'instant i els reintents mai s'executaven.
        set +e
        cd private-scripts-new
        OK=0
        INICI=$(date +%s)
        PRESSUPOST=$(( 330 * 60 ))   # segons totals per a tots els intents
        TOPALL=$(( 150 * 60 ))       # màxim per intent (només talla si s'ha penjat)
        for i in 1 2 3; do
          RESTA=$(( PRESSUPOST - ($(date +%s) - INICI) ))
          [ "$RESTA" -lt 600 ] && { echo "Sense temps per a més intents"; break; }
          LIMIT=$(( RESTA < TOPALL ? RESTA : TOPALL ))
          echo "--- arome_sfc_png.py: intent $i/3 (límit $(( LIMIT / 60 )) min, $(date -u +%H:%M:%S) UTC) ---"
          rm -rf "$IMATGES_DIR"; mkdir -p "$IMATGES_DIR"     # res d'intents anteriors
          timeout "${LIMIT}s" python3 arome_sfc_png.py
          CODI=$?
          N=$(find "$IMATGES_DIR" -name "sfc_*.png" -type f | wc -l)
          # manifest.json es escriu al FINAL: si hi és, l'script ha acabat la feina
          # encara que l'intèrpret hagi petat en tancar (qualsevol codi de sortida)
          if [ $CODI -eq 0 ] || { [ -f "$IMATGES_DIR/manifest.json" ] && [ "$N" -ge 5 ]; }; then
            echo "OK a l'intent $i (codi $CODI, $N PNG)"
            OK=1
            break
          fi
          echo "ERROR (codi $CODI) a l'intent $i/3"
          sleep 30
        done
        [ "$OK" = 1 ] || { echo "ERROR: els 3 intents han fallat."; exit 1; }

    # Els outlooks són secundaris: si fallen NO tomben el deploy (continue-on-error).
    # IMPORTANT: s'executen DESPRÉS de l'SFC, que esborra la carpeta a l'inici.
    - name: Executar outbrakpngs.py (outlooks AROME)
      continue-on-error: true
      timeout-minutes: 120
      run: |
        set +e
        cd private-scripts-new

        OK=0
        for i in 1 2 3; do
          echo "--- outbrakpngs.py: intent $i/3 ($(date -u +%H:%M:%S) UTC) ---"

          timeout 35m python3 outbrakpngs.py
          CODI=$?

          OUTLOOKS=$(find "$IMATGES_DIR" -maxdepth 1 -type f -name '*outlook*.png' | wc -l)
          MANIFEST_OUTLOOK=$(find "$IMATGES_DIR" -maxdepth 1 -type f -name 'manifest_outlook.json' | wc -l)

          echo "Outlooks PNG: $OUTLOOKS | manifest_outlook.json: $MANIFEST_OUTLOOK | codi: $CODI"

          if [ "$MANIFEST_OUTLOOK" -ge 1 ]; then
            echo "OK outbrakpngs.py (codi $CODI)"
            OK=1
            break
          fi

          echo "ERROR outbrakpngs.py (codi $CODI)"
          sleep 30
        done

        [ "$OK" = 1 ] || { echo "AVÍS: outbrakpngs.py ha fallat als 3 intents (el deploy continua sense outlooks)."; exit 1; }

    - name: Verificar fitxers generats
      run: |
        N=$(find "$IMATGES_DIR" -name "sfc_*.png" -type f | wc -l)
        echo "PNG sfc: $N"
        [ "$N" -lt 5 ] && { echo "Massa pocs PNG"; exit 1; }
        [ -f "$IMATGES_DIR/manifest.json" ] || { echo "Falta manifest.json"; exit 1; }
        [ -f "$IMATGES_DIR/fons.png" ] || { echo "Falta fons.png"; exit 1; }
        # Els outlooks són opcionals: només avisem
        if [ -f "$IMATGES_DIR/manifest_outlook.json" ]; then
          echo "Outlooks PNG: $(find "$IMATGES_DIR" -maxdepth 1 -type f -name '*outlook*.png' | wc -l)"
        else
          echo "AVÍS: no hi ha manifest_outlook.json (es publica sense outlooks)"
        fi
        echo "OK"

    # Un sol fitxer .tar és MOLT més ràpid de pujar/baixar que milers de fitxers petits
    - name: Empaquetar SFC
      run: |
        tar -cf "$GITHUB_WORKSPACE/sfc.tar" -C "$IMATGES_DIR" .
        ls -lh "$GITHUB_WORKSPACE/sfc.tar"

    - name: Pujar SFC com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: png-sfc
        path: sfc.tar
        compression-level: 0
        retention-days: 2
        if-no-files-found: error

  # ════════════════════════════════════════════════════════════════
  #  JOB 2 (paral·lel): 3D -> PNG
  # ════════════════════════════════════════════════════════════════
  png_3d:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      IMATGES_DIR: ${{ github.workspace }}/out-3d/imatges
    steps:
    - name: Clonar private-scripts
      run: |
        for i in 1 2 3 4; do
          rm -rf private-scripts-new
          if git clone --depth 1 "https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git" private-scripts-new; then break; fi
          [ "$i" = 4 ] && { echo "No s'ha pogut clonar private-scripts"; exit 1; }
          sleep 15
        done

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        for i in 1 2 3; do
          sudo apt-get update -qq && sudo apt-get install -y -qq libgeos-dev libproj-dev proj-data proj-bin && break
          sleep 15
        done
        python3 -m pip install --retries 5 --upgrade pip
        python3 -m pip install --retries 5 numpy requests scipy xarray cfgrib eccodes meteofetch matplotlib pillow msgpack

    - name: Preparar l'script (ruta de sortida i clau)
      run: |
        mkdir -p "$IMATGES_DIR"
        cd private-scripts-new
        sed -i -E 's|^IMATGES_DIR = .*|IMATGES_DIR = Path(os.environ["IMATGES_DIR"])|' arome_3dpng.py
        grep -q 'os.environ\["IMATGES_DIR"\]' arome_3dpng.py || { echo "No s'ha pogut canviar IMATGES_DIR"; exit 1; }
        python3 -c 'import json; cfg = json.load(open("configNE.json", "r", encoding="utf-8-sig")); cfg["api_key"] = "${{ secrets.AROME_API_KEY }}"; json.dump(cfg, open("configNE.json", "w", encoding="utf-8"), indent=2)'

    - name: Executar arome_3dpng.py (3 intents)
      timeout-minutes: 345
      run: |
        set +e
        cd private-scripts-new
        OK=0
        INICI=$(date +%s)
        PRESSUPOST=$(( 330 * 60 ))   # segons totals per a tots els intents
        TOPALL=$(( 150 * 60 ))       # màxim per intent (només talla si s'ha penjat)
        for i in 1 2 3; do
          RESTA=$(( PRESSUPOST - ($(date +%s) - INICI) ))
          [ "$RESTA" -lt 600 ] && { echo "Sense temps per a més intents"; break; }
          LIMIT=$(( RESTA < TOPALL ? RESTA : TOPALL ))
          echo "--- arome_3dpng.py: intent $i/3 (límit $(( LIMIT / 60 )) min, $(date -u +%H:%M:%S) UTC) ---"
          rm -rf "$IMATGES_DIR"; mkdir -p "$IMATGES_DIR"     # res d'intents anteriors
          export MARCA_FINAL="$GITHUB_WORKSPACE/3d_done.marker"
          rm -f "$MARCA_FINAL"
          timeout "${LIMIT}s" python3 arome_3dpng.py
          CODI=$?
          N=$(find "$IMATGES_DIR" -name "3d_*.png" -type f | wc -l)
          # Èxit = codi 0, o l'script ha escrit la marca de final (encara que el procés
          # peti en tancar). El codi 134 sense marca només s'accepta amb scripts antics.
          if [ $CODI -eq 0 ] || { [ -f "$MARCA_FINAL" ] && [ "$N" -ge 5 ]; } || { [ $CODI -eq 134 ] && [ "$N" -ge 5 ]; }; then
            echo "OK a l'intent $i (codi $CODI, $N PNG)"
            OK=1
            break
          fi
          echo "ERROR (codi $CODI) a l'intent $i/3"
          sleep 30
        done
        [ "$OK" = 1 ] || { echo "ERROR: els 3 intents han fallat."; exit 1; }

    - name: Verificar fitxers generats
      run: |
        N=$(find "$IMATGES_DIR" -name "3d_*.png" -type f | wc -l)
        S=$(find "$IMATGES_DIR" -name "sondeig_*.msgpack.gz" -type f | wc -l)
        echo "PNG 3d: $N | sondeigs: $S"
        [ "$N" -lt 5 ] && { echo "Massa pocs PNG"; exit 1; }
        [ "$S" -lt 1 ] && { echo "Cap sondeig generat"; exit 1; }
        echo "OK"

    - name: Empaquetar 3D
      run: |
        tar -cf "$GITHUB_WORKSPACE/3d.tar" -C "$IMATGES_DIR" .
        ls -lh "$GITHUB_WORKSPACE/3d.tar"

    - name: Pujar 3D com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: png-3d
        path: 3d.tar
        compression-level: 0
        retention-days: 2
        if-no-files-found: error

  # ════════════════════════════════════════════════════════════════
  #  JOB 3: MANIFEST + INFO_RUN
  # ════════════════════════════════════════════════════════════════
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [png_sfc, png_3d]
    env:
      IMATGES_DIR: ${{ github.workspace }}/merged/imatges
    steps:
    - name: Clonar private-scripts
      run: |
        for i in 1 2 3 4; do
          rm -rf private-scripts-new
          if git clone --depth 1 "https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git" private-scripts-new; then break; fi
          [ "$i" = 4 ] && { echo "No s'ha pogut clonar private-scripts"; exit 1; }
          sleep 15
        done

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependències mínimes
      run: |
        python3 -m pip install --retries 5 --upgrade pip
        python3 -m pip install --retries 5 requests

    - name: Descarregar SFC
      uses: actions/download-artifact@v4
      with:
        name: png-sfc
        path: /tmp/art-sfc

    - name: Descarregar 3D
      uses: actions/download-artifact@v4
      with:
        name: png-3d
        path: /tmp/art-3d

    - name: Descomprimir SFC + 3D
      run: |
        mkdir -p "$IMATGES_DIR"
        tar -xf /tmp/art-sfc/sfc.tar -C "$IMATGES_DIR"
        tar -xf /tmp/art-3d/3d.tar -C "$IMATGES_DIR"
        echo "Fitxers: $(find "$IMATGES_DIR" -type f | wc -l)"

    - name: Executar generar_manifestpngs.py
      timeout-minutes: 30
      run: |
        cd private-scripts-new
        sed -i -E 's|^IMATGES_DIR = .*|IMATGES_DIR = Path(os.environ["IMATGES_DIR"])|' generar_manifestpngs.py
        grep -q 'os.environ\["IMATGES_DIR"\]' generar_manifestpngs.py || { echo "No s'ha pogut canviar IMATGES_DIR"; exit 1; }
        python3 generar_manifestpngs.py

    # info.py llegeix IMATGES_DIR de l'entorn nativament (sense sed)
    - name: Executar info.py (info_run.json)
      timeout-minutes: 5
      run: |
        cd private-scripts-new
        python3 info.py

    - name: Resum del manifest
      run: |
        python3 - <<'PY'
        import json, os
        m = json.load(open(os.path.join(os.environ["IMATGES_DIR"], "manifest.json"), encoding="utf-8"))
        print("SFC:", m.get("total_hores"), "hores | 3D:", m.get("total_hores_3d"),
              "hores | extent:", bool(m.get("extent")))
        if not m.get("total_hores") or not m.get("total_hores_3d") or not m.get("extent"):
            raise SystemExit("Manifest incomplet: no es publicara")
        info_path = os.path.join(os.environ["IMATGES_DIR"], "info_run.json")
        if os.path.exists(info_path):
            info = json.load(open(info_path, encoding="utf-8"))
            print("RUN:", info.get("run_z"), "| fa", info.get("hores_des_de_run"), "h |",
                  "disponible:", info.get("disponible"))
        else:
            print("info_run.json NO generat")
        PY

    - name: Pujar manifest com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: png-manifest
        path: merged/imatges/manifest.json
        retention-days: 2
        if-no-files-found: error

    - name: Pujar info_run com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: png-info-run
        path: merged/imatges/info_run.json
        retention-days: 2
        if-no-files-found: warn

  # ════════════════════════════════════════════════════════════════
  #  JOB 4: DEPLOY
  #   1) assembla la web (branca data + nou)
  #   2) comprova límits de Cloudflare Pages
  #   3) DEPLOY A CLOUDFLARE  <- primer: la web s'actualitza ja
  #   4) guarda a la branca 'data' (amb timeouts i reintents)
  # ════════════════════════════════════════════════════════════════
  deploy:
    needs: [png_sfc, png_3d, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}
        fetch-depth: 1

    - name: Descarregar artifact - SFC
      uses: actions/download-artifact@v4
      with:
        name: png-sfc
        path: /tmp/art-sfc

    - name: Descarregar artifact - 3D
      uses: actions/download-artifact@v4
      with:
        name: png-3d
        path: /tmp/art-3d

    - name: Descarregar artifact - MANIFEST
      uses: actions/download-artifact@v4
      with:
        name: png-manifest
        path: /tmp/art-manifest

    - name: Descarregar artifact - INFO RUN
      uses: actions/download-artifact@v4
      with:
        name: png-info-run
        path: /tmp/art-info
      continue-on-error: true

    - name: Assemblar web (branca data + SFC/3D nous)
      id: assemble
      timeout-minutes: 20
      run: |
        set -euo pipefail
        P="$GITHUB_WORKSPACE/meu-mapa/public"
        REMOTE_URL="https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/joctempestes.git"

        # Fitxers del 3D (la resta de web_data_NE/imatges és SFC, outlooks inclosos)
        PAT3D=( -name '3d_*' -o -name 'isolines_3d_*' -o -name 'legend_3d_*' -o -name 'sondeig_*' -o -name 'vent3d_*' -o -name 'stormmotion_*' )

        rm -rf /tmp/nou-sfc /tmp/nou-3d
        mkdir -p /tmp/nou-sfc /tmp/nou-3d
        tar -xf /tmp/art-sfc/sfc.tar -C /tmp/nou-sfc
        tar -xf /tmp/art-3d/3d.tar -C /tmp/nou-3d
        [ -n "$(ls -A /tmp/nou-sfc)" ] || { echo "Falta SFC"; exit 1; }
        [ -n "$(ls -A /tmp/nou-3d)" ] || { echo "Falta 3D"; exit 1; }
        [ -f /tmp/art-manifest/manifest.json ] || { echo "Falta manifest"; exit 1; }

        # Estat actual de 'data'. Si GitHub no respon ABORTEM: continuar sense
        # 'data' esborraria del web les carpetes dels altres workflows.
        OK=0
        for i in 1 2 3 4 5; do
          if OUT=$(git ls-remote "$REMOTE_URL" refs/heads/data); then OK=1; break; fi
          sleep 10
        done
        [ "$OK" = 1 ] || { echo "No puc contactar amb GitHub (ls-remote)"; exit 1; }
        DATA_SHA=$(echo "$OUT" | cut -f1)
        [ -n "$DATA_SHA" ] || DATA_SHA="none"

        # Estàtics protegits (tot el que NO és dinàmic)
        rm -rf /tmp/estatic-base
        mkdir -p /tmp/estatic-base
        if [ -d "$P" ]; then
          cp -r "$P"/. /tmp/estatic-base/
          for c in $CARPETES; do rm -rf "/tmp/estatic-base/$c"; done
          rm -f /tmp/estatic-base/js/status.js
        fi

        rm -rf /tmp/data-branch "$P"
        mkdir -p "$P/js"
        for c in $CARPETES; do mkdir -p "$P/$c"; done
        cp -r /tmp/estatic-base/. "$P/"

        if [ "$DATA_SHA" != "none" ]; then
          OK=0
          for i in 1 2 3 4 5; do
            if git fetch --depth=1 origin data; then OK=1; break; fi
            sleep 10
          done
          [ "$OK" = 1 ] || { echo "No puc baixar la branca data"; exit 1; }
          DATA_SHA=$(git rev-parse FETCH_HEAD)
          git worktree prune
          git worktree add -f /tmp/data-branch FETCH_HEAD
          for c in $CARPETES; do
            cp -r /tmp/data-branch/$c/. "$P/$c/" 2>/dev/null || echo "  $c no trobat a data"
          done
          cp /tmp/data-branch/js/status.js "$P/js/status.js" 2>/dev/null || true
          git worktree remove /tmp/data-branch --force
        else
          echo "La branca 'data' encara no existeix, es crearà"
        fi
        echo "$DATA_SHA" > "$RUNNER_TEMP/data_sha"

        # Substituir web_data_NE/imatges
        IM="$P/web_data_NE/imatges"
        mkdir -p "$IM"
        find "$IM" -maxdepth 1 -type f ! \( "${PAT3D[@]}" \) -delete
        cp -r /tmp/nou-sfc/. "$IM/"
        echo "  imatges: SFC substituït"
        find "$IM" -maxdepth 1 -type f \( "${PAT3D[@]}" \) -delete
        cp -r /tmp/nou-3d/. "$IM/"
        echo "  imatges: 3D substituït"
        cp /tmp/art-manifest/manifest.json "$IM/manifest.json"
        echo "  imatges: manifest.json (SFC + 3D) aplicat"
        if [ -f /tmp/art-info/info_run.json ]; then
          cp /tmp/art-info/info_run.json "$IM/info_run.json"
          echo "  imatges: info_run.json aplicat"
        else
          echo "  info_run.json no disponible, s'omet"
        fi
        if [ "${ELIMINAR_ISOLINIES_3D:-0}" = "1" ]; then
          find "$IM" -maxdepth 1 -name 'isolines_3d_*' -delete
          echo "  imatges: isolínies 3D eliminades (ELIMINAR_ISOLINIES_3D=1)"
        fi

        echo "--- Resum ---"
        for c in $CARPETES; do echo "$c: $(find "$P/$c" -type f | wc -l) fitxers"; done
        echo "imatges sfc:      $(find "$IM" -name 'sfc_*.png' | wc -l) PNG"
        echo "imatges outlook:  $(find "$IM" -maxdepth 1 -name '*outlook*.png' | wc -l) PNG"
        echo "imatges 3d:       $(find "$IM" -name '3d_*.png' | wc -l) PNG"
        du -sh "$P/web_data_NE" || true
        echo "--- Mida per tipus (a web_data_NE/imatges) ---"
        for pat in 'sfc_*.png' '*outlook*.png' 'manifest_outlook.json' 'isolines_[0-2][0-9]_*.js' 'vent_*.js' '3d_*.png' 'isolines_3d_*.js' 'sondeig_*' 'vent3d_*' 'stormmotion_*'; do
          find "$IM" -maxdepth 1 -name "$pat" -printf '%s\n' | awk -v p="$pat" '{s+=$1} END {printf "  %-26s %6d fitxers %8.1f MB\n", p, NR, s/1048576}'
        done

    - name: Comprovar límits de Cloudflare Pages
      run: |
        P="$GITHUB_WORKSPACE/meu-mapa/public"
        # Pages: màx. 25 MiB per fitxer i 20.000 fitxers per deploy
        find "$P" -type f -size +25M -print -delete || true
        N=$(find "$P" -type f | wc -l)
        echo "Total fitxers: $N (límit Pages: 20000)"
        if [ "$N" -gt 19000 ]; then
          echo "Massa fitxers: elimino les isolínies 3D (opcionals)"
          find "$P/web_data_NE/imatges" -maxdepth 1 -name 'isolines_3d_*' -delete || true
          N=$(find "$P" -type f | wc -l)
          echo "Total fitxers ara: $N"
        fi
        [ "$N" -le 19900 ] || { echo "Encara massa fitxers per a Cloudflare Pages"; exit 1; }

    - name: Deploy a Cloudflare
      id: deploy
      timeout-minutes: 80
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        WRANGLER_SEND_METRICS: "false"
      run: |
        cd meu-mapa
        for i in 1 2 3; do
          npm install -g wrangler && break
          sleep 10
        done
        for i in 1 2 3; do
          echo "--- deploy intent $i/3 ($(date -u +%H:%M:%S) UTC) ---"
          if timeout 25m wrangler pages deploy public --project-name=tempestes-cat --branch=main --commit-dirty=true; then
            echo "Deploy OK"
            exit 0
          fi
          sleep 20
        done
        echo "El deploy a Cloudflare ha fallat 3 vegades"
        exit 1

    # S'executa encara que el deploy hagi fallat: així les dades no es perden.
    # El push gran d'un sol cop feia "HTTP 500 / remote end hung up". Ara es puja
    # en paquets petits a una branca temporal (data-staging) i només al final
    # es promou a 'data' (aquest últim push no envia dades: ja hi són).
    - name: Guardar a la branca 'data' (per paquets)
      if: always() && steps.assemble.outcome == 'success'
      timeout-minutes: 60
      run: |
        # Sense -e: gestionem els errors a mà (reintents)
        set -uo pipefail
        P="$GITHUB_WORKSPACE/meu-mapa/public"
        REMOTE_URL="https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/joctempestes.git"
        EXPECT=$(cat "$RUNNER_TEMP/data_sha")
        MSG="arome png $(date -u +'%Y-%m-%d %H:%M UTC')"
        CHUNK=800          # fitxers per paquet (≈ 40-80 MB)
        T0=$(date +%s)
        tick() { echo "  ⏱  $1: $(( $(date +%s) - T0 ))s"; }

        # Només copiem el que es versiona (no els estàtics)
        rm -rf /tmp/publish
        mkdir -p /tmp/publish/js
        for c in $CARPETES; do
          if [ -d "$P/$c" ]; then cp -r "$P/$c" /tmp/publish/; fi
        done
        if [ -f "$P/js/status.js" ]; then cp "$P/js/status.js" /tmp/publish/js/status.js; fi
        du -sh /tmp/publish
        tick "còpia"

        cd /tmp/publish
        git init -q
        git checkout -q -b data
        git config user.name "bot-dades"
        git config user.email "bot@tempestes-cat"
        # Els PNG ja venen comprimits: res de deltes i compressió ràpida
        git config core.compression 1
        git config pack.compression 1
        git config pack.window 0
        git config pack.threads 0
        git config gc.auto 0
        git config http.version HTTP/1.1
        git config http.postBuffer 1048576000
        git remote add origin "$REMOTE_URL"

        find $CARPETES js -type f 2>/dev/null | sort > /tmp/llista.txt
        TOTAL=$(wc -l < /tmp/llista.txt)
        if [ "$TOTAL" -eq 0 ]; then echo "Res a publicar"; exit 0; fi
        rm -rf /tmp/chunks
        mkdir -p /tmp/chunks
        split -l "$CHUNK" -d -a 3 /tmp/llista.txt /tmp/chunks/c_
        NCH=$(ls /tmp/chunks | wc -l)
        echo "$TOTAL fitxers en $NCH paquets"

        push_staging() {
          for k in 1 2 3 4 5; do
            if timeout 900 git push --force origin HEAD:refs/heads/data-staging; then return 0; fi
            echo "  push fallit (intent $k/5)"
            sleep $((k * 10))
          done
          return 1
        }

        # 1) Paquets petits cap a la branca temporal
        I=0
        for L in /tmp/chunks/c_*; do
          I=$((I + 1))
          GIT_LITERAL_PATHSPECS=1 git add -A --pathspec-from-file="$L"
          git commit -q -m "$MSG ($I/$NCH)"
          echo "=== Paquet $I/$NCH ==="
          if ! push_staging; then
            echo "No s'ha pogut pujar el paquet $I/$NCH (la web SÍ s'ha desplegat a Cloudflare)"
            exit 1
          fi
          tick "paquet $I/$NCH"
        done

        # 2) Promoure a 'data' (atòmic: tot o res; no envia dades noves)
        PUBLICAT=0
        for INTENT in 1 2 3 4 5; do
          echo "=== Promoure a 'data' (intent $INTENT/5) ==="
          if [ "$EXPECT" = "none" ]; then
            timeout 600 git push origin HEAD:refs/heads/data
          else
            # Només sobreescriu si 'data' és exactament el que vam llegir
            timeout 600 git push --force-with-lease="data:$EXPECT" origin HEAD:refs/heads/data
          fi
          RC=$?
          if [ $RC -eq 0 ]; then PUBLICAT=1; break; fi
          echo "Promoció fallida (codi $RC)"

          NOU=$(git ls-remote origin refs/heads/data | cut -f1)
          if [ -n "$NOU" ] && [ "$NOU" != "$EXPECT" ]; then
            echo "'data' ha canviat ($EXPECT -> $NOU): refresco les carpetes d'altres workflows"
            if ( cd "$GITHUB_WORKSPACE" \
                 && git fetch --depth=1 origin data \
                 && rm -rf /tmp/data-branch2 \
                 && git worktree prune \
                 && git worktree add -f /tmp/data-branch2 FETCH_HEAD ); then
              for c in $CARPETES; do
                [ "$c" = "web_data_NE" ] && continue
                rm -rf "/tmp/publish/$c"
                cp -r "/tmp/data-branch2/$c" /tmp/publish/ 2>/dev/null || true
              done
              mkdir -p /tmp/publish/js
              cp /tmp/data-branch2/js/status.js /tmp/publish/js/status.js 2>/dev/null || true
              ( cd "$GITHUB_WORKSPACE" && git worktree remove /tmp/data-branch2 --force )
              git add -A
              git commit -q -m "$MSG (refresc)" || true
              push_staging || true
              EXPECT="$NOU"
            fi
          fi
          sleep $((RANDOM % 10 + 5))
        done
        tick "promoció"

        # Neteja de la branca temporal (si falla no passa res)
        timeout 120 git push origin --delete data-staging || true

        if [ "$PUBLICAT" != "1" ]; then
          echo "No s'ha pogut promoure a 'data' (la web SÍ s'ha desplegat a Cloudflare)"
          exit 1
        fi
        echo "Publicat a 'data'"

    - name: Completat
      run: echo "Deploy completat $(date -u)"