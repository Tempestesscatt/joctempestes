name: AROME PNG a R2 (Xifrat)

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# Permetexecutar-se encara que n'hi hagi una altra en curs
concurrency:
  group: deploy-data
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  CARPETES: "web_data_NE web_data_derivats"
  ELIMINAR_ISOLINIES_3D: "0"
  ISOLINIES_DERIVATS: "suau"
  OPTIMITZAR_PNG: "0"

jobs:
  # ════════════════════════════════════════════════════════════════
  # JOB 1: Generar PNGs SFC + OUTLOOKS
  # ════════════════════════════════════════════════════════════════
  png_sfc:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      IMATGES_DIR: ${{ github.workspace }}/out-sfc/imatges
    steps:
    - name: Clonar private-scripts
      env:
        TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      run: |
        git clone --depth 1 https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Instal·lar dependencies
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --retries 5 numpy requests tifffile scipy xarray cfgrib eccodes meteofetch matplotlib pillow shapely pyproj cartopy
    - name: Preparar scripts
      run: |
        mkdir -p "$IMATGES_DIR"
        cd private-scripts-new
        sed -i -E 's|^IMATGES_DIR = .*|IMATGES_DIR = Path(os.environ["IMATGES_DIR"])|' arome_sfc_png.py
        sed -i -E 's|^IMATGES_DIR = .*|IMATGES_DIR = Path(os.environ["IMATGES_DIR"])|' outbrakpngs.py
        python3 -c 'import json; cfg = json.load(open("configNE.json", "r", encoding="utf-8-sig")); cfg["api_key"] = "${{ secrets.AROME_API_KEY }}"; json.dump(cfg, open("configNE.json", "w", encoding="utf-8"), indent=2)'
    - name: Executar SFC
      run: |
        cd private-scripts-new
        python3 arome_sfc_png.py
    - name: Executar Outlooks
      continue-on-error: true
      run: |
        cd private-scripts-new
        python3 outbrakpngs.py
    - name: Verificar
      run: |
        [ -f "$IMATGES_DIR/manifest.json" ] || exit 1
    - name: Empaquetar SFC
      run: tar -cf sfc.tar -C "$IMATGES_DIR" .
    - name: Pujar artifact SFC
      uses: actions/upload-artifact@v4
      with:
        name: png-sfc
        path: sfc.tar

  # ════════════════════════════════════════════════════════════════
  # JOB 2: Generar PNGs 3D
  # ════════════════════════════════════════════════════════════════
  png_3d:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      IMATGES_DIR: ${{ github.workspace }}/out-3d/imatges
    steps:
    - name: Clonar private-scripts
      env:
        TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      run: |
        git clone --depth 1 https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Instal·lar dependencies
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq libgeos-dev libproj-dev proj-data proj-bin
        python3 -m pip install --retries 5 numpy requests scipy xarray cfgrib eccodes meteofetch matplotlib pillow msgpack
    - name: Preparar scripts
      run: |
        mkdir -p "$IMATGES_DIR"
        cd private-scripts-new
        sed -i -E 's|^IMATGES_DIR = .*|IMATGES_DIR = Path(os.environ["IMATGES_DIR"])|' arome_3dpng.py
        python3 -c 'import json; cfg = json.load(open("configNE.json", "r", encoding="utf-8-sig")); cfg["api_key"] = "${{ secrets.AROME_API_KEY }}"; json.dump(cfg, open("configNE.json", "w", encoding="utf-8"), indent=2)'
    - name: Executar 3D
      run: |
        cd private-scripts-new
        python3 arome_3dpng.py
    - name: Empaquetar 3D
      run: tar -cf 3d.tar -C "$IMATGES_DIR" .
    - name: Pujar artifact 3D
      uses: actions/upload-artifact@v4
      with:
        name: png-3d
        path: 3d.tar

  # ════════════════════════════════════════════════════════════════
  # JOB 3: MANIFEST + INFO_RUN (SFC + 3D junts)
  # ════════════════════════════════════════════════════════════════
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [png_sfc, png_3d]
    env:
      IMATGES_DIR: ${{ github.workspace }}/merged/imatges
    steps:
    - name: Clonar private-scripts
      env:
        TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      run: |
        git clone --depth 1 https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/Tempestesscatt/Scripts.git private-scripts-new
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Instal·lar dependències mínimes
      run: |
        python3 -m pip install --retries 5 --upgrade pip
        python3 -m pip install --retries 5 requests
    - name: Descarregar SFC
      uses: actions/download-artifact@v4
      with:
        name: png-sfc
        path: /tmp/art-sfc
    - name: Descarregar 3D
      uses: actions/download-artifact@v4
      with:
        name: png-3d
        path: /tmp/art-3d
    - name: Descomprimir SFC + 3D
      run: |
        mkdir -p "$IMATGES_DIR"
        tar -xf /tmp/art-sfc/sfc.tar -C "$IMATGES_DIR"
        tar -xf /tmp/art-3d/3d.tar -C "$IMATGES_DIR"
    - name: Executar generar_manifestpngs.py
      run: |
        cd private-scripts-new
        sed -i -E 's|^IMATGES_DIR = .*|IMATGES_DIR = Path(os.environ["IMATGES_DIR"])|' generar_manifestpngs.py
        python3 generar_manifestpngs.py
    - name: Executar info.py
      continue-on-error: true
      run: |
        cd private-scripts-new
        python3 info.py
    - name: Empaquetar manifest
      run: |
        tar -cf manifest.tar -C "$IMATGES_DIR" manifest.json
        if [ -f "$IMATGES_DIR/info_run.json" ]; then
          tar -rf manifest.tar -C "$IMATGES_DIR" info_run.json
        fi
    - name: Pujar artifact manifest
      uses: actions/upload-artifact@v4
      with:
        name: png-manifest
        path: manifest.tar

  # ════════════════════════════════════════════════════════════════
  # JOB 4: Xifrar i Pujar a R2 (SFC + 3D + Manifest)
  # ════════════════════════════════════════════════════════════════
  xifrar_i_pujar_r2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [png_sfc, png_3d, manifest]
    steps:
    - name: Descarregar SFC
      uses: actions/download-artifact@v4
      with:
        name: png-sfc
    - name: Descarregar 3D
      uses: actions/download-artifact@v4
      with:
        name: png-3d
    - name: Descarregar Manifest
      uses: actions/download-artifact@v4
      with:
        name: png-manifest
    - name: Instal·lar rclone i openssl
      run: |
        curl -fsSL https://rclone.org/install.sh | sudo bash
        sudo apt-get install -y openssl
    - name: Descomprimir i xifrar
      env:
        KEY: ${{ secrets.ENCRYPT_KEY }}
      run: |
        mkdir -p /tmp/publicar/imatges
        tar -xf sfc.tar -C /tmp/publicar/imatges
        tar -xf 3d.tar -C /tmp/publicar/imatges
        tar -xf manifest.tar -C /tmp/publicar/imatges
        
        # Xifrem tots els fitxers (els PNG, però també el manifest.json)
        # Així el navegador no pot llegir ni el manifest sense la clau
        find /tmp/publicar/imatges -type f \( -name '*.png' -o -name '*.json' \) | while read -r f; do
          openssl enc -aes-256-cbc -salt -pass pass:"$KEY" -in "$f" -out "${f}.enc"
          rm "$f"
        done
        echo "Fitxers a pujar: $(find /tmp/publicar/imatges -type f | wc -l)"
    - name: Pujar a R2
      env:
        RCLONE_CONFIG_R2_TYPE: s3
        RCLONE_CONFIG_R2_PROVIDER: Cloudflare
        RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        BUCKET: ${{ secrets.R2_BUCKET }}
      run: |
        rclone copy /tmp/publicar/imatges "r2:$BUCKET/web_data_NE/imatges" --transfers 32 --checkers 16 -v