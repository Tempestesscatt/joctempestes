name: AROME PNG (SFC + 3D + DERIVATS)

# Només s'executa quan el dispara el worker de Cloudflare (o a mà amb "Run workflow").
# Sense cron intern, així no es pot executar dues vegades alhora.
on:
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

# Mateix grup que els altres workflows: s'encuen i no es trepitgen
concurrency:
  group: deploy-data
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Carpetes dinàmiques de la web (gestionades per diferents workflows).
  # AROME substitueix web_data_NE i web_data_derivats; la resta es conserven tal com són a 'data'.
  # (La carpeta 'news' de data -notícies- es conserva a part, vegeu els passos d'assemblatge i de guardat.)
  CARPETES: "web_data_NE webdata_waves avis gfsmaps gfsESPmaps previsions_catalunya web_data_GFS web_data_derivats"
  # "1" = esborra les isolínies 3D abans de publicar (≈2.900 fitxers menys => deploy més ràpid).
  ELIMINAR_ISOLINIES_3D: "0"
  # Isolínies dels derivats: none | suau | totes
  ISOLINIES_DERIVATS: "suau"
  # "1" = quantitza els PNG amb pngquant abans d'empaquetar (menys MB => tot va més ràpid).
  # Per defecte desactivat: revisa visualment alguns mapes abans d'activar-ho (banding).
  OPTIMITZAR_PNG: "0"

jobs:
  # ════════════════════════════════════════════════════════════════
  #  JOB 1 (paral·lel): SFC + OUTLOOKS -> PNG
  # ════════════════════════════════════════════════════════════════
  png_sfc:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      IMATGES_DIR: ${{ github.workspace }}/out-sfc/imatges
    steps:
    - name: Clonar private-scripts (amb diagnòstic)
      env:
        TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        GIT_TERMINAL_PROMPT: "0"
      run: |
        set +e
        set -uo pipefail
        umask 077

        diag() {
          intento="$1"
          echo "┌────────────── DIAGNÒSTIC (intent $intento) ──────────────"
          echo "│ Hora UTC: $(date -u +%H:%M:%S)"
          if [ -z "${TOKEN:-}" ]; then
            echo "│ ❌ El secret PRIVATE_REPO_TOKEN està buit en aquest job"
          else
            case "$TOKEN" in
              github_pat_*) tipus="fine-grained";;
              ghp_*)        tipus="classic";;
              ghs_*)        tipus="token d'app";;
              *)            tipus="format desconegut";;
            esac
            echo "│ Secret present: ${#TOKEN} caràcters | tipus: $tipus"
          fi

          echo "│ ── API: GET /repos/Tempestesscatt/Scripts"
          if [ -n "${TOKEN:-}" ]; then
            http=$(curl -sS -m 20 -D /tmp/h_repo.txt -o /tmp/b_repo.json \
              -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/Tempestesscatt/Scripts 2>/tmp/curl_repo.err)
            curl_rc=$?
            echo "│   HTTP: $http | curl exit: $curl_rc"
            grep -iE '^(HTTP|x-ratelimit-(limit|remaining|reset|resource)|retry-after|x-github-request-id|github-authentication-token-expiration)' \
              /tmp/h_repo.txt 2>/dev/null | sed 's/^/│   /'
            if [ -s /tmp/b_repo.json ]; then
              jq -r '.message // ("OK, private=" + (.private|tostring))' /tmp/b_repo.json 2>/dev/null | sed 's/^/│   missatge: /'
            fi
            [ -s /tmp/curl_repo.err ] && sed 's/^/│   curl: /' /tmp/curl_repo.err
            echo "│   (200=OK | 401=token rebutjat/caducat | 403=rate limit o permisos | 404=sense accés al repo)"
            echo "│ ── API: /rate_limit"
            curl -sS -m 20 -H "Authorization: Bearer $TOKEN" \
              https://api.github.com/rate_limit 2>&1 |
              jq -r '.resources | to_entries[] | select(.key=="core" or .key=="git" or .key=="search") |
                "│   \(.key): \(.value.remaining)/\(.value.limit) restants; reset epoch UTC \(.value.reset)"' 2>&1
          else
            echo "│   Ometo la prova API perquè el secret és buit"
          fi

          echo "│ ── githubstatus.com"
          curl -sS -m 15 https://www.githubstatus.com/api/v2/status.json 2>&1 |
            jq -r '"│   " + .status.indicator + " - " + .status.description' 2>&1
          curl -sS -m 15 https://www.githubstatus.com/api/v2/incidents/unresolved.json 2>&1 |
            jq -r '.incidents[]? | "│   INCIDENT: " + .name + " (" + .status + ")"' 2>&1

          echo "│ ── Últimes línies del trace de git"
          tail -n 40 "/tmp/clone_${intento}.log" 2>/dev/null | sed 's/^/│   /'
          echo "└────────────────────────────────────────────────────"
        }

        if [ -z "${TOKEN:-}" ]; then
          echo "::error title=Secret buit::PRIVATE_REPO_TOKEN no està definit per a aquest repositori/entorn."
          exit 1
        fi

        AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
        echo "::add-mask::$AUTH"

        OK=0
        for i in 1 2 3 4 5 6; do
          echo "--- clonant private-scripts: intent $i/6 ($(date -u +%H:%M:%S) UTC) ---"
          rm -rf private-scripts-new
          git -c http.version=HTTP/1.1 \
            -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --depth 1 https://github.com/Tempestesscatt/Scripts.git private-scripts-new \
            >"/tmp/clone_$i.log" 2>&1
          RC=$?

          if [ "$RC" -eq 0 ] && [ -d private-scripts-new/.git ]; then
            echo "✅ Clonat correctament a l'intent $i"
            OK=1
            break
          fi

          echo "❌ git clone ha fallat (codi $RC)"
          grep -E '^(fatal|error|warning)' "/tmp/clone_$i.log" | sed 's/^/   /'
          diag "$i"
          [ "$i" -eq 6 ] && break
          sleep $((i * 20))
        done

        if [ "$OK" != 1 ]; then
          echo "::error title=No s'ha pogut clonar private-scripts::Consulta el bloc DIAGNÒSTIC: permisos del token, accés al repositori, rate limit o incidència de GitHub."
          exit 1
        fi

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        for i in 1 2 3; do
          sudo apt-get update -qq && sudo apt-get install -y -qq libgeos-dev libproj-dev proj-data proj-bin && break
          sleep 15
        done
        python3 -m pip install --retries 5 --upgrade pip
        python3 -m pip install --retries 5 numpy requests tifffile scipy xarray cfgrib eccodes meteofetch matplotlib pillow shapely pyproj cartopy

    - name: Preparar els scripts (rutes de sortida i clau)
      run: |
        mkdir -p "$IMATGES_DIR"
        cd private-scripts-new

        # SFC principal
        sed -i -E 's|^IMATGES_DIR = .*|IMATGES_DIR = Path(os.environ["IMATGES_DIR"])|' arome_sfc_png.py
        grep -q 'os.environ\["IMATGES_DIR"\]' arome_sfc_png.py || { echo "No s'ha pogut canviar IMATGES_DIR a arome_sfc_png.py"; exit 1; }

        # OUTLOOKS: mateixa carpeta que SFC
        sed -i -E 's|^IMATGES_DIR = .*|IMATGES_DIR = Path(os.environ["IMATGES_DIR"])|' outbrakpngs.py
        grep -q 'os.environ\["IMATGES_DIR"\]' outbrakpngs.py || { echo "No s'ha pogut canviar IMATGES_DIR a outbrakpngs.py"; exit 1; }

        python3 -c 'import json; cfg = json.load(open("configNE.json", "r", encoding="utf-8-sig")); cfg["api_key"] = "${{ secrets.AROME_API_KEY }}"; json.dump(cfg, open("configNE.json", "w", encoding="utf-8"), indent=2)'

    - name: Executar arome_sfc_png.py (3 intents)
      timeout-minutes: 345
      run: |
        # IMPORTANT: GitHub executa "bash -e". Sense "set +e" un error de Python
        # aturava el pas a l'instant i els reintents mai s'executaven.
        set +e
        cd private-scripts-new
        OK=0
        INICI=$(date +%s)
        PRESSUPOST=$(( 330 * 60 ))   # segons totals per a tots els intents
        TOPALL=$(( 150 * 60 ))       # màxim per intent (només talla si s'ha penjat)
        for i in 1 2 3; do
          RESTA=$(( PRESSUPOST - ($(date +%s) - INICI) ))
          [ "$RESTA" -lt 600 ] && { echo "Sense temps per a més intents"; break; }
          LIMIT=$(( RESTA < TOPALL ? RESTA : TOPALL ))
          echo "--- arome_sfc_png.py: intent $i/3 (límit $(( LIMIT / 60 )) min, $(date -u +%H:%M:%S) UTC) ---"
          rm -rf "$IMATGES_DIR"; mkdir -p "$IMATGES_DIR"     # res d'intents anteriors
          timeout "${LIMIT}s" python3 arome_sfc_png.py
          CODI=$?
          N=$(find "$IMATGES_DIR" -name "sfc_*.png" -type f | wc -l)
          # manifest.json es escriu al FINAL: si hi és, l'script ha acabat la feina
          # encara que l'intèrpret hagi petat en tancar (qualsevol codi de sortida)
          if [ $CODI -eq 0 ] || { [ -f "$IMATGES_DIR/manifest.json" ] && [ "$N" -ge 5 ]; }; then
            echo "OK a l'intent $i (codi $CODI, $N PNG)"
            OK=1
            break
          fi
          echo "ERROR (codi $CODI) a l'intent $i/3"
          sleep 30
        done
        [ "$OK" = 1 ] || { echo "ERROR: els 3 intents han fallat."; exit 1; }

    # Els outlooks són secundaris: si fallen NO tomben el deploy (continue-on-error).
    # IMPORTANT: s'executen DESPRÉS de l'SFC, que esborra la carpeta a l'inici.
    - name: Executar outbrakpngs.py (outlooks AROME)
      continue-on-error: true
      timeout-minutes: 120
      run: |
        set +e
        cd private-scripts-new

        OK=0
        for i in 1 2 3; do
          echo "--- outbrakpngs.py: intent $i/3 ($(date -u +%H:%M:%S) UTC) ---"

          timeout 35m python3 outbrakpngs.py
          CODI=$?

          OUTLOOKS=$(find "$IMATGES_DIR" -maxdepth 1 -type f -name '*outlook*.png' | wc -l)
          MANIFEST_OUTLOOK=$(find "$IMATGES_DIR" -maxdepth 1 -type f -name 'manifest_outlook.json' | wc -l)

          echo "Outlooks PNG: $OUTLOOKS | manifest_outlook.json: $MANIFEST_OUTLOOK | codi: $CODI"

          if [ "$MANIFEST_OUTLOOK" -ge 1 ]; then
            echo "OK outbrakpngs.py (codi $CODI)"
            OK=1
            break
          fi

          echo "ERROR outbrakpngs.py (codi $CODI)"
          sleep 30
        done

        [ "$OK" = 1 ] || { echo "AVÍS: outbrakpngs.py ha fallat als 3 intents (el deploy continua sense outlooks)."; exit 1; }

    - name: Verificar fitxers generats
      run: |
        N=$(find "$IMATGES_DIR" -name "sfc_*.png" -type f | wc -l)
        echo "PNG sfc: $N"
        [ "$N" -lt 5 ] && { echo "Massa pocs PNG"; exit 1; }
        [ -f "$IMATGES_DIR/manifest.json" ] || { echo "Falta manifest.json"; exit 1; }
        [ -f "$IMATGES_DIR/fons.png" ] || { echo "Falta fons.png"; exit 1; }
        # Els outlooks són opcionals: només avisem
        if [ -f "$IMATGES_DIR/manifest_outlook.json" ]; then
          echo "Outlooks PNG: $(find "$IMATGES_DIR" -maxdepth 1 -type f -name '*outlook*.png' | wc -l)"
        else
          echo "AVÍS: no hi ha manifest_outlook.json (es publica sense outlooks)"
        fi
        echo "OK"

    - name: Optimitzar PNG (opcional, OPTIMITZAR_PNG=1)
      if: env.OPTIMITZAR_PNG == '1'
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq pngquant
        du -sh "$IMATGES_DIR"
        find "$IMATGES_DIR" -name '*.png' -print0 | xargs -0 -P4 -n20 \
          pngquant --force --skip-if-larger --quality=70-95 --ext .png || true
        du -sh "$IMATGES_DIR"

    # Un sol fitxer .tar és MOLT més ràpid de pujar/baixar que milers de fitxers petits
    - name: Empaquetar SFC
      run: |
        tar -cf "$GITHUB_WORKSPACE/sfc.tar" -C "$IMATGES_DIR" .
        ls -lh "$GITHUB_WORKSPACE/sfc.tar"

    - name: Pujar SFC com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: png-sfc
        path: sfc.tar
        compression-level: 0
        retention-days: 2
        if-no-files-found: error

  # ════════════════════════════════════════════════════════════════
  #  JOB 2 (paral·lel): 3D -> PNG
  # ════════════════════════════════════════════════════════════════
  png_3d:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      IMATGES_DIR: ${{ github.workspace }}/out-3d/imatges
    steps:
    - name: Clonar private-scripts (amb diagnòstic)
      env:
        TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        GIT_TERMINAL_PROMPT: "0"
      run: |
        set +e
        set -uo pipefail
        umask 077

        diag() {
          intento="$1"
          echo "┌────────────── DIAGNÒSTIC (intent $intento) ──────────────"
          echo "│ Hora UTC: $(date -u +%H:%M:%S)"
          if [ -z "${TOKEN:-}" ]; then
            echo "│ ❌ El secret PRIVATE_REPO_TOKEN està buit en aquest job"
          else
            case "$TOKEN" in
              github_pat_*) tipus="fine-grained";;
              ghp_*)        tipus="classic";;
              ghs_*)        tipus="token d'app";;
              *)            tipus="format desconegut";;
            esac
            echo "│ Secret present: ${#TOKEN} caràcters | tipus: $tipus"
          fi

          echo "│ ── API: GET /repos/Tempestesscatt/Scripts"
          if [ -n "${TOKEN:-}" ]; then
            http=$(curl -sS -m 20 -D /tmp/h_repo.txt -o /tmp/b_repo.json \
              -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/Tempestesscatt/Scripts 2>/tmp/curl_repo.err)
            curl_rc=$?
            echo "│   HTTP: $http | curl exit: $curl_rc"
            grep -iE '^(HTTP|x-ratelimit-(limit|remaining|reset|resource)|retry-after|x-github-request-id|github-authentication-token-expiration)' \
              /tmp/h_repo.txt 2>/dev/null | sed 's/^/│   /'
            if [ -s /tmp/b_repo.json ]; then
              jq -r '.message // ("OK, private=" + (.private|tostring))' /tmp/b_repo.json 2>/dev/null | sed 's/^/│   missatge: /'
            fi
            [ -s /tmp/curl_repo.err ] && sed 's/^/│   curl: /' /tmp/curl_repo.err
            echo "│   (200=OK | 401=token rebutjat/caducat | 403=rate limit o permisos | 404=sense accés al repo)"
            echo "│ ── API: /rate_limit"
            curl -sS -m 20 -H "Authorization: Bearer $TOKEN" \
              https://api.github.com/rate_limit 2>&1 |
              jq -r '.resources | to_entries[] | select(.key=="core" or .key=="git" or .key=="search") |
                "│   \(.key): \(.value.remaining)/\(.value.limit) restants; reset epoch UTC \(.value.reset)"' 2>&1
          else
            echo "│   Ometo la prova API perquè el secret és buit"
          fi

          echo "│ ── githubstatus.com"
          curl -sS -m 15 https://www.githubstatus.com/api/v2/status.json 2>&1 |
            jq -r '"│   " + .status.indicator + " - " + .status.description' 2>&1
          curl -sS -m 15 https://www.githubstatus.com/api/v2/incidents/unresolved.json 2>&1 |
            jq -r '.incidents[]? | "│   INCIDENT: " + .name + " (" + .status + ")"' 2>&1

          echo "│ ── Últimes línies del trace de git"
          tail -n 40 "/tmp/clone_${intento}.log" 2>/dev/null | sed 's/^/│   /'
          echo "└────────────────────────────────────────────────────"
        }

        if [ -z "${TOKEN:-}" ]; then
          echo "::error title=Secret buit::PRIVATE_REPO_TOKEN no està definit per a aquest repositori/entorn."
          exit 1
        fi

        AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
        echo "::add-mask::$AUTH"

        OK=0
        for i in 1 2 3 4 5 6; do
          echo "--- clonant private-scripts: intent $i/6 ($(date -u +%H:%M:%S) UTC) ---"
          rm -rf private-scripts-new
          git -c http.version=HTTP/1.1 \
            -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --depth 1 https://github.com/Tempestesscatt/Scripts.git private-scripts-new \
            >"/tmp/clone_$i.log" 2>&1
          RC=$?

          if [ "$RC" -eq 0 ] && [ -d private-scripts-new/.git ]; then
            echo "✅ Clonat correctament a l'intent $i"
            OK=1
            break
          fi

          echo "❌ git clone ha fallat (codi $RC)"
          grep -E '^(fatal|error|warning)' "/tmp/clone_$i.log" | sed 's/^/   /'
          diag "$i"
          [ "$i" -eq 6 ] && break
          sleep $((i * 20))
        done

        if [ "$OK" != 1 ]; then
          echo "::error title=No s'ha pogut clonar private-scripts::Consulta el bloc DIAGNÒSTIC: permisos del token, accés al repositori, rate limit o incidència de GitHub."
          exit 1
        fi

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        for i in 1 2 3; do
          sudo apt-get update -qq && sudo apt-get install -y -qq libgeos-dev libproj-dev proj-data proj-bin && break
          sleep 15
        done
        python3 -m pip install --retries 5 --upgrade pip
        python3 -m pip install --retries 5 numpy requests scipy xarray cfgrib eccodes meteofetch matplotlib pillow msgpack

    - name: Preparar l'script (ruta de sortida i clau)
      run: |
        mkdir -p "$IMATGES_DIR"
        cd private-scripts-new
        sed -i -E 's|^IMATGES_DIR = .*|IMATGES_DIR = Path(os.environ["IMATGES_DIR"])|' arome_3dpng.py
        grep -q 'os.environ\["IMATGES_DIR"\]' arome_3dpng.py || { echo "No s'ha pogut canviar IMATGES_DIR"; exit 1; }
        python3 -c 'import json; cfg = json.load(open("configNE.json", "r", encoding="utf-8-sig")); cfg["api_key"] = "${{ secrets.AROME_API_KEY }}"; json.dump(cfg, open("configNE.json", "w", encoding="utf-8"), indent=2)'

    - name: Executar arome_3dpng.py (3 intents)
      timeout-minutes: 345
      run: |
        set +e
        cd private-scripts-new
        OK=0
        INICI=$(date +%s)
        PRESSUPOST=$(( 330 * 60 ))   # segons totals per a tots els intents
        TOPALL=$(( 150 * 60 ))       # màxim per intent (només talla si s'ha penjat)
        for i in 1 2 3; do
          RESTA=$(( PRESSUPOST - ($(date +%s) - INICI) ))
          [ "$RESTA" -lt 600 ] && { echo "Sense temps per a més intents"; break; }
          LIMIT=$(( RESTA < TOPALL ? RESTA : TOPALL ))
          echo "--- arome_3dpng.py: intent $i/3 (límit $(( LIMIT / 60 )) min, $(date -u +%H:%M:%S) UTC) ---"
          rm -rf "$IMATGES_DIR"; mkdir -p "$IMATGES_DIR"     # res d'intents anteriors
          export MARCA_FINAL="$GITHUB_WORKSPACE/3d_done.marker"
          rm -f "$MARCA_FINAL"
          timeout "${LIMIT}s" python3 arome_3dpng.py
          CODI=$?
          N=$(find "$IMATGES_DIR" -name "3d_*.png" -type f | wc -l)
          # Èxit = codi 0, o l'script ha escrit la marca de final (encara que el procés
          # peti en tancar). El codi 134 sense marca només s'accepta amb scripts antics.
          if [ $CODI -eq 0 ] || { [ -f "$MARCA_FINAL" ] && [ "$N" -ge 5 ]; } || { [ $CODI -eq 134 ] && [ "$N" -ge 5 ]; }; then
            echo "OK a l'intent $i (codi $CODI, $N PNG)"
            OK=1
            break
          fi
          echo "ERROR (codi $CODI) a l'intent $i/3"
          sleep 30
        done
        [ "$OK" = 1 ] || { echo "ERROR: els 3 intents han fallat."; exit 1; }

    - name: Verificar fitxers generats
      run: |
        N=$(find "$IMATGES_DIR" -name "3d_*.png" -type f | wc -l)
        S=$(find "$IMATGES_DIR" -name "sondeig_*.msgpack.gz" -type f | wc -l)
        echo "PNG 3d: $N | sondeigs: $S"
        [ "$N" -lt 5 ] && { echo "Massa pocs PNG"; exit 1; }
        [ "$S" -lt 1 ] && { echo "Cap sondeig generat"; exit 1; }
        echo "OK"

    - name: Optimitzar PNG (opcional, OPTIMITZAR_PNG=1)
      if: env.OPTIMITZAR_PNG == '1'
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq pngquant
        du -sh "$IMATGES_DIR"
        find "$IMATGES_DIR" -name '*.png' -print0 | xargs -0 -P4 -n20 \
          pngquant --force --skip-if-larger --quality=70-95 --ext .png || true
        du -sh "$IMATGES_DIR"

    - name: Empaquetar 3D
      run: |
        tar -cf "$GITHUB_WORKSPACE/3d.tar" -C "$IMATGES_DIR" .
        ls -lh "$GITHUB_WORKSPACE/3d.tar"

    - name: Pujar 3D com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: png-3d
        path: 3d.tar
        compression-level: 0
        retention-days: 2
        if-no-files-found: error

  # ════════════════════════════════════════════════════════════════
  #  JOB 2b (paral·lel): DERIVATS (convecció, pluja, dinàmica, hivern, foc) -> PNG
  #  Carpeta pròpia (web_data_derivats): no comparteix res amb SFC/3D.
  #  És secundari: si falla NO tomba el deploy (es conserva el que hi ha a 'data').
  # ════════════════════════════════════════════════════════════════
  png_derivats:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    continue-on-error: true
    env:
      # El path conté "derivats" (l'script ho comprova abans de netejar obsolets)
      IMATGES_DIR: ${{ github.workspace }}/out-derivats/imatges
    steps:
    - name: Clonar private-scripts (amb diagnòstic)
      env:
        TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        GIT_TERMINAL_PROMPT: "0"
      run: |
        set +e
        set -uo pipefail
        umask 077

        diag() {
          intento="$1"
          echo "┌────────────── DIAGNÒSTIC (intent $intento) ──────────────"
          echo "│ Hora UTC: $(date -u +%H:%M:%S)"
          if [ -z "${TOKEN:-}" ]; then
            echo "│ ❌ El secret PRIVATE_REPO_TOKEN està buit en aquest job"
          else
            case "$TOKEN" in
              github_pat_*) tipus="fine-grained";;
              ghp_*)        tipus="classic";;
              ghs_*)        tipus="token d'app";;
              *)            tipus="format desconegut";;
            esac
            echo "│ Secret present: ${#TOKEN} caràcters | tipus: $tipus"
          fi

          echo "│ ── API: GET /repos/Tempestesscatt/Scripts"
          if [ -n "${TOKEN:-}" ]; then
            http=$(curl -sS -m 20 -D /tmp/h_repo.txt -o /tmp/b_repo.json \
              -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/Tempestesscatt/Scripts 2>/tmp/curl_repo.err)
            curl_rc=$?
            echo "│   HTTP: $http | curl exit: $curl_rc"
            grep -iE '^(HTTP|x-ratelimit-(limit|remaining|reset|resource)|retry-after|x-github-request-id|github-authentication-token-expiration)' \
              /tmp/h_repo.txt 2>/dev/null | sed 's/^/│   /'
            if [ -s /tmp/b_repo.json ]; then
              jq -r '.message // ("OK, private=" + (.private|tostring))' /tmp/b_repo.json 2>/dev/null | sed 's/^/│   missatge: /'
            fi
            [ -s /tmp/curl_repo.err ] && sed 's/^/│   curl: /' /tmp/curl_repo.err
            echo "│   (200=OK | 401=token rebutjat/caducat | 403=rate limit o permisos | 404=sense accés al repo)"
            echo "│ ── API: /rate_limit"
            curl -sS -m 20 -H "Authorization: Bearer $TOKEN" \
              https://api.github.com/rate_limit 2>&1 |
              jq -r '.resources | to_entries[] | select(.key=="core" or .key=="git" or .key=="search") |
                "│   \(.key): \(.value.remaining)/\(.value.limit) restants; reset epoch UTC \(.value.reset)"' 2>&1
          else
            echo "│   Ometo la prova API perquè el secret és buit"
          fi

          echo "│ ── githubstatus.com"
          curl -sS -m 15 https://www.githubstatus.com/api/v2/status.json 2>&1 |
            jq -r '"│   " + .status.indicator + " - " + .status.description' 2>&1
          curl -sS -m 15 https://www.githubstatus.com/api/v2/incidents/unresolved.json 2>&1 |
            jq -r '.incidents[]? | "│   INCIDENT: " + .name + " (" + .status + ")"' 2>&1

          echo "│ ── Últimes línies del trace de git"
          tail -n 40 "/tmp/clone_${intento}.log" 2>/dev/null | sed 's/^/│   /'
          echo "└────────────────────────────────────────────────────"
        }

        if [ -z "${TOKEN:-}" ]; then
          echo "::error title=Secret buit::PRIVATE_REPO_TOKEN no està definit per a aquest repositori/entorn."
          exit 1
        fi

        AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
        echo "::add-mask::$AUTH"

        OK=0
        for i in 1 2 3 4 5 6; do
          echo "--- clonant private-scripts: intent $i/6 ($(date -u +%H:%M:%S) UTC) ---"
          rm -rf private-scripts-new
          git -c http.version=HTTP/1.1 \
            -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --depth 1 https://github.com/Tempestesscatt/Scripts.git private-scripts-new \
            >"/tmp/clone_$i.log" 2>&1
          RC=$?

          if [ "$RC" -eq 0 ] && [ -d private-scripts-new/.git ]; then
            echo "✅ Clonat correctament a l'intent $i"
            OK=1
            break
          fi

          echo "❌ git clone ha fallat (codi $RC)"
          grep -E '^(fatal|error|warning)' "/tmp/clone_$i.log" | sed 's/^/   /'
          diag "$i"
          [ "$i" -eq 6 ] && break
          sleep $((i * 20))
        done

        if [ "$OK" != 1 ]; then
          echo "::error title=No s'ha pogut clonar private-scripts::Consulta el bloc DIAGNÒSTIC: permisos del token, accés al repositori, rate limit o incidència de GitHub."
          exit 1
        fi

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependencies
      run: |
        for i in 1 2 3; do
          sudo apt-get update -qq && sudo apt-get install -y -qq libgeos-dev libproj-dev proj-data proj-bin && break
          sleep 15
        done
        python3 -m pip install --retries 5 --upgrade pip
        python3 -m pip install --retries 5 numpy requests scipy xarray cfgrib eccodes meteofetch matplotlib pillow tifffile

    # arome_derivats_png.py llegeix IMATGES_DIR de l'entorn nativament (sense sed)
    - name: Preparar la clau
      run: |
        mkdir -p "$IMATGES_DIR"
        cd private-scripts-new
        ls arome_derivats_png.py || { echo "Falta arome_derivats_png.py al repo Scripts"; exit 1; }
        python3 -c 'import json; cfg = json.load(open("configNE.json", "r", encoding="utf-8-sig")); cfg["api_key"] = "${{ secrets.AROME_API_KEY }}"; json.dump(cfg, open("configNE.json", "w", encoding="utf-8"), indent=2)'

    - name: Executar arome_derivats_png.py (3 intents)
      timeout-minutes: 345
      run: |
        set +e
        cd private-scripts-new
        OK=0
        INICI=$(date +%s)
        PRESSUPOST=$(( 330 * 60 ))
        TOPALL=$(( 150 * 60 ))
        for i in 1 2 3; do
          RESTA=$(( PRESSUPOST - ($(date +%s) - INICI) ))
          [ "$RESTA" -lt 600 ] && { echo "Sense temps per a més intents"; break; }
          LIMIT=$(( RESTA < TOPALL ? RESTA : TOPALL ))
          echo "--- arome_derivats_png.py: intent $i/3 (límit $(( LIMIT / 60 )) min, $(date -u +%H:%M:%S) UTC) ---"
          rm -rf "$IMATGES_DIR"; mkdir -p "$IMATGES_DIR"
          export MARCA_FINAL="$GITHUB_WORKSPACE/derivats_done.marker"
          rm -f "$MARCA_FINAL"
          timeout "${LIMIT}s" python3 arome_derivats_png.py --isolinies "${ISOLINIES_DERIVATS:-suau}"
          CODI=$?
          N=$(find "$IMATGES_DIR" -name "3d_*.png" -type f | wc -l)
          # Èxit = codi 0, o marca de final / manifest escrit (l'script surt amb os._exit)
          if [ $CODI -eq 0 ] || { [ -f "$MARCA_FINAL" ] && [ "$N" -ge 5 ]; } \
             || { [ -f "$IMATGES_DIR/manifest.json" ] && [ "$N" -ge 5 ]; }; then
            echo "OK a l'intent $i (codi $CODI, $N PNG)"
            OK=1
            break
          fi
          echo "ERROR (codi $CODI) a l'intent $i/3"
          sleep 30
        done
        [ "$OK" = 1 ] || { echo "ERROR: els 3 intents han fallat."; exit 1; }

    - name: Verificar fitxers generats
      run: |
        N=$(find "$IMATGES_DIR" -maxdepth 1 -name "3d_*.png" -type f | wc -l)
        L=$(find "$IMATGES_DIR" -maxdepth 1 -name "legend_3d_*.png" -type f | wc -l)
        I=$(find "$IMATGES_DIR" -maxdepth 1 -name "isolines_3d_*.js" -type f | wc -l)
        B=$(find "$IMATGES_DIR/barbes_vent" -name "*.json" -type f 2>/dev/null | wc -l)
        echo "PNG: $N | llegendes: $L | isolínies: $I | barbes_vent: $B"
        [ "$N" -lt 5 ] && { echo "Massa pocs PNG"; exit 1; }
        [ -f "$IMATGES_DIR/manifest.json" ] || { echo "Falta manifest.json"; exit 1; }
        python3 - <<'PY'
        import json, os
        m = json.load(open(os.path.join(os.environ["IMATGES_DIR"], "manifest.json"), encoding="utf-8"))
        print("Derivats: run", m.get("run"), "|", len(m.get("hores", [])), "hores |",
              len(m.get("variables_3d", {})), "variables")
        if not m.get("hores") or not m.get("extent"):
            raise SystemExit("Manifest de derivats incomplet: no es publicarà")
        PY
        du -sh "$IMATGES_DIR"

    - name: Optimitzar PNG (opcional, OPTIMITZAR_PNG=1)
      if: env.OPTIMITZAR_PNG == '1'
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq pngquant
        du -sh "$IMATGES_DIR"
        find "$IMATGES_DIR" -name '*.png' -print0 | xargs -0 -P4 -n20 \
          pngquant --force --skip-if-larger --quality=70-95 --ext .png || true
        du -sh "$IMATGES_DIR"

    - name: Empaquetar derivats
      run: |
        tar -cf "$GITHUB_WORKSPACE/derivats.tar" -C "$IMATGES_DIR" .
        ls -lh "$GITHUB_WORKSPACE/derivats.tar"
        # El catàleg per enganxar al visor es queda al costat de l'script
        cp private-scripts-new/derivats_cataleg.txt "$GITHUB_WORKSPACE/derivats_cataleg.txt" 2>/dev/null || true

    - name: Pujar derivats com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: png-derivats
        path: derivats.tar
        compression-level: 0
        retention-days: 2
        if-no-files-found: error

    - name: Pujar catàleg del visor (opcional)
      uses: actions/upload-artifact@v4
      with:
        name: derivats-cataleg
        path: derivats_cataleg.txt
        retention-days: 7
        if-no-files-found: warn

  # ════════════════════════════════════════════════════════════════
  #  JOB 3: MANIFEST + INFO_RUN  (NE: SFC + 3D; els derivats tenen manifest propi)
  # ════════════════════════════════════════════════════════════════
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [png_sfc, png_3d]
    env:
      IMATGES_DIR: ${{ github.workspace }}/merged/imatges
    steps:
    - name: Clonar private-scripts (amb diagnòstic)
      env:
        TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        GIT_TERMINAL_PROMPT: "0"
      run: |
        set +e
        set -uo pipefail
        umask 077

        diag() {
          intento="$1"
          echo "┌────────────── DIAGNÒSTIC (intent $intento) ──────────────"
          echo "│ Hora UTC: $(date -u +%H:%M:%S)"
          if [ -z "${TOKEN:-}" ]; then
            echo "│ ❌ El secret PRIVATE_REPO_TOKEN està buit en aquest job"
          else
            case "$TOKEN" in
              github_pat_*) tipus="fine-grained";;
              ghp_*)        tipus="classic";;
              ghs_*)        tipus="token d'app";;
              *)            tipus="format desconegut";;
            esac
            echo "│ Secret present: ${#TOKEN} caràcters | tipus: $tipus"
          fi

          echo "│ ── API: GET /repos/Tempestesscatt/Scripts"
          if [ -n "${TOKEN:-}" ]; then
            http=$(curl -sS -m 20 -D /tmp/h_repo.txt -o /tmp/b_repo.json \
              -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/Tempestesscatt/Scripts 2>/tmp/curl_repo.err)
            curl_rc=$?
            echo "│   HTTP: $http | curl exit: $curl_rc"
            grep -iE '^(HTTP|x-ratelimit-(limit|remaining|reset|resource)|retry-after|x-github-request-id|github-authentication-token-expiration)' \
              /tmp/h_repo.txt 2>/dev/null | sed 's/^/│   /'
            if [ -s /tmp/b_repo.json ]; then
              jq -r '.message // ("OK, private=" + (.private|tostring))' /tmp/b_repo.json 2>/dev/null | sed 's/^/│   missatge: /'
            fi
            [ -s /tmp/curl_repo.err ] && sed 's/^/│   curl: /' /tmp/curl_repo.err
            echo "│   (200=OK | 401=token rebutjat/caducat | 403=rate limit o permisos | 404=sense accés al repo)"
            echo "│ ── API: /rate_limit"
            curl -sS -m 20 -H "Authorization: Bearer $TOKEN" \
              https://api.github.com/rate_limit 2>&1 |
              jq -r '.resources | to_entries[] | select(.key=="core" or .key=="git" or .key=="search") |
                "│   \(.key): \(.value.remaining)/\(.value.limit) restants; reset epoch UTC \(.value.reset)"' 2>&1
          else
            echo "│   Ometo la prova API perquè el secret és buit"
          fi

          echo "│ ── githubstatus.com"
          curl -sS -m 15 https://www.githubstatus.com/api/v2/status.json 2>&1 |
            jq -r '"│   " + .status.indicator + " - " + .status.description' 2>&1
          curl -sS -m 15 https://www.githubstatus.com/api/v2/incidents/unresolved.json 2>&1 |
            jq -r '.incidents[]? | "│   INCIDENT: " + .name + " (" + .status + ")"' 2>&1

          echo "│ ── Últimes línies del trace de git"
          tail -n 40 "/tmp/clone_${intento}.log" 2>/dev/null | sed 's/^/│   /'
          echo "└────────────────────────────────────────────────────"
        }

        if [ -z "${TOKEN:-}" ]; then
          echo "::error title=Secret buit::PRIVATE_REPO_TOKEN no està definit per a aquest repositori/entorn."
          exit 1
        fi

        AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
        echo "::add-mask::$AUTH"

        OK=0
        for i in 1 2 3 4 5 6; do
          echo "--- clonant private-scripts: intent $i/6 ($(date -u +%H:%M:%S) UTC) ---"
          rm -rf private-scripts-new
          git -c http.version=HTTP/1.1 \
            -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --depth 1 https://github.com/Tempestesscatt/Scripts.git private-scripts-new \
            >"/tmp/clone_$i.log" 2>&1
          RC=$?

          if [ "$RC" -eq 0 ] && [ -d private-scripts-new/.git ]; then
            echo "✅ Clonat correctament a l'intent $i"
            OK=1
            break
          fi

          echo "❌ git clone ha fallat (codi $RC)"
          grep -E '^(fatal|error|warning)' "/tmp/clone_$i.log" | sed 's/^/   /'
          diag "$i"
          [ "$i" -eq 6 ] && break
          sleep $((i * 20))
        done

        if [ "$OK" != 1 ]; then
          echo "::error title=No s'ha pogut clonar private-scripts::Consulta el bloc DIAGNÒSTIC: permisos del token, accés al repositori, rate limit o incidència de GitHub."
          exit 1
        fi

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instal·lar dependències mínimes
      run: |
        python3 -m pip install --retries 5 --upgrade pip
        python3 -m pip install --retries 5 requests

    - name: Descarregar SFC
      uses: actions/download-artifact@v4
      with:
        name: png-sfc
        path: /tmp/art-sfc

    - name: Descarregar 3D
      uses: actions/download-artifact@v4
      with:
        name: png-3d
        path: /tmp/art-3d

    - name: Descomprimir SFC + 3D
      run: |
        mkdir -p "$IMATGES_DIR"
        tar -xf /tmp/art-sfc/sfc.tar -C "$IMATGES_DIR"
        tar -xf /tmp/art-3d/3d.tar -C "$IMATGES_DIR"
        echo "Fitxers: $(find "$IMATGES_DIR" -type f | wc -l)"

    - name: Executar generar_manifestpngs.py
      timeout-minutes: 30
      run: |
        cd private-scripts-new
        sed -i -E 's|^IMATGES_DIR = .*|IMATGES_DIR = Path(os.environ["IMATGES_DIR"])|' generar_manifestpngs.py
        grep -q 'os.environ\["IMATGES_DIR"\]' generar_manifestpngs.py || { echo "No s'ha pogut canviar IMATGES_DIR"; exit 1; }
        python3 generar_manifestpngs.py

    # info.py llegeix IMATGES_DIR de l'entorn nativament (sense sed)
    - name: Executar info.py (info_run.json)
      timeout-minutes: 5
      continue-on-error: true
      run: |
        cd private-scripts-new
        python3 info.py

    - name: Resum del manifest
      run: |
        python3 - <<'PY'
        import json, os
        m = json.load(open(os.path.join(os.environ["IMATGES_DIR"], "manifest.json"), encoding="utf-8"))
        print("SFC:", m.get("total_hores"), "hores | 3D:", m.get("total_hores_3d"),
              "hores | extent:", bool(m.get("extent")))
        if not m.get("total_hores") or not m.get("total_hores_3d") or not m.get("extent"):
            raise SystemExit("Manifest incomplet: no es publicara")
        info_path = os.path.join(os.environ["IMATGES_DIR"], "info_run.json")
        if os.path.exists(info_path):
            info = json.load(open(info_path, encoding="utf-8"))
            print("RUN:", info.get("run_z"), "| fa", info.get("hores_des_de_run"), "h |",
                  "disponible:", info.get("disponible"))
        else:
            print("info_run.json NO generat")
        PY

    - name: Pujar manifest com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: png-manifest
        path: merged/imatges/manifest.json
        retention-days: 2
        if-no-files-found: error

    - name: Pujar info_run com a artifact
      uses: actions/upload-artifact@v4
      with:
        name: png-info-run
        path: merged/imatges/info_run.json
        retention-days: 2
        if-no-files-found: warn

  # ════════════════════════════════════════════════════════════════
  #  JOB 4: DEPLOY
  #   1) assembla la web (branca data + nou)   <- ara amb checkout DISPERS (només el necessari)
  #   2) injecta les últimes notícies (guardades a data/news)
  #   3) comprova límits de Cloudflare Pages
  #   4) DEPLOY A CLOUDFLARE  <- primer: la web s'actualitza ja
  #   5) guarda a la branca 'data' (amb timeouts i reintents), CONSERVANT 'news'
  #
  #  Espera SFC + 3D + manifest (obligatoris) i DERIVATS (opcional: si ha fallat,
  #  es conserva la versió que ja hi ha a 'data').
  #
  #  Pressupost de temps del job: assemblar 35 + deploy 80 + guardar 90 = 205 min
  #  (+ descàrregues) => timeout del job a 240 min.
  # ════════════════════════════════════════════════════════════════
  deploy:
    needs: [png_sfc, png_3d, png_derivats, manifest]
    if: ${{ !cancelled() && needs.png_sfc.result == 'success' && needs.png_3d.result == 'success' && needs.manifest.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}
        fetch-depth: 1

    - name: Descarregar artifact - SFC
      uses: actions/download-artifact@v4
      with:
        name: png-sfc
        path: /tmp/art-sfc

    - name: Descarregar artifact - 3D
      uses: actions/download-artifact@v4
      with:
        name: png-3d
        path: /tmp/art-3d

    - name: Descarregar artifact - MANIFEST
      uses: actions/download-artifact@v4
      with:
        name: png-manifest
        path: /tmp/art-manifest

    - name: Descarregar artifact - INFO RUN
      uses: actions/download-artifact@v4
      with:
        name: png-info-run
        path: /tmp/art-info
      continue-on-error: true

    - name: Descarregar artifact - DERIVATS
      uses: actions/download-artifact@v4
      with:
        name: png-derivats
        path: /tmp/art-derivats
      continue-on-error: true

    # git ls-remote / fetch usen el remot 'origin' del checkout, que ja porta
    # el token en una capçalera (sense token a la URL).
    #
    # CANVI CLAU: abans es baixava TOTA la branca 'data' (diversos GB, incloent
    # web_data_NE i web_data_derivats que després substituïm igualment).
    # Ara: fetch --filter=blob:none + sparse-checkout => només es baixen els blobs
    # de les carpetes d'altres workflows, 'news' i 'js'.
    - name: Assemblar web (branca data + SFC/3D/derivats nous)
      id: assemble
      timeout-minutes: 35
      env:
        GIT_TERMINAL_PROMPT: "0"
      run: |
        set -euo pipefail
        P="$GITHUB_WORKSPACE/meu-mapa/public"
        export P

        # Fitxers del 3D (la resta de web_data_NE/imatges és SFC, outlooks inclosos)
        PAT3D=( -name '3d_*' -o -name 'isolines_3d_*' -o -name 'legend_3d_*' -o -name 'sondeig_*' -o -name 'vent3d_*' -o -name 'stormmotion_*' )

        # Checkout dispers d'un commit de 'data' en un worktree. Si falla, cau al checkout complet.
        checkout_dispers() {
          local dest="$1" sha="$2"
          shift 2
          rm -rf "$dest"
          git -C "$GITHUB_WORKSPACE" worktree prune
          if git -C "$GITHUB_WORKSPACE" worktree add -f --no-checkout "$dest" "$sha" \
             && git -C "$dest" sparse-checkout set --cone "$@" \
             && git -C "$dest" checkout -f HEAD; then
            return 0
          fi
          echo "  ⚠️  checkout dispers fallit: provo el checkout complet (més lent)"
          git -C "$GITHUB_WORKSPACE" worktree remove "$dest" --force 2>/dev/null || true
          rm -rf "$dest"
          git -C "$GITHUB_WORKSPACE" worktree prune
          git -C "$GITHUB_WORKSPACE" worktree add -f "$dest" "$sha"
        }

        rm -rf /tmp/nou-sfc /tmp/nou-3d /tmp/nou-der
        mkdir -p /tmp/nou-sfc /tmp/nou-3d /tmp/nou-der
        tar -xf /tmp/art-sfc/sfc.tar -C /tmp/nou-sfc
        tar -xf /tmp/art-3d/3d.tar -C /tmp/nou-3d
        [ -n "$(ls -A /tmp/nou-sfc)" ] || { echo "Falta SFC"; exit 1; }
        [ -n "$(ls -A /tmp/nou-3d)" ] || { echo "Falta 3D"; exit 1; }
        [ -f /tmp/art-manifest/manifest.json ] || { echo "Falta manifest"; exit 1; }

        # Derivats (opcional): només es consideren nous si l'artifact existeix i és vàlid
        DER_NOU=0
        if [ -f /tmp/art-derivats/derivats.tar ]; then
          if tar -xf /tmp/art-derivats/derivats.tar -C /tmp/nou-der \
             && [ -f /tmp/nou-der/manifest.json ] \
             && [ "$(find /tmp/nou-der -maxdepth 1 -name '3d_*.png' | wc -l)" -ge 5 ]; then
            DER_NOU=1
            echo "Derivats nous: OK"
          else
            echo "⚠️  L'artifact de derivats no és vàlid: es conserva el de 'data'"
          fi
        else
          echo "⚠️  Sense artifact de derivats (ha fallat el job?): es conserva el de 'data'"
        fi
        echo "$DER_NOU" > "$RUNNER_TEMP/derivats_nou"

        # Estat actual de 'data'. Si GitHub no respon ABORTEM: continuar sense
        # 'data' esborraria del web les carpetes dels altres workflows.
        OK=0
        for i in 1 2 3 4 5; do
          if OUT=$(git ls-remote origin refs/heads/data); then OK=1; break; fi
          echo "  ls-remote ha fallat (intent $i/5), reintento..."
          sleep $((i * 10))
        done
        [ "$OK" = 1 ] || { echo "No puc contactar amb GitHub (ls-remote)"; exit 1; }
        DATA_SHA=$(echo "$OUT" | cut -f1)
        [ -n "$DATA_SHA" ] || DATA_SHA="none"

        # Estàtics protegits (tot el que NO és dinàmic)
        rm -rf /tmp/estatic-base
        mkdir -p /tmp/estatic-base
        if [ -d "$P" ]; then
          cp -r "$P"/. /tmp/estatic-base/
          for c in $CARPETES; do rm -rf "/tmp/estatic-base/$c"; done
          rm -f /tmp/estatic-base/js/status.js
        fi

        rm -rf /tmp/data-branch "$P"
        mkdir -p "$P/js"
        for c in $CARPETES; do mkdir -p "$P/$c"; done
        cp -r /tmp/estatic-base/. "$P/"

        # Notícies: es guarden aquí per (1) injectar-les a l'index.html i
        # (2) tornar-les a publicar a 'data' (si no, el push de dalt les esborraria)
        rm -rf /tmp/news-keep /tmp/news-data
        mkdir -p /tmp/news-keep

        if [ "$DATA_SHA" != "none" ]; then
          OK=0
          for i in 1 2 3 4 5; do
            if git fetch --depth=1 --filter=blob:none origin data; then OK=1; break; fi
            echo "  fetch ha fallat (intent $i/5), reintento..."
            sleep $((i * 10))
          done
          [ "$OK" = 1 ] || { echo "No puc baixar la branca data"; exit 1; }
          DATA_SHA=$(git rev-parse FETCH_HEAD)
          export DATA_SHA

          # Carpetes d'altres workflows que hem de conservar de 'data':
          # web_data_NE sempre es substitueix; web_data_derivats només si en tenim de nous.
          AJENES=""
          for c in $CARPETES; do
            [ "$c" = "web_data_NE" ] && continue
            if [ "$c" = "web_data_derivats" ] && [ "$DER_NOU" = "1" ]; then continue; fi
            AJENES="$AJENES $c"
          done
          echo "  Checkout dispers de 'data': $AJENES news js"
          checkout_dispers /tmp/data-branch "$DATA_SHA" $AJENES news js

          for c in $AJENES; do
            cp -r /tmp/data-branch/$c/. "$P/$c/" 2>/dev/null || echo "  $c no trobat a data"
          done
          cp /tmp/data-branch/js/status.js "$P/js/status.js" 2>/dev/null || true

          # Guardem les notícies abans de treure el worktree
          if [ -d /tmp/data-branch/news ]; then
            cp -r /tmp/data-branch/news /tmp/news-keep/news
          fi
          if [ -d /tmp/news-keep/news/noticies ]; then
            cp -r /tmp/news-keep/news/noticies /tmp/news-data
          fi

          git worktree remove /tmp/data-branch --force

          # Seguretat: si a web_data_NE hi ha fitxers FORA de l'arrel d'imatges/ (p. ex. un altre
          # json o subcarpetes), abans es conservaven de 'data'. Com que ara no baixem web_data_NE,
          # els recuperem un a un (normalment n'hi ha 0).
          git ls-tree -r -z --name-only "$DATA_SHA" -- web_data_NE \
            | tr '\0' '\n' | grep -v -E '^web_data_NE/imatges/[^/]+$' > /tmp/ne_extra.txt || true
          NE_EXTRA=$(wc -l < /tmp/ne_extra.txt)
          echo "  web_data_NE: $NE_EXTRA fitxers fora de l'arrel d'imatges/ (es conserven de 'data')"
          if [ "$NE_EXTRA" -gt 0 ]; then
            tr '\n' '\0' < /tmp/ne_extra.txt | xargs -0 -n 200 sh -c \
              'git -C "$GITHUB_WORKSPACE" archive "$DATA_SHA" -- "$@" | tar -x -C "$P"' _
          fi
        else
          echo "La branca 'data' encara no existeix, es crearà"
        fi
        echo "$DATA_SHA" > "$RUNNER_TEMP/data_sha"

        # Substituir web_data_NE/imatges
        IM="$P/web_data_NE/imatges"
        mkdir -p "$IM"
        find "$IM" -maxdepth 1 -type f ! \( "${PAT3D[@]}" \) -delete
        cp -r /tmp/nou-sfc/. "$IM/"
        echo "  imatges: SFC substituït"
        find "$IM" -maxdepth 1 -type f \( "${PAT3D[@]}" \) -delete
        cp -r /tmp/nou-3d/. "$IM/"
        echo "  imatges: 3D substituït"
        cp /tmp/art-manifest/manifest.json "$IM/manifest.json"
        echo "  imatges: manifest.json (SFC + 3D) aplicat"
        if [ -f /tmp/art-info/info_run.json ]; then
          cp /tmp/art-info/info_run.json "$IM/info_run.json"
          echo "  imatges: info_run.json aplicat"
        else
          echo "  info_run.json no disponible, s'omet"
        fi
        if [ "${ELIMINAR_ISOLINIES_3D:-0}" = "1" ]; then
          find "$IM" -maxdepth 1 -name 'isolines_3d_*' -delete
          echo "  imatges: isolínies 3D eliminades (ELIMINAR_ISOLINIES_3D=1)"
        fi

        # Substituir web_data_derivats (carpeta pròpia, completa) NOMÉS si els nous són vàlids
        if [ "$DER_NOU" = 1 ]; then
          rm -rf "$P/web_data_derivats"
          mkdir -p "$P/web_data_derivats/imatges"
          cp -r /tmp/nou-der/. "$P/web_data_derivats/imatges/"
          echo "  derivats: web_data_derivats/imatges substituït"
        else
          echo "  derivats: es conserva el de 'data'"
        fi

        echo "--- Resum ---"
        for c in $CARPETES; do echo "$c: $(find "$P/$c" -type f | wc -l) fitxers"; done
        echo "imatges sfc:      $(find "$IM" -name 'sfc_*.png' | wc -l) PNG"
        echo "imatges outlook:  $(find "$IM" -maxdepth 1 -name '*outlook*.png' | wc -l) PNG"
        echo "imatges 3d:       $(find "$IM" -name '3d_*.png' | wc -l) PNG"
        echo "derivats:         $(find "$P/web_data_derivats" -name '3d_*.png' | wc -l) PNG"
        du -sh "$P/web_data_NE" "$P/web_data_derivats" || true
        echo "--- Mida per tipus (a web_data_NE/imatges) ---"
        for pat in 'sfc_*.png' '*outlook*.png' 'manifest_outlook.json' 'isolines_[0-2][0-9]_*.js' 'vent_*.js' '3d_*.png' 'isolines_3d_*.js' 'sondeig_*' 'vent3d_*' 'stormmotion_*'; do
          find "$IM" -maxdepth 1 -name "$pat" -printf '%s\n' | awk -v p="$pat" '{s+=$1} END {printf "  %-26s %6d fitxers %8.1f MB\n", p, NR, s/1048576}'
        done

        # Alliberem disc: ja no necessitem els artifacts ni les còpies temporals
        rm -rf /tmp/nou-sfc /tmp/nou-3d /tmp/nou-der /tmp/art-sfc /tmp/art-3d /tmp/art-derivats

    # Reinjectem les últimes notícies (generades pel workflow de notícies i
    # guardades a data/news/noticies) dins l'index.html ACTUAL de main.
    - name: Injectar notícies
      run: |
        set -euo pipefail
        P="$GITHUB_WORKSPACE/meu-mapa/public"

        if [ ! -f /tmp/news-data/noticies.html ]; then
          echo "⚠️  No hi ha notícies a data/news/noticies: es desplega sense notícies."
          echo "    Executa un cop el workflow 'Actualitzar Notícies Meteorològiques'."
          exit 0
        fi

        rm -rf "$P/noticies"; mkdir -p "$P/noticies"
        cp -r /tmp/news-data/. "$P/noticies/"

        P="$P" python3 - <<'PYEOF'
        import os, re
        p = os.environ["P"]
        frag = open("/tmp/news-data/noticies.html", encoding="utf-8").read()
        idx_path = os.path.join(p, "index.html")
        idx = open(idx_path, encoding="utf-8").read()
        patro = r'<div id="noticiesContingut">.*?</div>\s*</div>\s*</section>'
        nou, n = re.subn(
            patro,
            lambda m: '<div id="noticiesContingut">\n' + frag + '\n</div>\n  </div>\n</section>',
            idx, count=1, flags=re.DOTALL,
        )
        if n:
            open(idx_path, "w", encoding="utf-8").write(nou)
            print("✅ Notícies injectades a index.html")
        else:
            print("⚠️  Patró '<div id=noticiesContingut>' no trobat a index.html: es desplega sense notícies")
        PYEOF

    - name: Comprovar límits de Cloudflare Pages
      run: |
        P="$GITHUB_WORKSPACE/meu-mapa/public"
        # Pages: màx. 25 MiB per fitxer i 20.000 fitxers per deploy
        find "$P" -type f -size +25M -print -delete || true
        N=$(find "$P" -type f | wc -l)
        echo "Total fitxers: $N (límit Pages: 20000)"
        if [ "$N" -gt 19000 ]; then
          echo "Massa fitxers: elimino les isolínies dels derivats (opcionals)"
          find "$P/web_data_derivats/imatges" -maxdepth 1 -name 'isolines_3d_*' -delete 2>/dev/null || true
          N=$(find "$P" -type f | wc -l)
          echo "Total fitxers ara: $N"
        fi
        if [ "$N" -gt 19000 ]; then
          echo "Encara massa fitxers: elimino les isolínies 3D (opcionals)"
          find "$P/web_data_NE/imatges" -maxdepth 1 -name 'isolines_3d_*' -delete || true
          N=$(find "$P" -type f | wc -l)
          echo "Total fitxers ara: $N"
        fi
        [ "$N" -le 19900 ] || { echo "Encara massa fitxers per a Cloudflare Pages"; exit 1; }

    - name: Deploy a Cloudflare
      id: deploy
      timeout-minutes: 80
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        WRANGLER_SEND_METRICS: "false"
      run: |
        cd meu-mapa
        for i in 1 2 3; do
          npm install -g wrangler && break
          sleep 10
        done
        for i in 1 2 3; do
          echo "--- deploy intent $i/3 ($(date -u +%H:%M:%S) UTC) ---"
          if timeout 25m wrangler pages deploy public --project-name=tempestes-cat --branch=main --commit-dirty=true; then
            echo "Deploy OK"
            exit 0
          fi
          sleep 20
        done
        echo "El deploy a Cloudflare ha fallat 3 vegades"
        exit 1

    # S'executa encara que el deploy hagi fallat: així les dades no es perden.
    #
    # Pujada en dues fases (el push gran d'un sol cop feia "HTTP 500 / hung up"):
    #   1) paquets petits cap a la branca temporal 'data-staging'
    #   2) promoció a 'data' amb un push que gairebé no envia dades
    #
    # ROBUSTESA CONTRA CURSES (el que va fallar amb "stale info"):
    #   - Abans de CADA intent de promoció es llegeix l'estat ACTUAL de 'data' i es
    #     refresquen les carpetes dels altres workflows + les notícies, de manera que
    #     la finestra entre llegir i escriure és de segons, no de minuts.
    #   - El push porta --force-with-lease amb l'SHA que acabem de llegir: si algú
    #     escriu just en aquest instant, es detecta i es repeteix.
    #   - Fins a 8 intents. TOTS els pushes són protegits amb --force-with-lease.
    #     Si hi ha una cursa persistent, falla de manera segura: mai no trepitja
    #     silenciosament un canvi aliè amb un --force incondicional.
    #
    # CANVIS (anti-timeouts):
    #   - refrescar() també fa servir fetch --filter=blob:none + checkout dispers:
    #     només baixa les carpetes dels altres workflows, 'news' i 'js'.
    #   - Timeout del pas pujat a 90 min (dins del timeout del job, 240 min).
    #
    # IMPORTANT: GitHub executa els "run" amb "bash -e". Amb "set +e" explícit els
    # errors es gestionen a mà; sense ell el primer push fallit matava el pas i els
    # reintents mai s'executaven.
    # Aquest pas REESCRIU 'data' sencera, així que inclou també 'news' (notícies).
    - name: Guardar a la branca 'data' (per paquets)
      id: guardar
      if: always() && steps.assemble.outcome == 'success'
      timeout-minutes: 90
      env:
        TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        GIT_TERMINAL_PROMPT: "0"
      run: |
        set +e
        set -uo pipefail
        P="$GITHUB_WORKSPACE/meu-mapa/public"
        REMOTE_URL="https://github.com/Tempestesscatt/joctempestes.git"
        AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
        echo "::add-mask::$AUTH"
        SHA_INICIAL=$(cat "$RUNNER_TEMP/data_sha" 2>/dev/null || echo none)
        DER_NOU=$(cat "$RUNNER_TEMP/derivats_nou" 2>/dev/null || echo 0)
        MSG="arome png $(date -u +'%Y-%m-%d %H:%M UTC')"
        CHUNK=800          # fitxers per paquet (≈ 40-80 MB)
        MAX_PROMO=8        # intents de promoció a 'data'
        T0=$(date +%s)
        tick() { echo "  ⏱  $1: $(( $(date +%s) - T0 ))s"; }

        # Només copiem el que es versiona (no els estàtics)
        rm -rf /tmp/publish
        mkdir -p /tmp/publish/js
        for c in $CARPETES; do
          if [ -d "$P/$c" ]; then cp -r "$P/$c" /tmp/publish/; fi
        done
        if [ -f "$P/js/status.js" ]; then cp "$P/js/status.js" /tmp/publish/js/status.js; fi
        # Notícies (data/news) tal com eren a 'data' quan hem assemblat
        if [ -d /tmp/news-keep/news ]; then cp -r /tmp/news-keep/news /tmp/publish/; fi
        du -sh /tmp/publish
        tick "còpia"

        cd /tmp/publish
        git init -q
        git checkout -q -b data
        git config user.name "bot-dades"
        git config user.email "bot@tempestes-cat"
        # Els PNG ja venen comprimits: res de deltes i compressió ràpida
        git config core.compression 1
        git config pack.compression 1
        git config pack.window 0
        git config pack.threads 0
        git config gc.auto 0
        git config http.version HTTP/1.1
        git config http.postBuffer 1048576000
        # Autenticació per capçalera (el token no surt a la URL)
        git config http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
        git remote add origin "$REMOTE_URL"

        find $CARPETES js news -type f 2>/dev/null | sort > /tmp/llista.txt
        TOTAL=$(wc -l < /tmp/llista.txt)
        if [ "$TOTAL" -eq 0 ]; then echo "Res a publicar"; exit 0; fi
        rm -rf /tmp/chunks
        mkdir -p /tmp/chunks
        split -l "$CHUNK" -d -a 3 /tmp/llista.txt /tmp/chunks/c_
        NCH=$(ls /tmp/chunks | wc -l)
        echo "$TOTAL fitxers en $NCH paquets"

        push_staging() {
          for k in 1 2 3 4 5 6; do
            if timeout 900 git push --force origin HEAD:refs/heads/data-staging; then return 0; fi
            echo "  push fallit (intent $k/6)"
            sleep $((k * 10))
          done
          return 1
        }

        # ── Llegeix l'SHA actual de 'data' (buit = no existeix; "ERR" = GitHub no respon)
        llegir_data() {
          local out k
          for k in 1 2 3 4 5; do
            if out=$(timeout 90 git ls-remote origin refs/heads/data 2>/dev/null); then
              echo "$out" | cut -f1
              return 0
            fi
            sleep $((k * 5))
          done
          echo "ERR"
          return 1
        }

        # ── Checkout dispers d'un commit de 'data' en un worktree del repo del workspace.
        #    Si falla, cau al checkout complet (més lent però correcte).
        checkout_dispers() {
          local dest="$1" sha="$2"
          shift 2
          rm -rf "$dest"
          git -C "$GITHUB_WORKSPACE" worktree prune
          if git -C "$GITHUB_WORKSPACE" worktree add -f --no-checkout "$dest" "$sha" \
             && git -C "$dest" sparse-checkout set --cone "$@" \
             && git -C "$dest" checkout -f HEAD; then
            return 0
          fi
          echo "  ⚠️  checkout dispers fallit: provo el checkout complet (més lent)"
          git -C "$GITHUB_WORKSPACE" worktree remove "$dest" --force 2>/dev/null
          rm -rf "$dest"
          git -C "$GITHUB_WORKSPACE" worktree prune
          git -C "$GITHUB_WORKSPACE" worktree add -f "$dest" "$sha"
        }

        # ── Baixa 'data' i copia a /tmp/publish el que NO és nostre (altres workflows + notícies).
        #    Deixa a FRESC_SHA l'SHA exacte que s'ha baixat (és el que protegirà el push).
        FRESC_SHA=""
        refrescar() {
          local k ok=0 c SP="news js"
          FRESC_SHA=""

          # Només les carpetes que no són nostres (web_data_NE sempre és nostra;
          # web_data_derivats només si n'hem generat de nous)
          for c in $CARPETES; do
            [ "$c" = "web_data_NE" ] && continue
            if [ "$c" = "web_data_derivats" ] && [ "$DER_NOU" = "1" ]; then continue; fi
            SP="$SP $c"
          done

          for k in 1 2 3; do
            if ( cd "$GITHUB_WORKSPACE" && timeout 300 git fetch --depth=1 --filter=blob:none origin data ); then ok=1; break; fi
            sleep $((k * 10))
          done
          [ "$ok" = 1 ] || return 1
          FRESC_SHA=$( cd "$GITHUB_WORKSPACE" && git rev-parse FETCH_HEAD ) || return 1
          [ -n "$FRESC_SHA" ] || return 1

          checkout_dispers /tmp/data-fresc "$FRESC_SHA" $SP || return 1

          for c in $CARPETES; do
            [ "$c" = "web_data_NE" ] && continue
            if [ "$c" = "web_data_derivats" ] && [ "$DER_NOU" = "1" ]; then continue; fi
            rm -rf "/tmp/publish/$c"
            if [ -d "/tmp/data-fresc/$c" ]; then cp -r "/tmp/data-fresc/$c" /tmp/publish/; fi
          done
          # Notícies: les més noves (potser el workflow de notícies n'ha pujat de noves)
          rm -rf /tmp/publish/news
          if [ -d /tmp/data-fresc/news ]; then cp -r /tmp/data-fresc/news /tmp/publish/; fi
          mkdir -p /tmp/publish/js
          rm -f /tmp/publish/js/status.js
          if [ -f /tmp/data-fresc/js/status.js ]; then cp /tmp/data-fresc/js/status.js /tmp/publish/js/status.js; fi

          git -C "$GITHUB_WORKSPACE" worktree remove /tmp/data-fresc --force
          return 0
        }

        # ── Commit només amb el que s'ha refrescat (no re-hasheja els 6 GB)
        commit_refresc() {
          local c
          for c in $CARPETES news js; do
            [ "$c" = "web_data_NE" ] && continue
            GIT_LITERAL_PATHSPECS=1 git add -A -- "$c" 2>/dev/null
          done
          git commit -q -m "$MSG (refresc)" 2>/dev/null
          return 0
        }

        # 1) Paquets petits cap a la branca temporal
        I=0
        for L in /tmp/chunks/c_*; do
          I=$((I + 1))
          GIT_LITERAL_PATHSPECS=1 git add -A --pathspec-from-file="$L"
          git commit -q -m "$MSG ($I/$NCH)"
          echo "=== Paquet $I/$NCH ==="
          if ! push_staging; then
            echo "::error::No s'ha pogut pujar el paquet $I/$NCH (la web SÍ s'ha desplegat a Cloudflare)"
            exit 1
          fi
          tick "paquet $I/$NCH"
        done

        # 2) Promoure a 'data'
        PUBLICAT=0
        for INTENT in $(seq 1 "$MAX_PROMO"); do
          echo "=== Promoure a 'data' (intent $INTENT/$MAX_PROMO) ==="

          ACTUAL=$(llegir_data)
          if [ "$ACTUAL" = "ERR" ]; then
            echo "  GitHub no respon (ls-remote); reintento"
            sleep $((INTENT * 10))
            continue
          fi

          if [ -z "$ACTUAL" ]; then
            echo "  'data' no existeix: es crea"
            timeout 600 git push origin HEAD:refs/heads/data
            RC=$?
          else
            if ! refrescar; then
              echo "  no s'ha pogut refrescar 'data'; reintento"
              sleep $((INTENT * 10))
              continue
            fi
            commit_refresc
            echo "  Inicial: $SHA_INICIAL"
            echo "  Ara 'data': $FRESC_SHA"
            [ "$FRESC_SHA" = "$SHA_INICIAL" ] || echo "  (altres workflows han escrit a 'data' mentre treballàvem: ja està integrat)"

            # També l'últim intent és protegit: no fem mai --force incondicional.
            timeout 600 git push --force-with-lease="data:$FRESC_SHA" origin HEAD:refs/heads/data
            RC=$?
          fi

          if [ "$RC" -eq 0 ]; then PUBLICAT=1; break; fi
          echo "  Promoció fallida (codi $RC)"
          echo "  Ara 'data' és: $(git ls-remote origin refs/heads/data 2>/dev/null | cut -f1)"
          sleep $((RANDOM % 10 + 5 + INTENT * 3))
        done
        tick "promoció"

        # Neteja de la branca temporal (si falla no passa res)
        timeout 120 git push origin --delete data-staging || true

        if [ "$PUBLICAT" != "1" ]; then
          echo "::error::No s'ha pogut promoure a 'data' després de $MAX_PROMO intents (la web SÍ s'ha desplegat a Cloudflare)"
          exit 1
        fi
        echo "Publicat a 'data' ($(git rev-parse --short HEAD))"

    - name: Completat
      run: echo "Deploy completat $(date -u)"

    # Resum final: diu quin pas ha fallat
    - name: Resum de l'execució
      if: always()
      run: |
        echo "## Resultat per pas (deploy)" >> "$GITHUB_STEP_SUMMARY"
        echo "- Assemblar web: \`${{ steps.assemble.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- Deploy Cloudflare: \`${{ steps.deploy.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- Guardar a 'data': \`${{ steps.guardar.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- Job derivats: \`${{ needs.png_derivats.result }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "Si un clonat de private-scripts ha fallat, busca el bloc DIAGNÒSTIC al pas 'Clonar private-scripts (amb diagnòstic)' del job corresponent." >> "$GITHUB_STEP_SUMMARY"