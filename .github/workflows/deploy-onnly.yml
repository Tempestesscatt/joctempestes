name: Deploy Manual

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 🔐 Checkout private submodule
      run: |
        git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git submodule update --init --recursive
    
    - name: 🔧 Instal·lar jq
      run: |
        sudo apt-get update
        sudo apt-get install -y jq
    
    - name: 📥 Descarregar dades dels últims artifacts
      run: |
        echo "📥 Buscant l'últim workflow 'CAT + ONES + MSGPACK'..."
        
        WORKFLOW_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/actions/workflows" \
          | jq -r '.workflows[] | select(.name == "CAT + ONES + MSGPACK") | .id')
        
        if [ -z "$WORKFLOW_ID" ] || [ "$WORKFLOW_ID" = "null" ]; then
          echo "⚠️ No s'ha trobat el workflow 'CAT + ONES + MSGPACK'"
          echo "📦 Continuant amb les dades del repositori..."
          exit 0
        fi
        
        echo "✅ Workflow ID: $WORKFLOW_ID"
        
        RUN_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$WORKFLOW_ID/runs?status=success&per_page=1" \
          | jq -r '.workflow_runs[0].id')
        
        if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
          echo "⚠️ No s'ha trobat cap run amb èxit del workflow 'CAT + ONES + MSGPACK'"
          echo "📦 Continuant amb les dades del repositori..."
          exit 0
        fi
        
        echo "✅ Run ID: $RUN_ID"
        
        # Crear carpeta temporal per als artifacts
        mkdir -p artifacts_temp
        cd artifacts_temp
        
        echo "📦 Descarregant llista d'artifacts..."
        ARTIFACT_URLS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
          | jq -r '.artifacts[] | .archive_download_url')
        
        if [ -z "$ARTIFACT_URLS" ]; then
          echo "⚠️ No s'han trobat artifacts"
          cd ..
          rm -rf artifacts_temp
          exit 0
        fi
        
        # Descarregar tots els artifacts
        echo "$ARTIFACT_URLS" | while read url; do
          if [ -n "$url" ]; then
            echo "📦 Descarregant artifact de: $url"
            curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -O "$url" 2>/dev/null
          fi
        done
        
        # 🔥 IMPORTANT: Descomprimir CADA artifact a la carpeta correcta
        echo "📂 Descomprimint artifacts a meu-mapa/public/..."
        for zip in *.zip; do
          if [ -f "$zip" ]; then
            echo "   📂 Descomprimint $zip..."
            # Descomprimir directament a meu-mapa/public/
            unzip -o "$zip" -d "../meu-mapa/public/" 2>/dev/null || true
            
            # Mostrar què s'ha descomprimit
            echo "   📄 Contingut del zip:"
            unzip -l "$zip" 2>/dev/null | head -10 || true
          fi
        done
        
        cd ..
        rm -rf artifacts_temp
        
        echo "✅ Artifacts descarregats i descomprimits"
    
    - name: 📂 Verificar dades descarregades
      run: |
        echo "📊 VERIFICACIÓ DE DADES:"
        
        # Comprovar si web_data_NE existeix i quants fitxers té
        if [ -d "meu-mapa/public/web_data_NE" ]; then
          COUNT_NE=$(find meu-mapa/public/web_data_NE -type f 2>/dev/null | wc -l)
          echo "📁 web_data_NE: $COUNT_NE fitxers"
          # Mostrar alguns fitxers
          echo "📄 Mostrant fitxers de web_data_NE:"
          ls -la meu-mapa/public/web_data_NE/ 2>/dev/null | head -10 || echo "   (buit)"
        else
          echo "📁 web_data_NE: ❌ NO EXISTEIX"
          # Buscar on s'han descomprimit les dades
          echo "🔍 Buscant web_data_NE a tot arreu..."
          find . -name "web_data_NE" -type d 2>/dev/null | head -5
        fi
        
        if [ -d "meu-mapa/public/web_data_ones" ]; then
          COUNT_ONES=$(find meu-mapa/public/web_data_ones -type f 2>/dev/null | wc -l)
          echo "📁 web_data_ones: $COUNT_ONES fitxers"
        else
          echo "📁 web_data_ones: ❌ NO EXISTEIX"
        fi
        
        echo "📁 js/status.js: $([ -f meu-mapa/public/js/status.js ] && echo '✅ existeix' || echo '❌ no existeix')"
    
    - name: 📂 Alternativa - Buscar dades en altres carpetes
      run: |
        echo "🔍 Buscant dades a tot arreu..."
        echo ""
        echo "📁 Directoris que contenen 'web_data':"
        find . -name "*web_data*" -type d 2>/dev/null | while read dir; do
          count=$(find "$dir" -type f 2>/dev/null | wc -l)
          echo "   $dir: $count fitxers"
        done
        
        echo ""
        echo "📁 Si les dades estan a una altra carpeta, copiar-les a public/"
        # Si les dades estan a artifacts_temp o similar, copiar-les
        if [ -d "artifacts_temp" ]; then
          echo "📦 Movent dades de artifacts_temp a public/"
          find artifacts_temp -name "*.msgpack.gz" -o -name "*.json.gz" 2>/dev/null | while read file; do
            echo "   📄 $file"
          done
        fi
        
        # Comprovar si les dades estan a la carpeta arrel
        if [ -d "web_data_NE" ] && [ "$(ls -A web_data_NE 2>/dev/null)" ]; then
          echo "📦 web_data_NE trobat a l'arrel! Copiant a public/..."
          mkdir -p meu-mapa/public/web_data_NE
          cp -r web_data_NE/* meu-mapa/public/web_data_NE/
          echo "✅ Copiat!"
        fi
        
        if [ -d "web_data_ones" ] && [ "$(ls -A web_data_ones 2>/dev/null)" ]; then
          echo "📦 web_data_ones trobat a l'arrel! Copiant a public/..."
          mkdir -p meu-mapa/public/web_data_ones
          cp -r web_data_ones/* meu-mapa/public/web_data_ones/
          echo "✅ Copiat!"
        fi
    
    - name: 📊 Resum de dades abans del deploy
      run: |
        echo ""
        echo "═══════════════════════════════════════════════════════════════"
        echo "  📊 RESUM DE DADES ABANS DEL DEPLOY"
        echo "═══════════════════════════════════════════════════════════════"
        echo "🌡️  web_data_NE:       $(find meu-mapa/public/web_data_NE -type f 2>/dev/null | wc -l) fitxers"
        echo "🌊  web_data_ones:     $(find meu-mapa/public/web_data_ones -type f 2>/dev/null | wc -l) fitxers"
        echo "📦  TOTAL fitxers:     $(find meu-mapa/public -type f 2>/dev/null | wc -l) fitxers"
        echo ""
        echo "📁 Directoris principals:"
        for dir in meu-mapa/public/*/; do
          if [ -d "$dir" ]; then
            count=$(find "$dir" -type f 2>/dev/null | wc -l)
            echo "  $(basename $dir): $count fitxers"
          fi
        done
        echo "═══════════════════════════════════════════════════════════════"
    
    - name: 📥 Sincronitzar amb remot
      run: |
        cd meu-mapa
        git pull --rebase origin main 2>/dev/null || git pull --rebase origin master 2>/dev/null || true
        echo "✅ Sincronitzat"

    - name: 🚀 DEPLOY a Cloudflare
      run: |
        cd meu-mapa
        npm install -g wrangler
        echo "📦 Desplegant a Cloudflare Pages..."
        echo "📁 Contingut de public abans del deploy:"
        echo "   web_data_NE: $(find public/web_data_NE -type f 2>/dev/null | wc -l) fitxers"
        echo "   web_data_ones: $(find public/web_data_ones -type f 2>/dev/null | wc -l) fitxers"
        echo ""
        
        wrangler pages deploy public --project-name=tempestes-cat --branch=main --commit-dirty=true
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    
    - name: 🎉 Confirmació final
      run: |
        echo ""
        echo "═══════════════════════════════════════════════════════════════"
        echo "  🎉 DEPLOY COMPLETAT AMB ÈXIT!"
        echo "═══════════════════════════════════════════════════════════════"
        echo ""
        echo "🌐 Web desplegada a:"
        echo "   https://tempestes-cat.pages.dev/"
        echo ""
        echo "📊 Estadístiques finals:"
        echo "   📦 web_data_NE: $(find meu-mapa/public/web_data_NE -type f 2>/dev/null | wc -l) fitxers"
        echo "   📦 web_data_ones: $(find meu-mapa/public/web_data_ones -type f 2>/dev/null | wc -l) fitxers"
        echo "   📦 status.js: $([ -f meu-mapa/public/js/status.js ] && echo '✅' || echo '❌')"
        echo ""
        echo "═══════════════════════════════════════════════════════════════"