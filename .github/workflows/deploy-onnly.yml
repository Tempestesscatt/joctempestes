name: Deploy Manual

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: 🔐 Checkout private submodule
      run: |
        git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git submodule update --init --recursive
    
    - name: 📊 Resum de dades abans del deploy
      run: |
        echo "📊 RESUM DE DADES:"
        echo "🛰️  bt62_fc:        $(find meu-mapa/public/bt62_fc -type f 2>/dev/null | wc -l) fitxers"
        echo "🛰️  bt108_previsio:  $(find meu-mapa/public/bt108_previsio -type f 2>/dev/null | wc -l) fitxers"
        echo "🛰️  bt62_previsio:   $(find meu-mapa/public/bt62_previsio -type f 2>/dev/null | wc -l) fitxers"
        echo "🌡️  web_data:        $(find meu-mapa/public/web_data -type f 2>/dev/null | wc -l) fitxers"
        echo "🌡️  web_data2:       $(find meu-mapa/public/web_data2 -type f 2>/dev/null | wc -l) fitxers"
        echo "📦 TOTAL:            $(find meu-mapa/public -type f 2>/dev/null | wc -l) fitxers"
        echo ""
        echo "📁 Directoris:"
        for dir in meu-mapa/public/*/; do
          if [ -d "$dir" ]; then
            count=$(find "$dir" -type f 2>/dev/null | wc -l)
            echo "  $(basename $dir): $count fitxers"
          fi
        done
    
    - name: 📥 Sincronitzar amb remot
      run: |
        cd meu-mapa
        git pull --rebase origin main 2>/dev/null || git pull --rebase origin master 2>/dev/null || true
        echo "✅ Sincronitzat"

    - name: 🚀 DEPLOY a Cloudflare
      run: |
        cd meu-mapa
        npm install -g wrangler
        echo "📦 Desplegant a Cloudflare Pages..."
        wrangler pages deploy public --project-name=tempestes-cat --branch=main --commit-dirty=true
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    
    - name: 🎉 Confirmació final
      run: |
        echo "🎉 DEPLOY COMPLETAT!"
        echo ""
        echo "🌐 Web desplegada a:"
        echo "   https://tempestes-cat.pages.dev/"
        echo ""
        echo "📊 Estadístiques:"
        echo "   📦 TOTAL fitxers: $(find meu-mapa/public -type f 2>/dev/null | wc -l)"