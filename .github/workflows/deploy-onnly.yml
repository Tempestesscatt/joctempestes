name: Deploy Manual

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 🔐 Checkout private submodule
      run: |
        git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git submodule update --init --recursive

    - name: 📥 Afegir dades de la branca 'data' (sense esborrar res)
      run: |
        P="meu-mapa/public"
        CARPETES="web_data_NE webdata_waves avis previsions_catalunya gfsmaps gfsESPmaps"

        git fetch origin data
        rm -rf /tmp/data-branch
        git worktree add /tmp/data-branch origin/data

        mkdir -p "$P/js"
        for c in $CARPETES; do
          mkdir -p "$P/$c"
          cp -r /tmp/data-branch/$c/. "$P/$c/" 2>/dev/null || echo "⚠️  $c no trobat a data"
        done
        cp /tmp/data-branch/js/status.js "$P/js/status.js" 2>/dev/null || echo "⚠️  status.js no trobat a data"

        git worktree remove /tmp/data-branch --force
        echo "✅ Dades de 'data' afegides sobre main (només filesystem, no es commiteja res)"

    - name: 📊 Resum abans del deploy
      run: |
        P="meu-mapa/public"
        echo "--- Arrel de public/ ---"
        find "$P" -maxdepth 1 -type f
        [ -f "$P/selector.html" ] && echo "✅ selector.html present" || echo "❌ selector.html NO present"
        echo "--- Carpetes ---"
        for dir in "$P"/*/; do
          echo "  $(basename "$dir"): $(find "$dir" -type f | wc -l) fitxers"
        done
        echo "TOTAL: $(find "$P" -type f | wc -l) fitxers"

    - name: 🚀 DEPLOY a Cloudflare
      run: |
        cd meu-mapa
        npm install -g wrangler
        wrangler pages deploy public --project-name=tempestes-cat --branch=main --commit-dirty=true
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    - name: 🎉 Confirmació
      run: echo "🎉 Deploy completat a https://tempestes-cat.pages.dev/"