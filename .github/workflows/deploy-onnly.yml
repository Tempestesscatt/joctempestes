name: Deploy Manual

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: 🔐 Checkout private submodule
      run: |
        git config --global url."https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"
        git submodule update --init --recursive

    - name: 📥 Traer dades de la branca 'data'
      run: |
        git fetch origin data
        rm -rf /tmp/data-branch
        git worktree add /tmp/data-branch origin/data
        mkdir -p meu-mapa/public/web_data_NE meu-mapa/public/webdata_waves meu-mapa/public/js
        cp -r /tmp/data-branch/web_data_NE/. meu-mapa/public/web_data_NE/ 2>/dev/null || echo "⚠️  web_data_NE no trobat a la branca data"
        cp -r /tmp/data-branch/webdata_waves/. meu-mapa/public/webdata_waves/ 2>/dev/null || echo "⚠️  webdata_waves no trobat a la branca data"
        cp /tmp/data-branch/js/status.js meu-mapa/public/js/status.js 2>/dev/null || echo "⚠️  status.js no trobat a la branca data"
        git worktree remove /tmp/data-branch --force
        echo "✅ Dades de la branca 'data' aplicades sobre main (només al filesystem, no es commiteja res)"
      continue-on-error: true

    - name: 📊 Resum de dades abans del deploy
      run: |
        echo "📊 RESUM DE DADES:"
        echo "🌡️  web_data_NE:    $(find meu-mapa/public/web_data_NE -type f 2>/dev/null | wc -l) fitxers"
        echo "🌊 webdata_waves:   $(find meu-mapa/public/webdata_waves -type f 2>/dev/null | wc -l) fitxers"
        echo "📄 status.js:       $(ls -la meu-mapa/public/js/status.js 2>/dev/null || echo 'NO TROBAT')"
        echo "📦 TOTAL:           $(find meu-mapa/public -type f 2>/dev/null | wc -l) fitxers"
        echo ""
        echo "📁 Directoris:"
        for dir in meu-mapa/public/*/; do
          if [ -d "$dir" ]; then
            count=$(find "$dir" -type f 2>/dev/null | wc -l)
            echo "  $(basename "$dir"): $count fitxers"
          fi
        done

    - name: 🚀 DEPLOY a Cloudflare
      run: |
        cd meu-mapa
        npm install -g wrangler
        echo "📦 Desplegant a Cloudflare Pages..."
        wrangler pages deploy public --project-name=tempestes-cat --branch=main --commit-dirty=true
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    - name: 🎉 Confirmació final
      run: |
        echo "🎉 DEPLOY COMPLETAT!"
        echo ""
        echo "🌐 Web desplegada a:"
        echo "   https://tempestes-cat.pages.dev/"
        echo ""
        echo "📊 Estadístiques:"
        echo "   📦 TOTAL fitxers: $(find meu-mapa/public -type f 2>/dev/null | wc -l)"