name: Deploy Manual

on:
  workflow_dispatch:

permissions:
  contents: write

# Mateix grup que "Actualitzar Notícies Meteorològiques": no s'executen alhora,
# així el deploy manual mai pot trepitjar un deploy de notícies (ni al revés).
concurrency:
  group: deploy-news-${{ github.ref }}
  cancel-in-progress: false

env:
  CARPETES: "web_data_NE webdata_waves avis gfsmaps gfsESPmaps previsions_catalunya web_data_GFS web_data_derivats"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}
        fetch-depth: 1

    - name: 📥 Afegir dades de la branca 'data'
      run: |
        set -euo pipefail
        P="$GITHUB_WORKSPACE/meu-mapa/public"
        mkdir -p "$P/js"

        # Si GitHub no respon, ABORTEM: no volem desplegar una web incompleta
        OK=0
        for i in 1 2 3 4 5; do
          if git fetch --depth=1 origin data; then OK=1; break; fi
          sleep 10
        done
        [ "$OK" = 1 ] || { echo "❌ No puc baixar la branca data"; exit 1; }

        git worktree prune
        rm -rf /tmp/data-branch
        git worktree add -f /tmp/data-branch FETCH_HEAD

        for c in $CARPETES; do
          if [ -d "/tmp/data-branch/$c" ]; then
            rm -rf "$P/$c"; mkdir -p "$P/$c"
            cp -r "/tmp/data-branch/$c/." "$P/$c/"
          else
            echo "⚠️  $c no trobat a data (s'ignora)"
          fi
        done
        cp /tmp/data-branch/js/status.js "$P/js/status.js" 2>/dev/null || echo "⚠️  status.js no trobat a data"

        # Guardem una còpia de les notícies abans d'eliminar el worktree
        rm -rf /tmp/news-data
        if [ -d /tmp/data-branch/news/noticies ]; then
          cp -r /tmp/data-branch/news/noticies /tmp/news-data
        fi

        git worktree remove /tmp/data-branch --force

        # Seguretat: sense dades del visor NO es desplega mai
        if [ -z "$(ls -A "$P/web_data_NE/imatges" 2>/dev/null)" ]; then
          echo "❌ web_data_NE/imatges és buit: no desplego per no deixar el visor sense dades"
          exit 1
        fi
        echo "✅ Dades de 'data' afegides (només filesystem, no es commiteja res)"

    # Reinjectem les últimes notícies (generades pel workflow de notícies)
    # dins l'index.html ACTUAL de main, sense trepitjar-ne el disseny ni el JS.
    - name: 📰 Injectar notícies
      run: |
        set -euo pipefail
        P="$GITHUB_WORKSPACE/meu-mapa/public"

        if [ ! -f /tmp/news-data/noticies.html ]; then
          echo "⚠️  No hi ha notícies a data/news/noticies: es desplega sense notícies."
          echo "    Executa un cop el workflow 'Actualitzar Notícies Meteorològiques'."
          exit 0
        fi

        rm -rf "$P/noticies"; mkdir -p "$P/noticies"
        cp -r /tmp/news-data/. "$P/noticies/"

        P="$P" python3 - <<'PYEOF'
        import os, re
        p = os.environ["P"]
        frag = open("/tmp/news-data/noticies.html", encoding="utf-8").read()
        idx_path = os.path.join(p, "index.html")
        idx = open(idx_path, encoding="utf-8").read()
        patro = r'<div id="noticiesContingut">.*?</div>\s*</div>\s*</section>'
        nou, n = re.subn(
            patro,
            lambda m: '<div id="noticiesContingut">\n' + frag + '\n</div>\n  </div>\n</section>',
            idx, count=1, flags=re.DOTALL,
        )
        if n:
            open(idx_path, "w", encoding="utf-8").write(nou)
            print("✅ Notícies injectades a index.html")
        else:
            print("⚠️  Patró '<div id=noticiesContingut>' no trobat a index.html: es desplega sense notícies")
        PYEOF

    - name: 📊 Resum abans del deploy
      run: |
        P="$GITHUB_WORKSPACE/meu-mapa/public"
        echo "--- Arrel de public/ ---"
        find "$P" -maxdepth 1 -type f
        [ -f "$P/selector.html" ] && echo "✅ selector.html present" || echo "❌ selector.html NO present"
        grep -q 'id="noticiesContingut"' "$P/index.html" && echo "✅ index.html té el bloc de notícies" || echo "⚠️ index.html sense bloc de notícies"
        echo "--- Carpetes dinàmiques ---"
        for c in $CARPETES noticies; do
          echo "  $c: $(find "$P/$c" -type f 2>/dev/null | wc -l) fitxers"
        done
        echo "TOTAL: $(find "$P" -type f | wc -l) fitxers"

    - name: 🔎 Comprovar límits de Cloudflare Pages
      run: |
        P="$GITHUB_WORKSPACE/meu-mapa/public"
        # Pages: màx. 25 MiB per fitxer i 20.000 fitxers per deploy
        find "$P" -type f -size +25M -print -delete || true
        N=$(find "$P" -type f | wc -l)
        echo "Total fitxers: $N (límit Pages: 20000)"
        if [ "$N" -gt 19000 ]; then
          echo "Massa fitxers: elimino isolínies opcionals (derivats, 3D i GFS)"
          find "$P/web_data_derivats/imatges" -maxdepth 1 -name 'isolines_3d_*' -delete 2>/dev/null || true
          find "$P/web_data_NE/imatges" -maxdepth 1 -name 'isolines_3d_*' -delete 2>/dev/null || true
          find "$P/web_data_GFS/imatges" -maxdepth 1 -name 'isolines_*' -delete 2>/dev/null || true
          N=$(find "$P" -type f | wc -l)
          echo "Total fitxers ara: $N"
        fi
        [ "$N" -le 19900 ] || { echo "❌ Encara massa fitxers per a Cloudflare Pages"; exit 1; }

    - name: 🚀 DEPLOY a Cloudflare
      timeout-minutes: 70
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        WRANGLER_SEND_METRICS: "false"
      run: |
        cd meu-mapa
        for i in 1 2 3; do npm install -g wrangler && break; sleep 10; done
        for i in 1 2 3; do
          echo "--- deploy intent $i/3 ($(date -u +%H:%M:%S) UTC) ---"
          if timeout 25m wrangler pages deploy public --project-name=tempestes-cat --branch=main --commit-dirty=true; then
            echo "✅ Deploy OK"; exit 0
          fi
          sleep 20
        done
        echo "❌ El deploy ha fallat 3 vegades"; exit 1

    - name: 🎉 Confirmació
      run: echo "🎉 Deploy completat a https://tempestes-cat.pages.dev/ ($(date -u))"